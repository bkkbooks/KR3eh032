body:
  text: 卷七文七丹痧斑疹辨丹痧斑疹四者丹與痧類斑與疹類痧輕而丹重疹輕而斑重丹與斑皆出於膚平而成片痧與疹皆高出於膚而成點痧自痧丹自丹也渾言之則通曰痧亦疹自疹斑自斑也渾言之則通曰疹而痧之原出於肺因先有痧邪而始發表熱治痧者當治肺以升達為主而稍佐以清涼疹之原出於胃因表熱不解已成裡熱而蘊為疹邪治疹者當治胃以清涼為主而少佐以升達痧於當主表散時不可早用寒瀉疹於當主苦泄時不可更從辛散大旨升達主升葛柴之屬清涼主芩梔桑丹之屬惟宗仲景葛根芩連一法出入增減則於此際之細微層折皆能曲中而無差忒此治痧疹之要道也自來治此證者主辛散則禁寒泄主寒泄則禁辛散故兩失之至不僅為痧與疹而為丹為斑則皆裡熱之甚惟大劑寒藥乃克勝任非第痧疹之比矣有是四者脘必悶四者之齊與不齊以脘悶之解與未解為辨有是四者熱必壯四者之解與不解以汗出之透與未透為辨故當正治痧疹時必兼行升清兩法表裡交治務使痧疹與汗並達惟痧疹當發出之際病人每悶極不可耐稍一輾轉反側其點即隱病邪反從內陷此正不必有外來之風也即袖端被角間略有疏忽其汗便縮一縮之後旋即周身皆干此時厥有二弊一則汗方出時毛孔盡開新風易入一則汗已大出不可再汗非特痧疹立隱且津液既泄熱必益熾後此變端皆從此起病家只道未愈醫家亦但說變病孰知皆汗不如法之故耶凡病之宜從汗解者無不皆然而兼痧疹者尤甚故特於此發之近見有刻爛喉痧證輯要者教人宜從表散固不誤也而又切戒寒涼則並表散而亦鮮當矣開首先載葉天士先生醫案一則云此證一團火熱內熾醫見火熱之甚投以犀羚芩連梔膏之類輒至隱伏昏閉轉眼凶危孰知初起時解肌散表溫毒外達多有生者火熱之甚寒涼強遏遂至不救良可慨也云云此言恐是假託若葉先生當不如是之謬也夫此證之在初起宜從解肌散表時但有表熱無裡熱自當從表解散固無所謂毒也若既云一團火熱內熾則有表熱復有裡熱而其毒成矣熱既成毒安得不用寒涼乃又曰火熱之甚寒涼強遏只此八字如何連貫況以犀角之本不當用者與他藥渾作一例遂並芩連膏梔之當用者而並斥之既不識病又不識藥一例加以良可慨也等字後人遂以此為葉先生語而信之則此病從此無治法矣試思仲景於青龍湯已用石膏於白虎湯不復用麻桂蓋於宜青龍時已不獨是表熱宜白虎時直是獨有裡熱豈有葉先生而並表熱裡熱之不分者哉況明明說是一團火熱而尚不用寒涼則寒涼之藥直到何時方可用耶凡病已到裡熱地步而仍一味表散則汗大出而液且涸熱更灼所有溫毒何由消散既不外達自當內陷遂至不救皆此等讕語害之也此冊本為爛喉而發乃後半插入委中少商挑痧刮痧等語並載藿香正氣一方則此痧非彼痧尚且渾而一之似此妄談直堪捧腹近又有重刻痧喉論者前半意亦略同獨後半載祖鴻範一論則平允之至因亟登之祖云此證解表清熱無非兩法而已初起自須透達即或宜兼清散總以散字為重及外閉之風寒已解內蘊之邪火方張惟有寒瀉方能泄熱熱一盡而病自愈若仍執辛散之方則火得風而愈熾炎勢燎原殺人最暴要惟於先後之間隨機應變斯各中其窾耳此則勝於他說萬萬若彼之妄戒寒涼者正未識此奧窔也噦逆有冷熱兩種說噦有胃風胃火之噦有因病致虛之噦陽明病之最危者也說文噦氣牾也玉篇十七薛噦逆氣也唐韻於月切音黦集韻黦又音郁與詩噦噦之讀作音玉篇所謂火外切鳥語也者不同蓋噦有郁音即有郁義音義既明然後以傷寒論若嘔若吐若干嘔若咳若噫若噎等病同為氣逆上衝及氣息不調者分別觀之乃知噦之一證為病最重治之必分冷熱兩途投劑若差動關生死徒曰氣逆而已正不足以救此病之危也先論嘔吐東垣云嘔者聲物兼出吐者物出無聲精言之則吐為直衝而出嘔必作勢而出嘔有聲吐無聲而皆有物則嘔與吐分而皆非噦也再論乾嘔東垣以其聲出而無物即與噦並言徒以噦亦聲出無物耳然噦與乾嘔雖同為聲出無物而病則截然兩種王安道謂乾嘔為噦之微噦為乾嘔之甚雖分微甚而仍作一病觀不思乾嘔之有聲也為物不出而有聲其聲惡濁而若斷噦之有聲也為但有聲而無物其聲短促而聯屬病大不同豈僅微甚之謂乎至成無己且云噦即咳逆則咳逆兩字屢見於金匱痰飲病中與嗽則不甚相遠與噦則大相懸絕尤不能視為一病安道駁之良是然安道又出吃忒兩字謂咳逆即是吃忒吃忒非即是噦豈知噦正可稱吃忒吃忒正不可名咳若以咳逆謂即吃忒則仍以噦為咳而誤亦與成氏同矣況內經治噦有以草刺鼻取嚏之法又曰無息而疾引之立已大驚之亦已則未聞以咳者而可以嚏止可以疾引大驚而止者內經論咳又有咳逆甚而見血一條正以咳之不止血隨咳出又未聞以噦之不止而因噦見血者也余讀內則子事父母不敢噦噫嚏咳既說噦又說咳則噦之非即是咳不更可意會歟夫吃忒已是後世俗稱而後世方言又各不同即如吾蘇俗稱於安道所謂吃忒者又稱為打呃打呃又稱為冷呃自有冷呃之稱而一見有呃遂以為呃無不冷競用丁香柿蒂湯之辛溫施諸陽明病熱極垂危之際則稱名之不正害之也不知呃之出於平時者則如靈樞所云谷入於胃胃氣上注於肺今有故寒氣與新穀氣相亂氣並相逆而為噦者則無端呃作並不兼見他病此噦定屬於寒則謂之冷呃而予以丁香之溫正合即不然而用金匱嘔吐噦一門生薑半夏湯橘皮竹茹湯亦有合者然此僅噦之輕淺者耳若在傷寒溫熱病中則有冷熱兩途而其為病也大矣如陽明病不能食攻其熱必噦又曰大吐大下之極虛復極汗出者因得噦此則因攻致虛幾於虛脫即名之以冷呃亦無不可因其本宜於溫中也獨有太陽中風火劫發汗後久則譫語甚者致噦又若陽明中風有潮熱嗜臥一身及面目悉黃小便難時時噦又若腹滿不能食欲飲水與水則噦又若陽明不屎腹滿加噦者不治此則皆為胃中實熱不急用大小承氣撤其熱即死而亦因冷呃二字之相沿竟若不呃則已呃則未有不冷者而仍用丁香之溫劑否則僅用橘半竹茹之輕劑則其誤於稱名之不正者害且不可勝言前人只從氣逆上圖治安得及救此陽明最危之病耶且仲景時之噦多得之極吐汗下屬冷者多今則每由失汗失下得之故屬熱者多余於同治癸亥在上海病中見噦不省人事者旬日餘子潤庠以大承氣一服得生越八年辛未余友青浦胡海霞明經亦見此證於溫病中飛艇延治至則醫已連進丁香且議投肉桂矣余曰此證必見五臭全方可活謂臭汗臭痰臭屎臭尿及放空亦臭也乃僅予以芩連丹芍少佐元明粉而未及三日五臭已全病若失則其病之為胃風胃火而非冷呃不甚明哉嗟乎此證之以稱為冷呃而死者不知凡幾惟其愈用辛熱愈見寒象故病家終不悟耳世又有以噦為噫者說文噫飽食息也一切經音義引作飽出息玉篇同此皆傷食所致與魯論孔子之噫一為傷痛聲一為心不平聲者異亦與詩噫嘻成王莊子大塊噫氣漢梁鴻作五噫歌並異而皆不可以噦當之又有以噦為噎者噎則說文曰飯窒也通俗文塞喉曰噎續漢書禮儀志民年八十九十賜玉杖端以鳩鳥為飾鳩不噎之鳥也後漢書明帝記祝哽在前祝噎在後亦皆防其傷食與詩王風中心如噎傳云噎憂不能息也者尤不可以噦當之也兩說亦皆非也至呃字僅見玉篇中廣韻無呃字有呝字皆於革切呃之與噦字雖不同而其為氣逆則同玉篇釋作雞聲廣韻釋作鳥聲正是形容短促而聯屬之聲併為氣逆所致而所關係者尤在冷熱兩途明乎此而知噦即吾蘇之所謂呃獨不得囿於吾蘇之所謂冷呃則宜溫宜清之辨即可生可死之分病家於此最危之證其可安於不知也哉周鶴亭太史云明人作正字通識者謂其疏舛頗多不可為典要獨其於噦字釋作呃逆則大可從也信然霍亂論霍亂一證有寒有熱熱者居其九寒者居其一凡由高堂大廈乘涼飲冷而得之者仲景則有理中四逆諸方後世亦有漿水大順復元冷香飲子諸方病多屬寒藥則皆宜用熱若夫春分以後秋分以前少陽相火少陰君火太陰濕土三氣合行其令天之熱氣則下降地之濕氣則上騰人在氣交之中清氣在陰濁氣在陽陰陽反戾清濁相干氣亂於中而上吐下瀉治此者宜和陰陽分清濁以定其亂亂定即無不愈此則病非寒也而亦非盡用寒藥也即如薷藿平陳胃苓等湯習用之劑亦皆溫散溫通特不可用薑附丁萸之大辛大熱者耳又有不吐不瀉而揮霍撩亂者則多得之飽食之後凡夏月猝然冒暑惟食填太陰亦曰飽食填息一證為病最速為禍最酷而人多忽之即有知者亦僅以停食為言絕不信其為閉證之急者閉則手足肢冷六脈俱伏甚則喜近烈日此乃邪閉而氣道不宣非氣脫而脈絕不續其畏寒也正其熱之甚也閉與脫之分一為邪閉而脈伏一為氣脫而脈絕脫者誤開氣散而死閉者誤補邪錮而死人之死於邪閉定較氣脫而死者易且較氣脫而死者速病家不明此理一見邪閉未有不疑其脫者況乎人之將死總可云脫孰肯於此時再說是閉於是乎病之亟宜解利者雖有明眼何能違眾誰知此證只欠一吐而已自吐法之不行而凡病之可以一吐愈者輕且一用消導而亦愈者往往不死於補即死於溫原其所以用溫之故則以陽氣退伏於內不能外達於表脈道每先不利而反見畏寒此時外治之法熨蔥灼艾熱湯沃洗類皆用溫乃以此為據遂謂用藥自宜於溫不思外治湯水本無用寒之理豈可因外治之必當用熱而信以為服食之亦宜於熱哉此外更有四肢厥逆甚至周身如冰而竟不惡寒反有惡熱者此更是內真熱外假寒即厥陰經中熱深厥深之象輕亦熱微而厥微豈獨不用四逆理中即薑湯米飲及五苓散中之桂枝亦不可用而且宜用苦寒之劑佐以挑痧刮痧等法刺出惡血以泄熱毒者此則並不宜於溫散溫通矣同治壬戍江蘇滬瀆時疫盛行綿延而至癸甲余嘗以石膏芩連清而愈之者則暑濕熱之霍亂也以涼水調膽礬吐而愈之者則飽食填息之霍亂也其肢皆冷而其脈皆伏維時大醫立方競用丁萸桂附日斃數人問其所以然則曰君不見夏月井水乎何以天令如此之熱而井水如此之寒也夏月伏陰在內也張介賓曰人見此時之天熱不見此人之藏寒天下惟格物能致知諸君請退毋溷乃公明日厥不還灸之不出冷且益甚則曰如此熱藥體尚不溫設更投涼其冷何若病家聞之曰唯唯否否卒未有能破其扃者素問六元正紀大論曰太陰所至為中滿霍亂吐下又曰土鬱之發民病霍亂嘔吐靈樞經脈篇曰足太陰厥氣上逆則為霍亂此不定其為寒為熱者也惟氣交變大論六己年少宮運歲土不及民病飧泄霍亂是為寒中然值己巳己亥相火在泉民即無病則可見此證之屬寒者少而屬熱者多矣至於傷寒論中所載霍亂則有既吐且利而大汗出脈欲絕者有吐利汗出發熱惡寒四肢拘急手足厥冷者有惡寒脈微利止亡陰者有下利清穀汗出而厥吐已下斷汗出而厥者此必有吐有利有汗有惡寒方是理中湯四逆湯四逆加參四逆加膽汁諸方用以運行上下通達內外為寒邪直入厥陰之霍亂若不然者則仍暑濕熱之三氣為之不可固執為寒輒死於一口之生薑紅糖米飲湯也王孟英隨息居於此證獨有見地余曾摭其勝而為之說暑瘧暑痢論瘧痢之不治多由於以實作虛夫瘧有虛瘧痢有虛痢無不因乎病久而成陰虛則宜補陰陽虛則宜補陽皆所以治瘧痢也若夏秋之交感受暑濕熱之瘧痢則是瘧痢之實者而亦作虛治即不然亦不敢作實治則其瘧其痢勢必久而不除終則果變為虛或成瘧母或成休息痢雖已受累無窮亦尚不為大害然竟有淹纏而殞其生者蓋實本不死而惟以實作虛則竟無不死也周禮秋時有瘧寒疾賈公彥疏惟火沴金蓋以秋金為收令而大火西流蘊崇於內遂病為瘧瘧脈自弦弦數多熱宜涼散弦遲多寒宜溫散無痰不作瘧宜導痰瘧不為汗衰宜取汗取汗之法不外柴胡一味用以和解少陽仲景於少陽禁汗者禁麻黃非禁柴胡也非禁柴胡之屬也如更挾暑必用香薷葉先生於暑不用香薷於瘧不用柴胡者以先生重名人之以瘧延治必已過薷柴之會若他醫當病之初輒據此以為香薷柴胡葉先生所不用而直認作不可用則此意先昧然矣痢者古稱滯下下字亥駕切去聲讀作自上下下句之第三字蓋謂滯而不下非謂下之多也凡裡急腹痛後重頻並虛坐努責數至圊而不能便皆以滯而不下之故不可升提兜澀不可滋膩溫補必用厚朴以泄滿枳實以導滯檳榔以達下重則須用生軍其挾暑者必兼香薷飲天水散諸方此則治暑痢之要道也彼四神丸烏梅丸則治五更泄瀉厥冷久利與此時無涉如其腹痛之甚正是滯下之甚當從痛則不通通則不痛之說不可誤引痛者寒也有寒故痛之文倪涵初瘧痢三方雖未賅括大段不差誠以瘧無截法以發為截痢無止法以通為止發正所以截之也通正所以止之也欲截欲止者不可誤也夏秋瘧痢尋常之病耳此種淺語本不當說乃病家於暑瘧暑痢亦無不以虛寒為詞將腑病認作臟病故亦不得不辨耳余嘗遇一月一作之瘧三年不愈之痢其故何耶始不過以實作虛而已矣若夫瘧之久而果為虛瘧即用補中益氣湯仍恃升柴痢之久而果為虛痢即用七味白朮散仍賴葛根其理可知已總之因虛而死者其死也遲而難以實作虛者其死也速而易非真一名為虛即可立於無過之地也病家而不知也尚何望哉咳嗽論經云十二經皆有咳不獨肺也但以肺為華蓋其位最高為諸氣出入之道路故咳無不涉於肺耳咳與嗽有別其標皆因乎痰有聲有痰者謂之嗽有聲無痰者謂之咳而痰與飲又有別其本皆出於水水之稠者為痰水之稀者為飲稠則嗽之即出稀則非咳不出且有咳而不出者人遂謂為乾咳共目為肺之燥而不知其為脾之濕非獨濕與干相反且並水飲兩字從此亦不聞於世而其所用藥無非滋潤之品飲證得之愈潤愈燥遂成炎上之火及其火既上炎而煎熬津液變為骨蒸臥則喘作動則汗出痰氣腥穢喉破失音變為癰痿勞怯之狀皆可預計病至此不可為矣夫咳嗽初起本為微疾治之之法皆在金匱篇中金匱於咳嗽分作兩門一在肺癰肺痿門為第七一在痰飲門為第十二同一咳嗽也其所以必兩見者豈無故哉詳玩兩門方治一主達表散壅一主滌飲利氣獨不於此時一用滋補乃時人一見咳嗽絕不用達表利氣法而輒以兜鈴蛤殼紫菀款冬阿膠沙參二冬二地龜板鱉甲之屬凡與咳嗽為仇者罔不畢集猥云傷風不醒便成勞未幾而果成勞病是其所以成勞者藥為之非病為之也及其既成勢無可救孰知勞之為病本不能救於已成之後而必使之不成於未勞之先乎其何以使之不成則有表宜散有壅宜達有飲宜滌有氣宜利及其有火則宜泄宜降咳嗽雖久萬無不止之理即不然而並不服藥咳嗽亦能自止此正不令成勞之大作用也況既曰傷風何以使之不醒即不醒矣何以任其不醒即使久而失音如古所謂金空則鳴金實無聲金破碎亦無聲者亦當有別仍不得但作破碎觀也然而難矣喘壅非即喘脫辨天位乎上地位乎下人生其間一氣所包舉而已人在氣中猶之魚在水中魚不自知其在水人亦不自知其在氣氣即是風人之氣息頃刻離風即死內經言風氣通於肝是即生生不窮之氣也凡所為陰氣陽氣衛氣營氣中氣宗氣水穀之氣皆就吾身之氣之正者言之凡所為熱氣冷氣陷下氣逆上氣升降不利之氣皆就吾身之氣之病者言之是氣也呼則出吸則入得天地之清寧其數常出三而入一人惟不知身內之氣全賴有身外之氣故但知有身以內之氣不知有身以外之氣耳夫人一呼則氣出所出者身以內之氣也一吸則氣入所入者非身以外之氣乎無身以外之氣則身以內之氣便不靈而不相為用故人死而氣絕者外之氣不能入內之氣但有出則氣絕不續理有固然人當無病之時內氣外氣息息相通時以新氣換陳氣即以正氣敵邪氣一遇外感內傷則本氣即為之郁所謂郁者內氣不得通則外氣不得入但去其氣中之郁則氣之不入者自入即氣之不通者自通而氣復其常何病之有一經滋補始但阻滯乖忤繼則周身壅閉內氣愈不通外氣愈不入不通不入其氣乃絕吾見喘壅一證往往胸高膈滿掇肚抬肩此時此際有宜散表以通其氣者有宜疏里以通其氣者有宜清熱逐寒以通其氣者有宜消食導痰行淤解結以通其氣者不此之務而將氣為邪壅之喘認作無氣以續之喘謂之上氣不接下氣視同少陰息高之證抑之遏之降之納之轉壅轉補轉補轉壅旦夕之間含補而死良堪痛憫故不憚作危苦之詞以告病家之欲明此理者說文喘疾息也疾息也者本書歂口氣引也廣雅喘息也釋名喘湍也湍疾也氣出人湍疾也史記倉公傳令人喘逆不能食難經喘咳張世賢注肺主氣邪居肺則氣不順而喘咳此皆與漢書丙吉傳牛喘吐舌王莽傳匈喘膚汗同為氣逆不順而已至於虛脫之喘則必與他不治之證同時並作方可慮其致脫奈何一見不順之氣並無他不治證而即以脫為言哉逸病解自逸病之不講而世但知有勞病不知有逸病然而逸之為病正不小也劉河間傷寒直格列有八邪稽其目曰外有風寒暑濕內有飢飽勞逸逸乃逸豫安逸所生病與勞相反經云勞者溫之逸者行之行謂使氣運行也則內經本有逸病且有治法乃後人引河間語每作風寒暑濕飢飽勞役夫河間以內外八邪標題既曰八邪當有八病故以飽與飢對逸與勞對若作勞役則只有七邪矣此內經所以謂勞則宜從溫養逸則利於運行早將勞與逸截分兩病也張子和云飢飽勞逸人之四氣陳無擇云瘧備三因飢飽勞逸二子並能言之審其病之為逸便須用行濕健脾導滯理氣之法凡人閒暇則病小勞轉健有事則病反卻即病亦若可忘者又有食後反倦臥起反疲者皆逸病也流水不腐戶樞不蠹其故安在華元化曰人體欲得勞動但不當使極耳動則穀氣易消血脈流利病不能生否則五禽之戲熊經鴟顧何以可求難老也許鶴巢中翰聞余言而韙之且云枚乘七發所以能愈楚太子者其即此病也夫語足解頤而余亦因此益悟仲景理中之旨夫逸之病脾病也脾為太陰為陰中之至陰中者陰也故仲景之理中湯即仲景之理陰法以白朮為君乾薑為臣參草為佐此則真理陰也自張介賓不識陰字以陰為血必用熟地理陰一若重用熟地多至八兩而血即可補足者致靈胎有熟地入肚立化為血之譏其於仲景溫藥理陰之法相去幾何耶王公大人以久逸之體待漏入朝亦若同於風霜勞頓而多享上壽者正賴有此小勞以治其逸況每日五更獨得乾坤清氣為多哉因此又悟李東垣升陽散火之方不用陽藥又不用陰藥之妙則以其人另是陽為陰遏之病不是陽虛亦不是陰虛也此即河間逸病也亦即經所謂逸者當行也逸病夫傳而陽為陰遏之病亦失傳行之之法失傳而升之散之之法亦失傳余特為表而出之作逸病解煙漏說自張潔古有古方今病不相能之說人遂謂今病非古方能治然今人萬病皆古人所已言未聞別有古人不知之病也若今所有煙漏一證則真是今病而為古人所未知即為古人所未言向聞煙客多腸燥往往大便乾結為脾約而何以有煙漏蓋所稱煙漏者即下利也即滯下也亦即俗所謂痢疾也人於傷寒之下利且以漏底為名況今以腸燥之人而忽有利得不稱為漏乎至一加以漏之名則既名漏自當塞乃愈塞而愈漏者何也以其本非漏也以其本是滯下故以塞者滯之而更滯也或因傷於飲食或以感夫暑熱或以濕多而成五泄皆足以致滯下其病多見於春夏秋之交煙客病即非煙客亦病特煙客臥多行少其氣更易滯耳或曰然則煙漏一證將何法以治之余曰此必不視為煙客不名之為煙漏仍從滯下正法以通為止則漏自止人既曰漏亦不必定以非漏爭也但須知此漏之必得通而止則正所以治漏亦即所以治煙漏也吾見滯下之以名為漏底而卒至不起者皆害於不為之通故並於此發之煙漏之所以然者如是是當推本於煙為煙客籌調理之法人身臟為陰腑為陽一呼一吸以奉生身及其病也在腑為輕在臟為重一臟受病為輕五臟皆病為重人固罕有一病而涉五臟者有之自煙客始夫人咽喉二竅喉主氣息即氣管也咽主飲食即食管也喉系通於肺呼吸出入下通心脾肝腎為氣息之道路咽系通於胃水穀皆由此入為飲食之道路飲食下咽熟軟生硬皆能容受而停留胃中其精微上輸脾肺其糟粕下入大小腸人之以飲食傷而為病者在腑而不及臟若氣管清淨之地不能容受些許有形之物而惟煙之入也有氣無形隨其人之本氣相為呼吸其呼也上出於心肺其吸也下入於腎肝而位乎其中以司呼吸之出入者則於脾人之有脾也本藉胃中水穀氣以生以化今煙氣徑達脾中較之飲食之入必由胃而後及脾者其行倍速是以煙才入喉頃刻周流充達對時不舉失煙氣之充周猶之過時不食失穀氣之榮養其體倦脾為病也涕肺為病也汗心為病也淚肝為病也腸燥腎為病也至其為引必對時而作者脾主信脾之為病最先也故五臟俱病而脾尤甚焉平時調理自當以健脾為主兼補兼行旁及四臟昔林文忠公方深合乎仲景理陰之治此即治煙良法一建中而五臟俱安者也至於病名煙漏實即滯下則仍是腑病不是臟病不可不治其腑此病真是今病真古人所未知然而藥則仍是古人之藥也
