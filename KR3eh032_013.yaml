body:
  text: 卷十三文十三重訂傅徵君女科序經生家言每以闢去常解獨標新義為傑出冠時之作至於醫之為道因病施治隨證立方宜若無所為常亦無所為新矣然而一病也有陰陽有寒熱有表裡有虛實且有真假其病若相同其所以為病則大異世醫狃於習俗樂於淺嘗人云亦云但就病名為治不進求病本之何在者比比然也先生此書每論一病必先列常解於前而後自解之非故求新不囿於常則自成為新耳書凡女科二卷產後編二卷女科已列有產後一門而產後編中各病又與女科卷末似一似二或重見而疊出或此有而彼無先生本屬兩書讀者反覺贅見因揣先生於產後治法若專為錢氏化生湯發明因即易其名曰生化編以避兩書重複而仍不失原書本旨當猶是先生之志也嘗謂先生力求其新適得其常固非炫異矜奇者比修之服膺是書有年矣始從吳江靜安宗老處得見鈔本繼又得海山仙館本校讀數過惜其語句叢雜體例舛錯且產後編中所列類傷寒證以陽明腑之胃家實屬之三陰此其貽害非小疑非出自先生之手祝崖祁氏不云乎此書晉省鈔本甚夥然多秘而不宣彼此參考多不相符則雅樂之為鄭聲所亂多矣而於陽明混作三陰似乎病至於陰經始有下法則大背南洋之旨猶有不可不更正者因為移易篇次改定體例以女科八門釐為八卷另附生化一編繁者汰之冗者節之雜者一之經營咸豐年斷手同治初悉心讎校乃成完書誠欲求得廬山真面目庶讀者開卷瞭然而非敢有塗改點竄之意也凡先生之亮節高行散見於馬文甬義士傳李子玉儒林傳及觚剩鶴徵錄亭林文集小長蘆詩集中者當再蒐羅成帙以光益是書俾承學之士如見先生焉豈但為醫家言哉錄成敘其顛末如上重定綺石理虛元鑑序綺石理虛元鑑一書傳於其門下士趙宗田而刻自慈溪柯君德修者也惜趙不言綺石姓氏惟於原序中約略知為勝國時人其少子躬罹世變家國滄桑未經授梓可見德修以前世無傳本而德修實得利於是書故不忍聽其沉埋剝蝕而以梨棗壽之其用心之厚誠有如晉亭陳氏所言者而德修所刊本亦未盛行於世故世不多見此本余自友人處借鈔得之服其治虛之法於陰虛主清金於陽虛主建中歸本肺脾超出乎專事腎家者徒以桂附益火知柏滋陰之上可與吾蘇葛可久養道丹房十藥並傳惜余所見鈔本體例混淆先後凌躥所載方或舉藥名或為歌訣均未盡善原本不可得見無從仇校乃為第其先後一其體例分為五卷以理虛總論為第一羅列病證為第二治病餘論為第三用藥宜忌為第四脈法列方為第五而於非弱諸證復引申一二條以盡之刪繁補漏久之亦不記是誰語總以令人不成虛勞斯為治虛良法若已為人引入怯門則吾見其入而不見其出也嗚呼理虛之道微矣重訂吳又可瘟疫論序疫有兩種曰溫曰寒以其病為大小相同長幼相似如役使如徭役故古人謂之役後人稱為疫至宋以後又稱為瘟瘟即疫也溫與寒則疫中之兩證也若必以溫瘟為一字則豈疫之溫者可名溫溫而疫之寒者亦可名寒溫乎即此已說不去矣又可之所謂疫即宋以後之所謂瘟故言疫不當再言瘟言瘟不當再言疫而味其所論則實論疫中之溫者不論疫中之寒者且只言疫中之溫者不言不疫之溫者以其所遇崇正辛巳之疫固是溫疫不是寒疫然則其為書也自當名之曰溫疫論乃人云亦云漫不加察書之意不錯而書之名則錯讀者不知其書名之錯而轉謂其立論之非則又錯中錯矣呂𣗪村曰若以又可此書治濕溫證方合此言正不盡然蓋濕溫而在無疫之年則僅為濕溫之病濕溫而為有疫之年則便是濕溫之疫又可所遇既為沿門闔戶病狀相似則竟是疫疫之狀類濕溫則竟是濕溫之疫必謂其不當言疫可乎書中傳變一節謂有表而再表里而再里者有先里後表但里不表者及挾熱痢一節謂有熱結旁流者有膠閉而非燥結者皆為又可特識能言前人所未言厥功偉矣但其書名則定應改正而於書中之混雜不清者亦一一釐定之誠以此書實有至理足為寒疫外之溫疫垂一治法而正未可執不疫之溫自亂其例矣重訂戴北山溫熱論序北山此書以溫熱與傷寒辨條分縷晰諸病疏明傷寒之治不混於溫熱溫熱之治不混於傷寒誠於秦越人四曰熱病五曰溫病之異於二曰傷寒者分疆劃界不得飛越一步矣然其書明是溫熱而其書名則曰廣瘟疫推其命名之意固本於吳又可瘟疫論而欲有以廣之故篇中或稱疫癘或稱時疫或單稱疫一若自忘其為論溫熱者是傷寒之與溫熱北山能辨之而溫熱之與瘟疫北山亦混之矣余始不解其故久之而始恍然悟曰吳氏書名瘟疫而不自知其所論但為溫疫戴氏專論溫熱而不自知其書之不可以名瘟疫更合兩家觀之在吳氏自論疫中之溫而仍不免糾纏不疫之溫在戴氏則專論不疫之溫恐人於陽明溫熱之病誤用太陽風寒之法特於書成時未加檢點仍沿俗說以瘟疫之名名溫熱之病只與刪去論中屍氣腐氣等語及後幅大青龍一方此外則絕無摻入瘟疫之處亦無夾雜傷寒之處余愛其論之精而惜其名之誤乃於凡所稱時行疫癘者悉改之曰溫邪其開首云世之治傷寒者每誤以溫熱治之治溫熱者又誤以傷寒治之四語則余所綴也有此一提而所以作書之意乃先於卷端揭清即為之改題曰溫熱論則此書實足為溫熱病正法眼藏矣徐刻莊在田遂生福幼兩編序世有云小兒為純陽之體者妄也而於兒科痘驚兩證率以腦麝散其元氣蛇蠍增其惡毒金石墜其真陽沿訛習謬為小兒厄固不待言即於痘主清熱解毒於驚主瀉火開痰其在痘之初發果有實熱驚之初起果有痰火者何嘗不是正治之法而凡陰寒之體敗壞之證病已至於末傳而仍執此初傳之法亦未有不僨事者徐少山署正慨之思惟毗陵莊在田遂生福幼兩編最為善本爰屬柳孝廉質卿重校付梓以廣流傳而索余序夫痘異於瘍其誤在以治瘍者治痘張仲貞痘疹慈航引可證也驚即是痙其誤在不以治痙者治驚方中行痙書一冊喻嘉言寓意草沙宅一案可證也以痘而論在田之法異於費建中同於聶久吾而正未可概以久吾時之治治建中時之病於驚亦然蓋病在初傳或聶非而費是病到末傳則費非而聶是初與末之不同而治亦大異余治小兒悉本此數家然以應無窮之變則莊法猶為得力少山是刻亦遂生之德也福幼之慈也所願閱是編者凡遇痘驚末傳之病勿復執清熱瀉火初傳之法則少山之澤及天下嬰孩者豈淺鮮哉余友上虞鄭子鐸貳尹子澄銑病劇余以莊法遙治之得活然同里有戚友則又曾以莊法夭其一子不可不記莫枚叔研經言序歸安沈子彥模余快婿也初來謁即盛稱其師莫枚叔先生之為醫有不可一世之概余心識之謹以拙著初稿介沈子求正於先生而先生亦郵寄所撰研經言兩冊囑校並索為序歲晚鮮暇及春乃卒業而後嘆先生之學之博識之邃深造而自得者有如此也於是乎作而言曰今之世一有病無藥之世也一有病無方之世也一有病無醫之世也徐靈胎嘗云醫非人人可為夫本經靈素上古之書即非蓬心人所易領會而如南陽一脈下及脈經病源千金外臺之所言則皆隨時隨地尋常習見之病而皆視為鳥篆蟲書不可測識曾不能用其一方一藥尚何醫之足云哉君舉於鄉不樂仕進枕經葄史邃於小學出其緒餘以讀醫家言為之審音義詳訓故以經解經以方合病遂乃病無遁狀方無虛設此王叔和所以云對病自有真方而知世所稱古方今病不相能與夫南方無真中風江浙之地無傷寒者蓋先不能知古方之意故不能得古方之用不然夫豈不知今之病固不異於古所云哉如君之學若漫譽以高出時輩則是誣君而已豈是能知君者君所著尚多未成之書然當請以此冊先付手民俾自今以後之病家幸得遇識字之醫而免夭札也里居戢影韓陵片石外無可語者春深矣將鼓枻來遊苕霅間登君之堂以所學相質證然亦匆匆耳沈子何幸而得立雪君門也是為序李冠仙仿寓意草序讀書而不臨證不可以為醫臨證而不讀書亦不可以為醫蘇長公有言藥雖進於醫手方多傳於古人故惟讀書多乃能辨證亦惟多讀書始能用方彼之不用古方者非棄古方也非真以古方為不可用也直未嘗見一古方耳善用方者且讀無方之書不執方以治病而方自與病合而方亦自與古合余持此論以臨人病久矣今讀京江李冠仙先生書而嘆其能讀書以臨證也喻嘉言寓意草未議藥先議病自是良法先生本之以作此書紀其生平治驗若干篇使人心追手模有可取法而又矜平躁釋決不以盛氣凌人此尤其高出西昌之上者也中翰汪君藥階自京江來攜以示余屬為之序余校讀數過訛者正之先生有子盍即梓以行世俾世人知臨證者必多讀書而後能辨證亦必讀書多而後能用方今病既皆為古人所言不即知古方亦可為今病而用耶余於臨證亦多心得惜不及就正於先生而昔在京江側聞先生重遊泮水事中年教授鄉里其門下士多有登科第者則先生固以文名而不徒以醫傳也是為序書柯韻伯傷寒論翼後仲景自序傷寒雜病論合十六卷則傷寒雜病皆在論中非論外別有雜病可知故傷寒論六經提綱言六經之為病不第為傷寒一證立法也慈溪柯韻伯深明之於所著來蘇集外復作傷寒論翼謂仲景雜病即在傷寒論中而傷寒中亦最多雜病參錯而見故仲景之六經為百病立法傷寒又為百病之首傷寒雜病治無二理總歸六經之變見人於治傷寒時但拘傷寒不究六經中有雜病之理治雜病時又以傷寒論之六經為專論傷寒絕無關於雜病韻伯可謂善識時弊者矣嗟乎傷寒而外皆雜病病不離乎六經自不讀傷寒論既不知傷寒所重在六經又不知六經即兼言雜病而六經之分則惟傷寒論有之故凡不能治傷寒者亦必不能治雜病人孰知雜病之茫無治法即由於傷寒論之廢而不讀耶余之治傷寒也即從來蘇集入手故能不以病名病而以證名病亦能不以藥求病而以病求藥即治雜病亦能以六經分之是皆先生之教也執柯伐柯取則不遠其敢忘得力之所在乎歷年既久眉評遂多其論翼之序不知為何人作似乎韻伯之意謂風寒之邪往往乘腎氣素虧之人而傷之韻伯何嘗有此說特以太陽為即心主此其所蔽也書陳修園傷寒論金匱要略淺注後傷寒論三百九十七法既不見於仲景原文又不見於叔和序例豈聖法而真有是瑣屑焉者乃自林億創其言成無己踵其說而元泰定間又有程德齋者作傷寒鈐法言之鑿鑿累及王安道信以為真左算不合右算不合更覺無謂即使不差秒忽亦何補於古人亦何益於來者徒令後之人見此鉅數望而生畏愈覺傷寒論之深不可測則有之耳修園傷寒論淺注本張隱菴張令韶二家言撇去叔和重集諸篇但就六經分解適得三百九十七節謂一節便是一法即此為三百九十七法割卻千載葛藤而傷寒論從此為康莊大路矣仲景金匱原文本只二十二篇其二十三篇以下前賢皆謂是宋人所續故修園作金匱讀四卷刪之其為淺注時亦不加詮釋朱紫之混自此始得一清名曰淺注蓋示人淺近易從總欲令讀者無涉海問津之嘆嘉惠固非淺也或曰讀此可由淺而見深余謂讀此可由深以見淺庶幾聖道中庸盡人可到此則修園之志耳修園可議處亦多而兩書淺注則皆可讀之書也書徐靈胎慎疾芻言後探河源者必窮星宿之海觀日出者必登泰岱之顛學醫而不通靈素後世百家言人人殊其將何道之從歟洄溪先生為吳江望族博通經史復肆力於醫學而其得力處尤在潛心靈素世所傳徐氏六種久已澤及海內矣慎疾芻言最為晚出以其在六種之外幾於湮沒不彰余初僅藏有鈔本繼得陸秋丞觀察於皖江刻之今費芸舫太史視學中州又刻之而此書遂以大顯書僅十餘葉耳而歷敘所言如延醫一章謂人不可以耳為目而不考其實學何如治效何如此即內經病為本醫為標必使標本相得者是也其補劑一章謂傷風則防風荊芥傷寒則蘇葉蔥頭皆歷聖相傳之定法千古不能易者此即內經邪之新客未有定處推之則前引之則止者是也其陰證一章謂陰證無發熱之理而亦無補寒之法以發熱之病目為陰證全用溫補直是以藥試病此即內經謹熟陰陽勿與眾謀者是也其老人一章謂治老人勿用熱藥如其陽之太甚且當清火以保其陰即內經年四十而陰氣自半及所謂其陽當隔隔則當瀉者是也其中暑一章謂暑字名義與寒字相反乃天行熱毒之病當以香薷飲藿香正氣散主之此即內經後夏至日為病暑暑當與汗皆出勿止者是也至所謂內外十三因試問何一因是當補者病去則虛者亦生病留則實者亦死此更如內經所云身汗得後利則實者活味其所言無一語不本於內經其於蘭臺軌範尚不過羅列內經於前此則更擷經義以教人非第引經以起例也先生著書時在乾隆丁亥去今垂一百年而俗尚又一變矣先生當日所深惡而痛絕者為溫補藥今則溫補之弊仍在而又動輒謂人陰虛即病家習聞此語亦無不自謂陰虛者是不獨溫補之弊而又為清滋之弊矣溫清似乎不同而滋之與補其誤一也且以清滋而加病者其弊隱更壞於溫補而變病者其弊顯也凡新出醫書多矣其立意每不肯教病家先生之書則專教病家者也此其所以可貴也餘生也晚不獲親炙先生以求進於至道而恨不能使病家皆知治病之理則猶是先生之意也先生雖往其亦許為私淑之人矣乎書尤在涇傷寒貫珠集後傷寒論之廢而不讀也久矣不讀傷寒論自不能用傷寒方讀傷寒論而不得傷寒論之讀法則亦不能用傷寒方此吾吳飼鶴山人貫珠集之所為作也先生於傷寒六經正治法外又於太陽有權變法斡旋法救逆法類病法於陽明有明辨法雜治法於少陽亦有權變法於太陰有臟病經病法經臟俱病法於少厥兩經各有清法溫法凡病機之進退微甚亦各有法以為辨使讀傷寒論者先得其讀法以讀之庶幾不難讀傷寒論傷寒論即不難讀傷寒方自不難用於是而傷寒論乃不至於終廢是則先生之志也傷寒自朱奉議以三陰三陽釋作寒熱謂人病在三陽皆為熱皆用寒藥則凡太陽之宜溫散者其病必大又謂人病到三陰皆為寒皆用溫藥則凡少厥之宜寒瀉者安得更有活理賴劉守真申明仲景用寒之法以正其用溫之失乃後人泥於傷寒論之寒字總說仲景但知治寒不知治溫皆由不識傷寒論自有溫清兩法故耳先生於各經分證已極明晰而於少厥溫清之辨尤足破世人之愚余乃就先生意推之六經知六經中各有溫法清法且有溫清合法俾但見論中有溫法不見論中有清法者自此而識仲景固非但知秋冬不知春夏則宜用清法之溫熱病不即可於傷寒論求之哉先生於少陰篇曰傳經之病以陰氣之存亡為生死直中之病以陽氣之消長為生死於厥陰篇曰陰受病而厥者勢必轉而為熱陽受病而熱者甚則亦變為厥其厥也非真寒也陽陷於中而陰見於外也此即先生所以明溫清之原而余意實本於先生則先生之餉余者非淺矣先生金匱心典久行於世獨此未經鋟版僅得二然朱氏名陶性者於嘉慶中以活字板印之故世不多見朱亦不自言何地人兵燹以後想活字板亦必不存施生子程購得鈔本畀余觀之命傔錄出今又得朱氏本校勘一過因為之說亦可藉以明傷寒論自有清法云爾書曾文正公論史遷扁鵲倉公傳後曾文正公一代偉人其功載旗常其言垂金石夫豈有失言於人哉然而夫婦可以與知者雖聖人亦有所不知不知無傷也必強其所不知以為知則即有貽害於蒼生而貽禍於後世者余於公所論史遷之傳倉扁而有異焉公之言曰執一技以事上名一能以濟人此小人事也大人者德足以育物智足以役眾彼誠有所擇不宜於此津津焉若遷實通方術而藉以自見其才能斯亦淺者徒也公意謂倉扁細民遷之繁稱累牘為非法昔公在蜀道中病瘧寒熱耳聾少陽樞病也不早治致經旬不進粒米醫以一劑愈之不以為德以為罪於西征詩中目為庸醫有惡莠雖已鋤良苗亦失稼之句頗以除莠傷苗為憾則公並農夫之務去草而不之信矣瘧之為病而能愈之以一劑者是必深合乎仲景和解之法公所遇良醫也公自不識耳儒有君子儒有小人儒儒且有二而況於醫本當有所區別若醫而可概目為小人則儒亦可概目為小人矣醫之為道也本於伏羲畫卦后稷教稼並重豈曰小道乎哉醫之可以寄死生者亦無殊於託孤寄命之君子豈曰賤役乎哉醫而明亦能及物醫而名亦足動眾士果抱道在躬登仁壽而免夭札正可以佐朝廷康濟斯民之治何肯不自重而執技以事上官下同於吮癰舐痔者流出鄉而不與士齒哉吾聞狄梁公功在社稷而有腦後下針鼻端疣落之術范文正公先憂後樂而有不為良相即為良醫之願我祖宣公稱內相於朝而謫宦忠州亦有集錄古今方之事此三公者皆大人而皆能醫而皆謂之小人可乎周官之於疾醫何等鄭重自後世史官列之方技於是學士大夫羞為之以此事委諸市井而此中亦遂無人然儒有君子儒醫亦豈無君子人歟為薦紳先生者宜何如作養之顧惜之引之使進於道而堪受此鄙夷乎哉龍門作史自古為昭而謂其自借倉扁以自顯其才能亦淺之乎測子長矣公為一代偉人言必世為天下則故愈不可以無辭再論公病瘧而往來寒熱耳且聾至旬日不進粒米則必更有膈滿脅痛可知經云少陽之脈循脅絡於耳故胸脅痛而耳聾仲景本之特立小柴胡一方為少陽和解之法醫以少陽方治公之少陽病病得愈愈且速先是以十日不能食則病去而元未遽復勢使然也病之既除調以甘藥或以飲食消息之無後患矣味公詩意頗以不事滋補為嫌乃即以去病為罪然則病為瘧必不可用去瘧法是何異於黃坤載之縱有承氣證必不可用承氣湯葉天士之火熱之甚必不可用寒涼者哉不去病而先補則病不去病不去則無不虛虛則再補補則病益不去其後何如所不待言此人情也故醫之近人情者非其至者也近聞俞曲圓有廢醫論不知是何作意當求得一讀之
