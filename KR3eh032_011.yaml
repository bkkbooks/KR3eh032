body:
  text: 卷十一文十一論葉天士臨證指南傷寒門方葉先生臨證指南卷五以風寒分門而寒門所有者六方並非傷寒大證即在太陽一經亦僅言其至小此書行後遂不聞以傷寒論治病今之置寒水六氣於不講者大抵即由於此而傷寒論中之細微曲折亦更無能道其片語者矣乃有門人華玉堂者於此一門後大放厥辭謂人但拘仲景之法皆為見聞不廣膠柱鼓瑟不知變通以明仲景之不足法而以此六方為治傷寒一大宗徐靈胎曰此即俗名著寒之病偶爾小恙不入經絡者也何必牽引傷寒大證發諸議論及細閲此編竟無傷寒之門即此為傷寒之法不禁失笑夫醫者之學問全在明傷寒之理則萬病皆通故傷寒為病中第一證而學醫者之第一功夫也此編獨缺此一門則平日所習何書所治何病此非此老之過抑編此書者胸中茫無定見耶靈胎說如此尚不知此案與此藥亦未必定出自先生也昔梁茞林中丞浪跡叢談載葉先生軼事一則為龍虎山張真人在吳於萬年橋停輿讓橋下天醫星過去而是日是時不先不後天士小舟適從橋下搖櫓行來中丞於此不溢一詞而其下即引紀文達語謂天士不事著述今所有醫案十卷為門人取其治驗附以論斷非天士本意也石琢堂殿撰亦謂先生少所著作指南一編冗雜不足以傳乃先生棄世後門下學者薈萃而成其方不盡出先生之手然則此書明是及門假託為一時漁利之物奇在所作醫案每以不了語氣及上下文不聯屬又每以也字易矣字謂是其師漢魏文章然猶無害於病者若此傷寒一門則俗醫正怕讀傷寒書正謂傷寒方難用遂若照此六方法已大備更不必問途於仲景而又因此作江南無傷寒之說非皆不辨真贋而徒震其名之害耶嗚呼自有李士材醫宗必讀而世不知有血證自有此臨證指南而世不知有傷寒葉先生為吾蘇大醫享盛名於雍乾時必不至此彼華玉堂邵新甫輩造此大孽且壞先生身後名安得不為先生一雪此憤哉丹溪之言曰格致餘論戴人之言曰儒門事親寧陵呂氏之言曰人子不可以不知醫修謂有父母者不知醫不得為孝子即有兒孫者不知醫亦不得為慈父當今之世誠何恃而不恐正不徒一物不知儒者之恥已也論臨證指南溫熱門席姓七案席姓脈左數右緩弱此為溫陽根未固溫熱與陽根無涉陰液漸涸陽邪之甚舌赤微渴亦陽邪也喘促自利溲數三焦大熱晡刻自熱神煩囈語日晡所陽明王時也初診只有晡刻神煩夫溫邪久伏少陰此沿喻氏之說其誤即始於此古人立法全以育陰祛熱古人治溫決不育陰全以下語氣未了但今見證陰分固有伏邪陽伏於胃病在陽分真陽亦不肯收納乃陽邪之充斥非真陽之不納議仿河間濁藥輕投河間從無此法不為上焦熱阻獨此未用一藥下焦根柢自立與下焦根柢無關冀其煩躁熱蒸漸緩不去其熱熱何由緩熟地炭茯苓淡蓯蓉遠志炭川斷五味方謬又再診晚診陰中伏邪陽伏於胃晡時而升的是陽明目赤羞明睛不和也舌絳而渴渴為溫病與育陰清邪法以陽邪而育陰陰愈育陽邪愈固而云法乎生地炭生熟地之所貴在滋膏而炒為炭則無用亦斷無先熟後生之理元參心川斛炒麥冬麥冬無炒用者犀角石菖蒲二味並開心竅送邪入心又三診脈左數右軟此時脈尚未變舌乾苔白小溲淋漓膩澀之效吸氣喘促呼氣促是脫吸氣促乃是閉煩汗的是陽明乃腎陰不承非也心神熱灼蒙閉一去胃熱蒙閉即開議以三才湯滋水制熱豈陰虛而火炎耶此時之邪熱非滋水所能制用三才加茯神黃柏金箔邪必益錮晚進周少川牛黃清心丸一服助犀角送邪入內又四診昨黃昏後診脈較之早上左手數疾頓減脈象陡變惟尺中垂而仍動陽邪內陷矣囈語不已若有妄見胃熱蒸心益甚矣因思腎熱乘心胃熱而非腎熱膻中微閉神明為蒙自屬二字何解昏亂全不識陽明病隨進周少川牛黃丸領邪入心一服俾迷漫無質之熱熱本無所為質暫可泄降並未一用泄降之藥服後頗安並不能煩躁矣辰刻診脈濡小脈又變矣形質大衰生熟地炭既立根柢何至形質大衰舌邊色淡下利稀水邪下陷矣夫救陰是要旨撤熱是要旨讀仲景少陰下利篇太陽陽明亦有下利上下交徵此句如何接得上關閘盡撤必以堵塞陽明為治昨日犀角昨晚牛黃盡開諸竅一變而為堵塞況陽明無堵塞之理以陽明司合陽明之合不如是講有開無合下焦之陰仍從走泄矣生熟地炭之功何往議用桃花湯人參赤石脂乾薑粳米此方補澀而溫適與清泄苦降相反又五診晚服照方加茯苓此時病已垂危藥之出入必不在一味茯苓又六診脈左沉數右小數堵塞後脈又變矣暮熱微汗時煩辰刻神清只有辰刻神清矣虛邪仍留陰分實邪仍留陽分議用清補當用寒瀉人參茯苓川斛炙草黑穭豆衣何用糯稻根鬚何用金匱麥門冬湯全與溫病無涉溫熱門再有張姓一案初僅形象畏冷用復脈湯去參桂加甘蔗汁及三診陰液盡涸陰氣欲絶復脈湯有麥地何以陰涸陰絶再有顧姓一案初尚能飲酒納穀用犀角生地再診目瞑舌縮神昏如醉心開竅於舌犀角送邪入心故舌縮再有陳姓一案初不過夜煩無寐不嗜湯飲亦用犀角生地及三診陽升風動用生地陽當不升用犀角風當不動何又升動若此凡此所用藥後種種變相皆指南所自言何以用其法者皆不一問其藥之取效固有如是者乎指南溫熱門共四十餘案其於席姓復診者七初診左數右緩弱為溫熱病應有之脈邪在陽明是為時氣非陰虛火炎骨蒸勞熱之病亦非上盛下虛陽光飛越之病與陽根未固真陽不肯收納有何干涉乃必曰久伏少陰而欲育陰以立根柢此在勞怯病中尚為下乘豈可以之論溫熱時邪哉及復診者再而吸氣喘促心神蒙閉非熟地生地炭膩膈留邪犀角石菖蒲送邪入內之效耶再與天冬地黃人參之三才加以牛黃協犀角之力脈之數疾頓減一變而為濡小或並外熱之不見病於是乎內陷矣牛黃之服後頗安者並煩躁之不能也所以形質大衰而即下利稀水溫病不撤陽邪種種變相已露尚曰救陰是要旨而一任其陽邪之傷陰以致關閘盡撤有開無合即用桃花湯以堵塞之此在痢疾門中尚是末傳之治而始之僅為晡刻神煩者至此而僅有辰刻神清矣其人之終日昏沉內風扇動粒米不進舉室驚惶已可想見六診七診只剩得稻根穭豆敷衍成方而終之以一服麥門冬嗟乎此病之初人迎數盛氣口濡弱傷寒成溫之的候也此時一用仲景之葛根芩連湯辛涼解散病即外達一汗而解熱退身涼神清脈靜矣即不然而須專清裡則仲景之白虎湯梔子豉湯辛寒泄熱裡氣一清外邪自解亦無不熱退身涼神清脈靜矣余為治三十年凡遇溫熱病無人不如此無時不如此無地不如此無不於十日內貽之以安惟尚未能起床出門往往受人促迫耳今觀此案初診之議邈若山河及四診而一路之病隨藥變者敗壞至此事已不可為矣獨有下利一證或尚是熱結旁流為挾熱之利非燥屎即膠閉若一投仲景之大小承氣尚能起死回生乃華玉堂從未夢見反謂見聞甚廣不肯膠柱鼓瑟輒投石脂乾薑溫之澀之病到如此不堪地步一味人參聊以塞責此外則穭豆之衣也糯稻根之須也一籌莫展剩有麥門冬一方如不欲戰於此而云此病尚有活理誰其信之溫熱治法從此失傳可恨哉今之抱一冊為市醫捷徑者名曰葉派余初不解溫病之十有九治者何至於百無一生及觀此案之始終本末而知編此一冊者正利其日後必然之狀已預定於始初立案之時以為先見之明言無不中而病家即以其言無不中果服其先見之明孰能知其人之本非此病而移病湊藥使之病隨藥變耶此所以人愈死而名愈高也則此一案之在病家尚可安於不問哉吳子音三家醫案僞薛潔燔三診其害亦同於此合論顧景文溫證論治吳鞠通溫病條辨溫證論治在華邵輩所編臨證指南之外乃顧景文者假託葉先生之語而刻於唐笠三吳醫匯講者也唐刻有小引云先生遊於洞庭山門人顧景文隨之舟中以當時所語信筆録記一時未經修飾是以辭多佶屈語亦稍亂讀者未免眩目不揣冒昧竊以語句稍為條達前後少為移掇惟使晦者明之而先生立論之要旨未敢稍更一字也據此則所刻云云已經唐氏加以刪潤尚且如此不堪然則顧景文之原本當更何如不意託名大醫便能行世貯春仙館刻之拜石山房刻之種福堂又刻之而其貽禍於病人者直如此其大也顧所記名曰溫證論治而章虛谷樂為之注改其名為外感溫熱王孟英又樂取之謂仲景所論溫熱是伏氣葉氏所論溫熱是外感故以溫邪上受首先犯肺逆傳心包十二字揭之篇首以自別異果如其說則所稱溫熱者不過小小感冒即俗所謂小風熱小風溫如目赤頤腫喉梗牙疼之類卻只須辛涼輕劑其病立愈然何以不出數日遽入心包為一場大病以至於死若不數日而病即入心既可死者則必非如其所說只須輕劑之辛涼且何以如其所言不即愈於辛涼之輕劑耶夫其所謂熱入心包者不可謂世無其病也然總不在僅稱外感僅病及肺僅用此無名輕劑之時是故古之人不輕言熱入心包也而顧其姓者確鑿言之若此跡其所以有是作者似欲以所用輕劑愈人之病也似又欲以所用犀角愈人之病也乃用其所謂輕劑而病不解漸欲入營血液受劫心神不安斑點隱隱即隨其所用不言何物之輕劑次第而來然則用輕劑而液受劫者輕劑不可用矣用其所謂犀角而斑出熱不解胃津告亡膚冷至一晝夜僅僅未成脫證亦即隨其視同花露之犀角次第而來然則用犀角而津告亡者犀角又不可用矣此皆顧景文自己所說皆顧景文自已所告人夫病之教人以必用此藥教人以必不可用他藥者不過恐以他藥使病增重不過欲以此藥使病速愈不過期其後此之種種惡候一用此藥盡消彌於無形故必諄諄告誡不憚煩言餉遺來學而人之生其後者有心濟世樂為之反復引申一刻再刻使其愈病之法昭然若發聾振瞶而惟恐其弗傳斷無因其用此法則液受劫用此法則津告亡而謂此劫液亡津之法有未可任其不傳者然而後之人則必用其法矣一用其法則所說液劫津亡者即於初用輕劑接用犀角時預言之而無不準若有先見者然並恐不用其法則血液未定受劫胃津未定告亡而所謂先見者便不十分穩足何由取信於病家此所以生其後者萬不肯不用其法也人心愈幻其法愈巧後數十年而又有吳鞠通者鞠通即本顧景文溫邪上受首先犯肺逆傳心包之十二字而為溫病條辨自條自辨可發一笑者也開卷捏造溫病以桂枝湯主之為仲景原文繼復承指南之訛以喻西昌治瘟之法謂是劉河間之所以治溫兩失已不待言乃以溫病之本在中焦者先移之於上焦謂切不可用中焦藥痛戒中焦之芩連而其下即云熱邪久羈吸鑠真陰邪熱久羈肌膚甲錯皆鞠通所自言皆鞠通自己所告人者先是自制銀翹桑鞠兩方即顧景文之辛涼輕劑不名一藥而鞠通為之引申者也嗣是方名清宮用犀角牛黃方名增液用元參麥冬以及一甲二甲三甲之復脈湯小定風珠大定風珠無非滋膩傷陰引邪內陷病至此不可為矣而因其中焦篇亦或有偶用芩連膏黃時凡溫病之一用芩連膏黃無不可去邪撤熱者鞠通又若未嘗不知然苟非布置上焦則熱邪未必久羈真陰即未定劫鑠苟非訶斥芩連則邪熱未必久羈肌膚又未定甲錯顧景文延之數日鞠通再加緩緩兩字何以必緩緩也不可解而實可解也此所以後乎鞠通者亦萬不肯不用其法也以滋膩留邪之藥緩緩延之熱邪方盛之時陰無不傷病無不死陶節庵之一提金殺車鎚截江綱書名之惡極者也此之一甲二甲三甲定風珠方名之惡極者也病何等事醫何等人顧可兒戲若斯乎再論溫邪上受首先犯肺逆傳心包十二字此十二字者溫證論治之所以發凡而起例者也初不言邪之何以獨傷肺肺之何以遽傳心但云若論治法宜用辛涼輕劑延之數日夫人病之熱惟胃為甚胃熱之甚神為之昏從來神昏之病悉屬胃家即使熱果入心亦必先病及胃病苟僅在於肺則斷無神昏之事即斷無入心之理乃於病之明明有神昏者特將神昏二字始終不提又明知神昏不屬於肺即暗將神昏移入於心其曰上受曰先犯曰逆傳者皆所以抹煞胃病之故再加未入心包邪專在肺二句說成此時之病不心則肺一肺即心若絶無與於陽明胃者而不可用胃藥之語適在此種種胃病之時欲成一家之言翻盡千古之局鍛鍊周內病者不能呼冤也其時病者或為太陽陽明兩經遞病或為太陽陽明兩經合病太陽行身之後由背貫胸陽明行身之前由胸徹背肺為華蓋位在胸背之上而胸為近胃為五臟六腑之海其清氣上注於肺注者射也太陽之邪射肺陽明之邪亦射肺而陽明為近故必陽明胃之熱降而在上之肺氣始安所病本只在胃肺僅為病所纍於此而必曰肺病勢必徒用肺藥轉將胃之支脈絡於心胃熱之最易蒸心者一任其逼近心包日逼日近而神昏益甚又以為此即心病此即肺病之傳心輕劑之後即用犀角將胃中之藥非特擱置弗道並且禁絶勿用遂領胃中射肺之邪直攻心臟是其所以逆傳者全賴此藥以為之也夫胃者腑也肺與心臟也本是腑病而偏要說成臟病遂乃舍腑治臟夫豈有臟腑而亦可以不分者人病腑為輕而臟為重此時一治其腑病無不除亦何至領邪入臟死於非命哉獨無如兔園冊子只有顧景文之溫證論治吳鞠通之溫病條辨等物以為道在是矣宜乎今日盛名之下並臟腑之不言也再論胃病有神昏肺病無神昏之理世間原有一種肺病其小者如咳嗆噴嚏頤腫喉梗之類其大者如哮喘咯血肺癰肺痿之類皆不聞有神昏而至譫妄者既曰肺病斷不能有神昏既曰神昏斷不僅為肺病既不神昏斷不病及心包既不病心斷不需用犀角是皆可以理斷而不必盡通乎醫道者也鞠通所謂上焦病者即景文所言之肺鞠通所謂不可用中焦藥者即景文所不言之胃乃於景文延之數日上再加緩緩兩字胃不及待釀成大熱或亦一用膏黃似乎已勝顧說而隨即以清宮增液者使胃病仍歸不治夫人之所病者胃而醫之所言者肺神之所以能昏者在胃而醫之所以治神昏者在心類皆善用移字訣而此之所移又為移字訣中最大之禍明明一部傷寒論長留天地間其於急去熱邪陰始可保如仲景之白虎承氣湯小之而一去其熱陰即不傷如仲景之葛根芩連諸方辛從甘以化陽苦從甘以化陰陰陽和而時雨降頃刻間有噓枯振槁之能者概從擯棄且若惡聞豈無意乎風寒溫熱尋常病耳似此惝恍迷離既令人於傷寒方視若畏途並以一二肯用傷寒方者目為怪物登仁壽而免夭札只看傷寒論之興替何如余既合論兩家而並暢發此論所望病家之曾受此害者一權於肺胃之間而恍然有悟也論楊栗山傷寒瘟疫條辨乾隆中楊栗山作傷寒瘟疫條辨於四十九年甲辰自序之其所制一十五方無不暗暗用傷寒方而又切切誡人以不可用傷寒方此其意竟不可解既而思之或者楊氏以世人久飲狂藥錮疾已深若再正言厲色教人取法仲景人既不信即其道亦不行而足以活人之傷寒論勢必仍歸於廢棄因而設此詭計特將殭蠶蟬蛻之不擔重任者加入芩連膏黃方內使人人看似楊氏新方而不知不覺已暗將傷寒方愈人故於卷三之末托為畏齊之言稱其於溫病另闢手眼卻不於長沙論旁溢一詞後有作者不為冥索旁趨得以隨施輒效一段或即是其全書點睛處歟若果如此則是楊氏設法度世不惜身冒不韙願受明者指摘而能使昧者潛移默奪不必醫家明其意但求病家蒙其福功歸實在何必爭名余故於楊氏之書猶有取焉此書本為三原陳素中名堯道者所著傷寒辨證於康熙戊午有自序一首至嘉慶十一年丙寅始為劉鏡浦觀察付刊其在乾隆時尚為素中未刻稿書中謬作劉河間稱為雜病妄引喻嘉言三焦解毒誤入吳又可大頭瘟六證且於陽盛格陰但言手足溫暖指爪紅活而不及熱厥之證有手足冷而指頭寒者為素中之陋而楊氏承之亦不能有所改正則反為素中纍矣論章虛谷外感溫熱葉天士先生一代盛名既為其門下華邵輩所毀而顧景文之溫證又為章虛谷取而注之改作外感溫熱其所以改作外感者想亦嫌其不類論溫故謂其與仲景伏氣之溫不同是則天士之溫本非仲景之溫而虛谷之溫又非天士之溫矣然而換一衣冠不能使其人之性情面貌因之而皆變也況果如其外感之說而竟出於天士之意則天士於臨證指南既以小風寒抵作傷寒一大法門天士於溫證論治又以小風熱抵作溫熱一大法門所以傷寒一證至天士而失傳溫熱一證亦至天士而失傳而孰知皆非天士之書耶此之般流直若傀儡登場沐猴牽線不使仲景聖道盡歸澌滅不止而王孟英溫熱經緯盡羅而致之皆不肯為病者計嗚呼此中之劫運其何日已耶坊間再有醫效祕傳亦云是葉先生語為吳子音所刻祕傳已極不堪至於葉薛繆三家醫案非特用藥之謬彼此相似即詞句間亦多有雷同明是一副筆墨不問可知其僞志稱薛與葉積不相能嘗自署所居曰掃葉山莊則豈有薛而肯從葉派者乎繆則我之自出不聞其有此方案偏是此種躗言最易動聽不託於兩先生置之可耳乃假借大醫使人信從以售其欺害斯大矣末附陸秋山溫熱贅言則即王孟英所收陳平伯祖恭語及章虛谷所指薛氏濕熱條辨者一字不易但改祖恭為余自稱拙著不值一笑附條辨辨雍乾之間吾吳薛生白與葉天士兩先生齊名天士不著書並華邵輩亦言之若一瓢薛先生則著作才也乃亦傳有濕熱條辨一冊自條自辨其語句藥物與溫證論治大略相同豈薛先生而有此不合體裁之作耶夫所謂條辨者始於方中行之前條辨程郊倩之後條辨原是條列仲景原文於前而作者逐條辨之於後以其條之或有錯簡或有剩義或有疑字而為之辨其疑似辨其是非雖其強題就我各自為說已屬無謂然猶不失為箋疏體也從未有自為條而自為辨者以其所條高一格書之更有襲取仲景句法彼意希圖傳之既久人人看得高一格處如仲景原文我意正恐傳之既久竟有人看得高一格處如仲景原文大可以僞亂真足以欺世之並傷寒論而不讀者薛先生之亦有條辨安知非即顧與吳一流人假託名賢使為嚆矢以見自條自辨之不自我始而藉以自文其陋且恐後之人尚有仿其體而為之者將讕語無稽皆得冒作經傳之體思之大可寒心嗟乎撥亂反正黜僞存真非吾人之責乎欲醫理之復明必自正文體始近有理瀹駢文者欲以膏藥盡廢煎藥而曰今人遇病動輒即云服藥衆口一詞牢不可破有雖欲不服而不能者夫薄貼以治外湯液以治內外治內治因病而施湯液始於伊尹而岐伯先有湯液湯液亦云古矣一旦欲盡廢之是猶勸人吃麵未嘗不可而必曰今人腹枵動輒煮飯牢不可破通乎否乎丸散膏丹病家不能自制且假手於何人在法之初自有真意然恐後之樂用其法者法又將有一大變也
