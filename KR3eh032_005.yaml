body:
  text: 卷五文五葛根桂枝辨溫熱之與傷寒所異者傷寒惡寒溫熱不惡寒耳惡寒為太陽主證不惡寒為陽明主證仲景於此分之最嚴惡寒而無汗用麻黃惡寒而有汗用桂枝不惡寒而有汗且惡熱者用葛根陽明之葛根即太陽之桂枝也所以達表也葛根湯中之芩連即桂枝湯中之芍藥也所以安里也桂枝協麻黃治惡寒之傷寒葛根協芩連治不惡寒之溫熱其方為傷寒溫熱之分途任後人審其病之為寒為溫而分用之尤重在芩連之苦不獨可降可泄且合苦以堅之之義堅毛竅可以止汗堅腸胃可以止利所以葛根湯又有下利不止之治一方而表裡兼清此則藥借病用本不專為下利設也乃後人之視此方若舍下利一證外更無他用者不審兩陽合病之下利固屬葛根而不下利但嘔者亦屬葛根則葛根豈獨為下利設哉夫葛根既治兩陽合病則即施諸病連太陽者亦為甚合豈有未入陽明早用葛根恐將病邪引入陽明之理況溫病之所需不過葛根亦猶夫中風之所需不過桂枝極分明亦極容易乃吳鞠通沿嘉言之謬欲以桂枝治溫吳且極詆葛根切戒芩連適棄去此病所亟需之藥意豈有不利於葛根之類者乎葛根麻黃辨溫熱之與傷寒所異者傷寒用藥以辛溫溫熱用藥以辛涼耳而其應用輕以去實則一也徐之才十劑曰輕可去實麻黃葛根之屬意蓋以麻葛性皆輕揚皆可去實故以二者並言之謂麻黃之輕揚可去傷寒之實葛根之輕揚可去溫病之實然則欲去太陽之實非辛溫之麻黃不可欲去陽明之實非辛涼之葛根不可之才之說非即欲將麻葛二味一以治傷寒一以治溫熱哉後人既不解仲景所謂不可發汗者專指麻黃又不解之才所謂輕者指物性之輕所謂實者指人病之實乃既以實作虛又以分兩之不重者為輕而禁麻黃者遂並葛根而禁之禁麻黃之屬者遂並葛根之屬而盡禁之自是而於病之必去其實者凡在可以去實之藥一概皆委諸禁例實之不去病即不治諺有之曰好漢只怕病來磨即虛亦可立至也夫溫病之有需乎葛根亦若傷寒之有需乎麻黃用以去實只在一轉移間耳張隱菴乃謂陽明本病只有白虎承氣並無葛根湯證此以不善讀脈促喘汗一條之故許宏葛根芩連方議且云此方亦能治陽明大熱益信長沙方之取用不窮也自矜創穫其意可笑然其言固大可取耳犀角升麻辨一如無犀角代以升麻朱肱活人書之說也陶節庵亦云爾朱二允駁之謂升麻性升犀角性降升降懸殊如何可代唐迎川又駁之謂角生於首定為升劑以下降之說為不然各持一說迄無定局則非先明升降之理將何以為折衷之論乎余乃證以素所親歷而始有以斷之曰升麻升也犀角亦升也然而犀角之升則以降為升且以至降為升者也何以明之犀為水獸其利無前故能分水能闢塵能燭怪水與塵本乎地者親下怪則匿於幽隱之地而犀能燭之則犀不誠至降之物乎人因鹿角之升而疑凡角皆升豈知鹿之性甘鹹而溫犀之性酸苦鹹寒性溫則升性寒則降斷無寒者能升之理試以鍋水譬之熱則鍋蓋蒸蒸有氣稍冷即不然是可惜以明鹿角之升犀角之降而二允之說為可從矣然則何以又謂其能升也蓋此所謂升乃是升出於表此所謂降乃是降入於裡與自下升上自上降下之理不同即觀熱入血室之病一用犀角邪即外達豈不以病邪內陷而既入血室則已入於至幽至隱之地故必用此至降之品亦能深入於至幽至隱者以拔之使出乎惟其能入幽隱故謂之降亦惟能從幽隱拔邪故謂之升凡藥酸苦者能湧泄此正酸苦湧泄之謂與辛甘發散各自為功苟非能降何以能升人惟不識其所以降之理故不能得其所以升之用朱與陶之誤誤在犀角證而仍用升麻凡屬三焦大熱諸見惡血及陽毒發斑色紫黯者犀角之所司也而誤投升麻則血益罔制斑黑胃爛鮮不殆者今人之誤則又誤在升麻證而竟用犀角凡屬痘疹初起喉痧初發及傷寒病溫之裡熱未熾宜先透達者升麻之所任也而誤投犀角送邪入里轉陷轉深永不得出亦無不死夫以已陷之邪犀角既能拔出則未陷之邪犀角即能送入其勢必然故凡當用升麻提邪出表之時而用犀角之降未有不隨之而陷者胡今人於病之初起反畏提邪出表之升麻樂就引邪內陷之犀角使其後之種種惡狀本皆可以不作者無不次第俱作而旬日之間直至於不可救哉犀角升麻辨二夫犀角一物為仲景金匱玉函所不取惟華佗中藏經安息香丸取以治傳屍勞等病與腦麝沉檀獅子糞同用是為犀角入藥之始前此未之有也乃張介賓作本草以朱奉議如無犀角以升麻代之之說直認作仲景語其謬一至於此則並於仲景所用之藥與所不用之藥皆未嘗一問矣他若外臺秘要歷載犀角方無一不涉及惡血試問風寒溫熱之常其不汗而當用汗法不下而當用下法時即有如外臺所載犀角等證乎不獨經疏主治悉屬吐衄下血即如汪訒庵之醫方集解尚能歷數吐衄及畜血諸證則汪尚能知病涉於血方用犀角而不在可汗可下之際矣況畜血一證仲景亦有桃仁承氣抵當湯丸即後人尚有代抵當一方可用耶臨證指南每將犀角牛黃與冰麝蛇蠍合用顧景文託名天士作溫證論治又以犀角視同花露輕率用之而於指南所載顧姓一案觀其前診尚能飲酒納穀乃一用犀角而神昏如醉矣陳嫗一案前診不過夜煩無寐乃一用犀角而陽升風動矣凡此皆其復診時所自言何竟無一人見而疑之者噫異矣犀角升麻辨三聶久吾痘疹慈航以升麻葛根湯為主方痛懲犀角牛黃引毒內攻當其時有他醫治小兒用牛黃散一服痰喘止神氣稍平自是而此兒遂無言矣故久吾謂應從升散時切不可遏其毒出之勢立致內攻告變韋君繡曰邪在陽明與心包相近雖見神昏未必便入心營自宜疏達向外不得以犀角引賊入室予見此病多由失表所致表不解而入內者也二家之論內外均極明顯不意臨證指南亦論內外而曰內閉外脫則其所說之內外乃大相反矣夫此時外為邪閉其為閉也是為外閉不是內閉若因外閉不開以至於脫則是內脫不是外脫惟其認作外脫故不敢一用疏達肌表之藥惟其認作內閉故獨敢用走散元陽之藥同一脫也究以外閉內脫為是然亦既脫矣誰更辨內閉外脫之非只四字之顛倒用藥迥乎不同生死於以立判欲明閉脫必究內外病家可不知耶夫人死自可云脫然此病只是外閉外閉得開內本不脫謂之脫者實還非是及其外閉既久並解散之不能以致陰陽離決即名曰脫卻無不可然閉之與脫總不一時並見此時之外閉者邪束陽郁之謂也此時之內脫者陽盛陰涸之謂也以輕揚散表者解其外而外不閉以撤熱存陰者救其內而內不脫溫病以之傷寒之成溫者亦以之此仲景之法所以一解表一清裡而了無餘事也至於開竅逐穢自是瘟疫治法總因諸書於傷寒外但有瘟疫門而無溫熱門故人之所病者為溫熱而醫之所稱者皆瘟疫耳嗟乎一轉移間事耳夫豈異人任哉犀角膏黃辨一傷寒論六經並重而風寒溫熱之病以陽明為淵藪其方亦以陽明為扼要陽明者胃也仲景所用白虎承氣之石膏大黃凡屬胃病無不以此二藥而愈可見此時於二藥外不必更有他藥即有他藥亦不過為二藥佐使胡今人於此絕不一用膏黃而於宜清宜下時動手便用犀角夫使此時而果有犀角證豈仲景獨不見及耶乃以仲景熱入血室之條變作熱入心包之說以遷就其犀角之用然歷檢古書絕不見於宜清宜下時一言熱入心包者胡至今日而竟為此說也揆其所以言心包之故莫不因乎病有神昏之故余先明神昏之為病以定犀角之宜否夫犀角心藥也用犀角者以神昏而用也以神昏之似乎心病而用也然而凡屬神昏之證仲景皆系之陽明條下尚為胃病而非心病夫神昏者何不知人不識人而已矣內經熱論曰陽明者十二經脈之海其血氣盛故不知人金匱中風篇曰邪入於腑即不識人趙以德解之曰胃為六腑總司諸腑經絡受邪必歸於胃胃得之則熱甚津液壅溢結為痰涎閉塞隧道胃之支脈上絡於心才有壅閉即堵其神氣出入之竅故不識人徐忠可申之曰試將頸間兩人迎脈按住其氣即壅遏不識人人迎者胃脈也則不知人不識人之屬於胃也久矣今何以而移之於心哉前兩說既極曉暢而說之尤明白者則裴兆期也裴曰人謂神昏之病原於心心清神乃清余謂神昏之病原於胃胃清神乃清夫藏神者心攝神者氣胃氣一有不清即不能攝神歸舍是神之昏不昏專在乎胃之清不清不觀酒醉之人乎酒醉之人醉胃不醉心也何以神昏而言語無倫也不觀飽食填息之人乎飽食之人飽胃不飽心也何以神昏而一時瞀亂也不觀痰涎壅塞之人乎痰塞之人塞胃不塞心也何以神昏而瞑眩無知也其言如此則知神昏之為病全屬於胃即知神昏之用藥決不在心若非先明神昏之何屬則犀角之是非何由定乎犀角膏黃辨二然而人於此則正有辭矣其言曰今之言本草者皆宗李時珍綱目時珍謂五臟六腑皆稟氣於胃風邪熱毒必先干之飲食藥物必先入胃角乃犀之精華足陽明胃藥也故入陽明解一切毒療一切血及驚狂斑疹諸證子謂神昏屬胃則犀角正是胃藥有時珍之說在子將何以處此余曰不讀本經焉識本草人之氣血無所不通藥之功能亦無所不到豈有某藥只入某經之理所以神農不言何藥入何經至張潔古李東垣輩始有每藥專入每經之說即如犀角一味本經主百毒除邪不迷惑魘寐初不言其入胃也即以六經論之大明則謂煩毒入心狂言妄語海藏則謂風毒攻心睫氉熱悶孟詵則謂卒中惡心痛心風煩悶此三家並不言胃且專言心惟備要瀉心涼肝清胃中大熱乃始兼心胃言而下文便接吐血衄血下血等證則知病必涉血然後用之未涉乎血即不可用正合時珍解一切毒療一切血之言再觀外臺所載芍藥地黃湯用犀角則主清化瘀血者也十一味方用犀角則治熱毒下黃汁如腐爛血者也張文仲用犀角則療下利惡血不止者也範汪麝香散用犀角則療穀道中䘌瘡而便膿血者也益可見血生於心而血得熱則行之理故時珍所說乃因胃在心下心熱則胃未有不熱者心熱除胃熱自去故以去心熱者謂即去胃熱今則熱專在胃尚未入心即有心熱亦為胃熱所累胃熱去心自不熱病之由心及胃與由胃及心者迥乎不同以胃在外心在內其病但在胃口而藥先開其心竅勢必將未入心包之邪一舉而送入心包病於是乎內陷而神亦不復清矣喻嘉言曾勘一白虎證病家欲用犀角遂延他醫引胃邪入心臟其顛悖無倫較胃實證更增十倍醫乃辭以心偏不可救未幾髮直頭搖果成心絕之候嘉言謂傷寒之邪即使過經不解蘊崇日久亦僅蒸及心包絡豈有直入心臟之理乃任用犀角領邪攻心無異獻門迎賊嘉言此論實足破胃病用犀角之謬貽福於後世也犀角膏黃辨三而或又曰病至神昏每多狂言妄語甚則如見鬼狀苟非犀角之通靈何以除病而使病得安余曰此正余之所欲言也本經於石膏下有除邪鬼三字後人不解石膏何以能除邪鬼則將石膏之除邪鬼三字刪去本經於大黃下有安和五臟四字後人不解大黃何以能安和五臟則將大黃之安和五臟四字刪去經此兩者之就刪而石膏大黃之功用於是乎晦矣石膏能清陽明經熱經熱清邪鬼自除大黃能清陽明腑熱腑熱清五臟自安故此時之邪鬼非石膏不能除此時之五臟非大黃不能安余之用此以除邪而安臟者蓋不可更僕數矣余非不知犀為靈異之獸可借其靈氣以辟邪然犀角之除邪鬼是熱在血室者也石膏之除邪鬼是熱在胃家者也此時熱專在氣無涉於血即江文通黃連頌亦有御孽辟邪長靈久視之語與大黃功用略同總以邪去則正乃安耳若夫病之既入心包既入血室並非石膏大黃所能了事者則在肝之病必用羚羊角亦猶入心之病之必用犀角也病豈必無膏黃之不能愈而待愈於犀角者哉然必在用過膏黃之後必不在未用膏黃之前蓋亦有可決者葛根黃芩黃連湯解陽明之有葛根芩連湯也猶太陽之有大青龍少陽之有小柴胡也太陽以桂麻解表石膏清裡少陽以柴胡解表黃芩清裡陽明則以葛根解表芩連清裡表裡各不同而解表清裡之法則一太陽證有表裡青龍湯皆主之少陽證有表裡柴胡湯皆主之若陽明證而有表裡則此湯皆主之乃太陽不廢青龍少陽不廢柴胡而葛根芩連一方獨見遺於陽明者以人必見下利始用之不下利即不用而不以為是陽明主方也孰知此方之所用者宏而所包者廣乎方中芩連二物非獨仲景黃芩湯黃連湯諸瀉心湯皆本於此即後世升麻葛根湯柴葛解肌湯之類雖似變局亦皆不外此方之成法凡由太少陽陷入陽明為陽邪成實之證不論有下利無下利皆以此方為去實之用最可笑者李時珍不解實字欲將之才十劑泄可去閉葶藶大黃之屬改作去實將輕可去實麻黃葛根之屬改作去閉則其意必謂有所積滯方可稱實而凡表實之當以輕藥去者即時珍亦不得其解矣豈知此方隨證可加芎芷羌獨荊防藁蔓又可隨證加入薄荷桑葉藿香香薷赤芍丹皮黑梔等藥無非以輕去實病即化大為小且不定需乎白虎承氣而陽邪不實陰何由傷病必去矣故敢筆之於此以告病之甚賴有此方者還此久亡之治法也真武四逆通脈白通四方合解病之入臟而為純陰無陽之證仲景即用驅陰回陽之法其於理中附子二湯並加人參為陰陽並補外如真武四逆通脈白通四方者獨用附子回陽各有所主若不逐方辨晰用之往往不當不得謂同是附子即可漫無區別也前人於四方即各有方解而余復為合論之曰陽氣衰微不能內固者主以真武陽氣退伏不能外達者主以四逆陰盛於內格陽於外者主以通脈陰盛於下格陽於上者主以白通是故真武湯補助陽氣者也四逆湯運行陽氣者也通脈湯通達內外之陽者也白通湯宣通上下之陽者也於此既明然後進而求之四逆但能益陽必加蔥白乃能通陽白通但能通陽必加膽汁乃能入陰如此分別一方自有一方之用不可移易假借余每以此治今人之病固未有不合者不知人何以而絕不敢用又何以而用之輒誤也總之以方試病則方不任咎以病求方則方如已出凡方之在傷寒論中者專在分際得宜六經無不然也此四方者為少厥兩經正治之法雖在燥火運中亦未嘗無用此四方時即可見寒水濕土之運亦有宜用寒涼時總以寒邪熱邪為辨若果確見為熱邪則病之外見者雖同是四逆而必求熱深厥深之旨用四逆散不用四逆湯又重則如少陰有承氣三證厥陰有白虎一證此外更有瓜蒂散之吐法白頭翁豬苓湯之清法皆與此四方之大辛熱者相反吾蘇尤在涇於少厥兩經之證各分溫清兩途其旨深哉附子補陽人參補陰說天下補陽之藥惟有附子非人參也參補陰者也仲景真武湯四逆湯通脈白通湯皆以附子通行十二經為斬關奪隘之計以救垂危而方皆不以附子名獨至附子湯一用人參而反以附子名其方者何也以方中有補陰之人參在恐後世反輕附子而重人參故特名附子湯以示所重仍在附子之補陽不即可見補陽之藥惟附子足以當之而非人參之任乎自有氣為陽血為陰之說而謂人參可以補氣遂謂補氣即是補陽不知人參不足以補氣之陽但足以補氣之陰仲景四逆加人參湯以其利多亡血必顧其陰而用之也茯苓四逆湯以其在汗下之後陰已大傷而用之也若一切回陽方中總不用人參以緩附子之勢乃自有張介賓新方八陣而補陽之法蕩然矣介賓於大補元煎云人參補氣補陽以此為主其於四味回陽飲附子用一二錢而君以人參一二兩參且十倍於附宗其法者遂若補陽非人參不辦而附子之功用於是乎晦況乎陽之能虛多由陰盛陰氣之盛者即足以傷氣之陽附子一面補陽即一面破陰火陽也水陰也附子為北方元武真神其功專在行水故其力又在破陰其病之僅為陽虛者但用其補陽之力耳若陽之以陰盛而傷者則更以破陰之力為補陽之助乃足盡補陽之妙而不可雜以補陰之參由是知介賓之六味回陽飲及右歸飲右歸丸謬更不可勝言矣其在大補元煎已云補精補血以熟地為主而於六味回陽飲重用熟地亦名回陽即其右歸飲則自以為益火之劑也右歸丸則自以為培腎之陽也而皆用熟地皆以純陰之藥予以回陽之名則下焦陰氣勢必上陵陽位陽未回而陰益甚不至如內經所謂地氣冒明不止補陽之義果安在哉味其補精血之言是直以血為陰矣惟其以血為陰故遂以氣為陽而陰氣二字因此亦永不見於世世之病在陰氣者並無治法而況其在陽氣乎熟地且可謂之補陽而況其在人參乎更以仲景方證之一百十三方用人參者十有八如新加湯小柴胡湯之用人參則以桂胡達表而以人參和陰也白虎加人參湯竹葉石膏湯則以石膏退陽而以人參救陰也附理中湯吳茱萸湯則以剛燥之劑已恐傷陰而用人參養陰以配陽也仲景之於人參半為欲行汗下恐傷津液故必加以扶助半為汗下之後津液已傷故必施其救援無非以陰濟陽之妙未有如介賓之於人參與熟地對用而以兩儀名之者是蓋不知人參但有補陰之偏功故並不知附子始有補陽之大力惟能以附子歸諸補陽又能以人參歸諸補陰夫然後附子之功用彰夫然後人參之功用亦彰而陽虛陰虛兩證始不致就死於新方之八陣矣
