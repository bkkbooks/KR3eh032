body:
  text: 卷四文四太陽用桂麻二湯法桂麻二湯仲景所以治風寒初起之未化熱者也太陽病發熱者而汗自出者風傷衛也此時衛病營未病用桂枝去衛分之邪太陽病發熱而無汗者寒傷營也此時營病衛亦病用麻黃達營分之邪因桂枝證本有汗出若誤以麻黃髮其汗恐汗更不止麻黃證已不得汗若誤以芍藥斂其汗恐汗更不出二湯分際如此仲景於麻黃證禁用桂枝湯而申之曰常須識此勿令誤也者豈無故哉蓋中風是淺一層傷寒是深一層僅屬中風則可與桂枝湯以其未化裡熱也已成傷寒則必無汗而化熱較易此時當以發汗為重若再斂其汗裡熱勢將大甚故必用麻黃湯而不用桂枝湯矣凡病但有表熱未成裡熱者用桂麻大有表熱兼見裡熱者用青龍已成裡熱不論表熱者用白虎表熱裡熱甚不可不分也前人之禁用寒涼者只在但有表熱之時今人當應用桂麻時一見表熱便作裡熱而早用寒涼為害滋大既而又因早用寒涼之誤遂並寒已化熱熱已大甚之後仍禁寒涼勢必仍用桂麻而害益大矣病家延醫多在三日以外其於桂麻分際往往已過其時此惟臨證多者能覺之不經臨證則讀書雖多仍不能得其分際也用傷寒方最重分際六經皆然即於桂麻發之太陽病桂麻青龍三級說太陽風傷衛用桂枝湯寒傷營用麻黃湯風寒兩傷營衛同病用大青龍湯三方鼎立為三大綱是說也許叔微成無己言之於前而其後方中行喻嘉言程郊倩又曲暢之一若於麻黃湯中不見其亦有桂枝於青龍湯中不見其多一石膏者夫仲景桂枝湯治汗出而不喘滿之太陽病麻黃湯治喘滿而不汗出之太陽病大青龍湯治不汗出而煩躁之太陽病此之三方一則桂枝二則麻黃三則青龍乃三級也非三綱也三方作三綱施治多誤誤於不煩躁已用青龍三方作三級審證自確確於用青龍必待煩躁請得而詳言之凡人衛行脈外營行脈中風但傷衛則汗出而不喘滿惟是頭項強痛其病為輕故方中但用桂枝風既傷衛寒又傷營則喘滿而不汗出必兼骨節煩疼其病為重故方中不但用桂枝而必用麻黃及其風寒兩傷之後無汗者終不汗出汗既不出必加煩躁其病為尤重矣故方中不但用桂麻而又必用石膏其病由輕而重其方亦由輕而重輕則用桂重則用麻桂又重則用石膏麻桂反是以觀有汗不用麻黃湯無汗不用桂枝湯不煩躁不用大青龍湯則此之三方明是三級之階升而非三綱之鼎立矣洵如諸家之說則麻黃湯中先當刪去桂枝青龍湯中尤當刪去石膏而何以麻黃湯必麻桂並用青龍湯必於麻桂外多一石膏耶仲景既治風以桂枝治寒以麻黃則其於風寒之兩傷何不用桂枝麻黃各半湯耶其治風多寒少寒多風少何不於桂枝二麻黃一湯外更制麻黃二桂枝一湯耶況如其所說則桂枝證當不惡寒麻黃證當不惡風而何以桂枝證之惡風即惡寒麻黃證之惡寒兼惡風又何以青龍證之獨惡寒而不惡風耶仲景特於青龍條下示人以惡風者不可服服之則厥逆筋惕肉瞤不從可知惡風者必有汗有汗者必不煩躁不煩躁即不可用石膏也哉所以仲景於脈浮而緊浮則為風緊則為寒風則傷衛寒則傷營營衛同病骨節煩疼當發其汗之下並不言大青龍主之而千金方已於此條下明言宜麻黃湯林億等校定王氏脈經亦於此條下增宜麻黃湯四字匯而觀之不更可知麻黃一方已是風寒之兩傷營衛之同病故既用麻黃又用桂枝治寒而不遺風治風而不遺寒乎王朴莊先生回瀾說人身營衛猶城與郭未有兵臨城下而郭不先破者才說傷營已兼營衛兩傷在內旨哉斯言凡諸家於青龍證所謂中風脈浮緊為中風見寒脈傷寒脈浮緩為傷寒見風脈種種葛藤不斬自斷但以論中桂枝方禁與青龍方禁一對勘而已足矣桂枝方禁云脈浮緊汗不出是麻黃證不可與桂枝湯以桂枝方中有芍藥者大不宜於無汗之病也青龍方禁云脈微弱自汗出是桂枝證不可與青龍湯以青龍湯中有石膏者大不宜於有汗而不煩躁之病也明乎此而風寒兩傷營衛同病豈非麻黃湯之專司而與青龍何涉哉余得以一言斷之曰仲景於太陽病汗出而不喘滿者用桂枝湯喘滿而不汗出者用麻黃湯不汗出而煩躁者用大青龍湯則此之三方一則桂枝二則麻黃三則青龍其病由輕而重其方亦由輕而重乃三級也非三綱也乃三級之階升非三綱之鼎立也又有以桂麻各半易去青龍者自較諸說為長而其不識麻黃湯已是風寒兩傷營衛同病則仍未能說仲景之意太陽陽明用青龍白虎法傷寒論石膏一味得薑桂麻黃而有青龍之號得知草粳米而有白虎之名二方並用石膏一以泄陽邪一以顧陰液也病有表熱有裡熱表熱宜散即已兼見裡熱必用青龍散之早用白虎即為誤遏裡熱宜清即或尚有表熱必用白虎清之仍用青龍即為誤發其間先後緩急絲毫不容假借余既明三級之說可不再申二方之辨乎夫二方之辨且勿在同用石膏上看先要在一用麻黃一不用麻黃上看論曰太陽中風脈浮緊發熱惡寒身疼痛不汗出而煩躁大青龍湯主之蓋仲景一涉無汗即用麻黃一涉有汗即不用麻黃是大青龍雖專為煩躁設實專為不汗出之煩躁設故又曰若脈微汗出者不可服以是知用青龍者必為無汗之病而有汗即不可用何也以其方雖有石膏而仍主麻黃故也若白虎之不用麻黃則其吃緊處正在有汗矣論曰服桂枝湯大汗出後大煩渴不解脈洪大者白虎加人參湯主之陽明病渴欲飲水無表證者口乾舌燥者白虎加人參湯主之三陽合病腹滿身重難以轉側口不仁而面垢自汗出者白虎湯主之是白虎似專為煩渴設實專為大汗而又煩渴設故又曰若脈浮無汗其表不解者不可服以是知用白虎者必為有汗之病而無汗即不可用何也以其方重在石膏而不用麻黃故也煩躁而無汗者宜泄其陽邪桂麻不可少也主治在青龍煩渴而有汗者宜顧其陰液桂麻可不用也主治在白虎汗多者且於白虎中加人參不從可知汗無點滴者雖有石膏不可不用麻黃以達之汗已淋漓者專重石膏不可更用麻黃以竭之乎是故青龍之治以無汗為準白虎之治以有汗為準此即先後緩急之次序不可紊也雖然二方固須辨麻黃之異而二方亦須辨石膏之同此又不獨在有汗無汗上看而又必兼在惡風惡寒上看矣青龍湯禁曰惡風者不可服白虎湯禁曰惡寒者不可服惡寒即其表不解之謂余以兩言斷之曰發熱無汗不惡風乃可用青龍之石膏發熱有汗不惡寒乃可用白虎之石膏於是麻黃之異有可辨石膏之同亦有可辨而二方之無或差貸者必可為臨證時一助也青龍白虎以汗之有無及惡風惡寒為辨固已然以有汗而論白虎湯治陽明有汗桂枝湯治太陽有汗同是有汗也何由知為太陽之汗而用桂枝何由知為陽明之汗而用白虎是則又須於有汗時專在惡寒不惡寒上辨也桂枝證之汗既在太陽必惡寒以惡寒為太陽主證也白虎證之汗既在陽明必不惡寒以不惡寒為陽明主證也明其惡寒不惡寒各為一經之主證豈獨桂枝白虎之各治一經者昭然若揭即二經之分證不亦儘可推乎石膏之為用也僅一見於本經而湯液失傳伊尹宗本經而為湯液仲景宗湯液而為傷寒雜病論然則自有仲景而石膏之用始顯亦自有仲景而石膏之類如芩連硝黃梔柏者始顯何以必曰仲景但知有寒不知有溫但知用溫不知用寒乎桂麻薑附仲景所以治風寒膏黃芩連仲景所以治溫熱然後知仲景方為用溫之祖仲景方亦為用寒之祖而況仲景之作傷寒論專救當時烏附辛熱之失而特於辛溫外更用此辛寒苦寒鹹寒之藥乎程子曰如讀論語未讀時是此等人讀了後又只是此等人便是不會讀余於傷寒論亦云陽明腑用承氣法仲景於陽邪入腑勢將劫陰之際既有急下之法而又垂慎下之訓蓋示人以陰之欲傷者不可不下即警人以陽之未實者不可早下也此中關鍵究在何處勘出蓋必先問其汗出之多與不多小便之利與不利以驗邪熱之熾與不熾即可知津液之傷與不傷再問其臍腹之痛與不痛矢氣之轉與不轉而後可辨其燥屎之結與不結以消息乎大下微下之間大約欲用承氣所重在問如上所說即有不可不用下之勢若見其熱已潮而又大煩大渴昏沉譫妄目中不了了睛不和或則循衣摸床撮空理線或則揚手擲足惡聞人聲或則口噤齒齘齒背反張臥不著席腳攣急此時病入陽面則狂病入陰面則厥不急用大承氣下其燥屎則陽實劫陰津枯液涸熱極生風危在旦夕胡世人於此杜撰一陰虛邪戀之名又杜撰一養陰退陽之說置承氣三方於不問始則以豆卷豆豉之不足發表者耽擱三日繼以生地石斛麥冬元參之滋膩留邪者又三日而後犀角珠黃至寶紫雪之類將未入心包之邪一舉而送人心包逮心包洞開燥屎仍在陰之將竭事不可為終之以一服去五味之生脈散或一服去薑桂之復脈湯此何意也孰知前此之邪熱非承氣不能除前此之津液非承氣不能保內經云得後利則實者活千金方云藥補五臟者首推大黃可見承氣三方專為此生死關頭而設此時此際豈能捨大黃而別有所謂補藥乎陽明之急下三條固急少陰之急下三條尤急此所以本經之於大黃謂其有安和五臟之能也若夫下之宜慎固有不待言者仲景許多斟酌只在屎未定硬之時而益見屎已硬之不可不下矣傷寒之於承氣為燥屎也而燥屎之甚者或先有熱結旁流病家每謂其已有所以下而不審其結之尤甚至溫熱病則不盡燥結又為膠閉其急於待下則同病家又因其所下如膠以為不可再下此以病本不是燥結醫先不能言之遂以啓病家之疑耳若其為兩陽合病三陽合病之自下利則皆協熱利也又為葛根柴胡與茶連柏之證不在承氣之例是皆當有分別奈何一見下利便云土敗輒議滋補耶少陽用小柴胡法少陽何以為半表半裡也太陽行身之後為表陽明行身之前為里獨少陽行身之側以為前後之樞機故為半表半裡又人身膈以上為陽為表膈以下為陰為里惟少陽居中道而介乎膈之間故亦為半表半裡少陽一經聯絡於陰陽出入之所出則連及太陽入則連及太陰所以云半表者對太陽之全表言所以云半里者對太陰之全裡言而其證則何者為半表裡也少陽主春其氣半出地外半在地中人身之氣亦如之是故發熱而惡寒者為表一熱而不復惡寒者為里少陽則寒熱往來寒為表熱為里也而又有脅痛耳聾在經之證口苦咽乾目眩在腑之證則又以寒熱脅痛耳聾為半表而以口苦咽乾目眩為半里何也兩脅不居身前後而居側兩耳寤則聞寐則不聞口咽目開之則見合之則不見此數者不可謂之表亦不可謂之裡則謂之半表裡而已矣三陽以少陽為樞柴胡為轉樞之用凡因樞之不轉而為病者即在太陽如瘧病中亦用柴胡千金翼有太陽用柴胡湯法即太陽轉樞法也此並不必為半表裡而亦用柴胡者況往來寒熱脅痛耳聾既為少陽必然之證咳悸嘔渴更有少陽或然之證且診其脈弦或弦數或弦遲總之不離乎弦而尚不能知其為柴胡證耶世人既知柴胡一味為半表裡之藥則見有此等證便可放膽用之何所疑而仍不敢用耶況小柴胡一方就本經言柴胡但主半表黃芩乃主半里就六經言柴芩但主半表參生草乃主半里獨指柴胡一味藥為可治半表裡證者猶其識之淺焉者也太陰陽明虛實辨太陰陽明同居中土太陰脾為陰道虛陽明胃為陽道實敦阜卑監二土之虛實本不同也至於病邪之來傳變無定今日而在陽明即為實今日而入太陰即為虛此非其人之病有虛實而病即以臟腑之虛實為虛實耳故同一腹痛也滿而時痛者屬脾滿而大實痛者屬胃在胃則宜大小承氣梔子厚朴枳實湯在脾則宜理中四逆厚朴生薑半夏人參湯間有用大黃芍藥者同一發黃也其黃色之淤晦者屬脾為陰黃其黃色之鮮明者屬胃為陽黃治陽黃宜梔子柏皮湯茵陳蒿湯治陰黃宜理中湯四逆湯間有用麻黃連翹者同一格吐也朝食暮吐為脾寒格食入即吐為胃熱格治熱格宜瀉心湯乾薑黃芩黃連人參湯治寒格宜附子理中湯厚朴生薑半夏人參湯病名則同病本則異在胃在脾之證相反如是故在胃在脾之治亦相懸如是何可混稱脾胃而以治脾者治胃以治胃者治脾哉總之胃屬陽脾屬陰胃為腑脾為臟胃司納脾司輸胃惡燥脾惡濕胃喜降脾喜升胃宜通脾宜補其所以不同之故可以對待而觀即可反觀而得況胃病之脈必大或浮而促脾病之脈必弱或沉而細尤其不可強同者耶再有肝木侮土之證亦當以犯胃乘脾為辨犯胃宜瀉乘脾宜補肝家之木旺同而受其侮者之戊己二土則虛實不同也病因臟腑以為虛實而補瀉隨之知其意者蓋寡矣若但知有臟不知有腑見土之病動稱土敗擯棄聖法謂不可從則豈仲景於已敗之土而用芩連硝黃耶此恐非仲景意矣少陰咽痛吐利寒熱辨少陰病脈陰陽俱緊反汗出者法當咽痛而復吐利此以熱客於少陰之標叔和平脈法所傳師說伏氣之病是也先論咽痛少陰之脈循喉嚨在初得病二三日為陽邪結於會厭但用生草解毒桔梗排膿半夏雞子發聲利咽足矣若夫下利胸滿心煩而咽痛為陰虛液不上蒸者治宜育陰復液則豬膚湯加蜜粉者是下利厥逆面赤而咽痛為陰盛格陽於上者治宜驅陰復陽則通脈四逆湯之加桔梗者是是蓋以陰虛陰盛皆可以致咽痛故有必從兩法而解者再論吐利飲食入口即吐心下嗢嗢欲吐復不能吐者此胸中實不可下而可吐也膈有寒飲而吐且乾嘔者此有水氣不可吐而可溫也吐利交作以手足不冷為吉若吐且利而見厥逆吐且利而見煩躁則凶雖有吳茱萸一法亦未必及救矣終論少陰下利與厥陰下利不同厥陰之利多熱少寒少陰之利多寒少熱故惟厥冷而或咳或悸腹痛下重是陽為陰遏之利用四逆散咳而嘔渴心煩不眠是水熱互結之利用豬苓湯小便不利腹痛便膿血是寒熱不調之利用桃花湯自利清水心下痛二三日咽乾口燥六七日不大便均腹滿是陽盛鑠陰之利用承氣湯凡若此者皆為傳經之邪固屬於熱若夫下利清穀厥逆脈微嘔而汗出引衣自蓋欲向壁臥不喜見明而又面赤戴陽者則皆合於真武附子四逆通脈白通諸方為少陰虛寒之證正與厥陰熱利相反矣少陰下利死證五條吐利躁煩四肢厥逆惡寒身蜷脈不至不煩而躁下利止而眩冒六七日而息高者雖尚有吳茱萸一法終為不治之證苟非利止手足溫身反發熱未易求其生也厥陰熱厥寒厥辨論曰凡厥者陰陽氣不相順接便為厥厥者手足逆冷是也傷寒一二日至四五日而厥者必發熱前熱者後必厥厥深者熱亦深厥微者熱亦微厥五日熱反三日復厥五日厥多熱少其病為進發熱四日厥三日復熱四日厥少熱多其病當愈厥五日熱亦五日設六日當復厥不厥者自愈厥終不過五日以熱五日故知自愈始發熱六日厥反九日後三日脈之其熱續在期之旦日夜半愈所以然者本發熱六日厥反九日復發熱三日並前六日亦為九日與厥相應故期之旦日夜半愈解之曰厥陰之上風氣主之中見少陽火化故有熱人身元陽到此亦化陽邪退伏於內不能充達於外故有厥此其熱固是熱而其厥則更是熱非當其熱時則為熱而當其厥時即為寒也三陰中太陰寒微故手足溫而無厥少陰寒甚故寒厥多而熱厥少厥陰陰極生陽故寒厥少而熱厥多厥陰與少陽相表裡厥陰厥熱之勝復猶少陽寒熱之往來少陽之寒因乎熱故厥陰之厥亦因乎熱熱為陽邪向外厥為陽邪向內厥之與熱總是陽邪出入陰分熱多厥少而熱勝於厥者其傷陰也猶緩厥多熱少而厥勝於熱者其傷陰也更急蓋外來客熱化為陽邪深入厥陰之臟本以向外為吉向內為凶陽而向外則外熱陽而向內則外寒故仲景以厥多為病進熱多為病愈而復申之曰陽氣退故為進蓋謂陽之退伏於內非謂陽之脫絶於外也自有不明此語者妄謂在熱則為熱在厥即為寒是一氣也而五日能寒五日能熱則當此五日厥時用熱藥彼五日熱時用寒藥而如厥後復熱則前五日之熱藥必為禍熱後復厥則前五日之寒藥必為災天下豈有此等病情此等治法乎國朝惟魏念庭陳平伯能知此理若黃坤載與陳修園則皆以厥為寒者也總之厥陰篇中凡有厥而復有熱者其厥也定為熱厥惟有厥無熱甚則一厥不復熱者其厥也方是寒厥以此為辨更於脈滑而喉痹便膿血脈沉短而囊縮脈沉疾而爪甲青不大便而腹滿硬痛諸見厥證所用白虎承氣者互推之自可決然無疑何至認作虛寒輒投薑附觀仲景所謂厥應下之一語不正與少陰急下三條同為傳經熱邪陽實拒陰之大熱證乎仲景所以於四逆湯證必曰厥逆而惡寒者於當歸四逆湯證必曰若其人內有久寒者明是以彼證此彼曰寒則此為熱彼曰惡寒則此為惡熱也惟有蛔厥吐蛔靜而復時煩為胃腑之陽不行用烏梅丸安蛔即以安胃臟厥膚冷躁無暫安時為腎臟之陽不行用茱萸湯溫肝即以溫腎此必更有大汗出大下利而惡寒者乃用四逆輩主治亦復何所疑哉嘗見有周身冰冷而一衣不著半被不蓋者有令兩人各用扇扇之者有欲暢飲冰水者此非惡熱而何厥陰熱利寒利辨厥陰厥逆屬熱者多厥陰下利亦屬熱者多凡先厥後發熱下利必自止見厥則復利者其利本生於熱厥則其熱更甚故雖已止而必復利此不可即其利而知其熱乎即如利止而反汗出者必咽中痛喉為痹是其熱上攻也其無汗而利不止者必發癰膿便膿血是其熱下攻也便膿血者其喉不痹是其熱下攻者不復上攻也其脈寸數尺澀或大或沉弦其證下重欲飲水譫語或有燥屎皆以有熱故也雖發熱不死白頭翁一方並用連柏小承氣一方且兼朴枳治厥陰熱利之法盡之矣惟有脈沉而遲下利清穀身有微熱面赤戴陽為陰盛於下格陽於上又惟外惡寒內拘急大汗而復大利為陰盛於內格陽於外此二者則必用四逆湯通脈四逆湯及白通湯白通加豬膽汁湯之薑附以破陰而回陽蓋非陰之破而陽不回也此則治寒利之法也凡厥陰下利死證六條厥冷微喘躁不得臥厥不止或汗出不止脈不還或脈反實者是為有陰無陽莫能救矣
