body:
  text: 卷十文十黃坤載書總論昌邑黃氏坤載著撰宏富洵是醫門大宗其所立言於傷寒則有陽盛入腑陰盛入臟八字於雜病則有木火宜升金水宜降八字此十六字自能高出於不知陰陽不識升降者之上然凡讀內經通仲景書者代不乏人安見黃氏而外必無能言此理者哉而其自負為古今無雙者則在陽貴陰賤一語夫陰根於陽陽根於陰陰無陽不長陽無陰不生天地之道不能有陽而無陰猶之五行之端不能有火而無水四時之序不能有夏而無冬即以病論其於群陰凝聚微陽幾為所滅者自當扶陽而抑陰若夫病在陽明熱甚劫津陽邪不去陰即大傷之會則少火已成壯火是亢陽之為害也而仍執此貴陽賤陰之說鮮不殆者黃氏於陽明陽盛之病終其身無理會職是故也而無雙之譽則又在自制數方數方之藥則僅有浮萍一味浮萍之外則仍仲景之葛根石膏大黃也其所以能去病者本賴膏黃之大力若浮萍之用同於葛根既有葛即不必復有萍豈得以多於仲景者不過一浮萍而直可前無古人乎況夏月以浮萍發汗有甚於冬月之麻黃者葛根無弊浮萍且未必無弊乎乃以有此浮萍一物自造方名曰元霜曰素雪曰紅雨曰白英曰黃酥曰紫玉曰蒼霖與病全無干涉適以呈其陋劣然此尚不過馬牛其風自貽笑柄已耳至於天魂也地魄也仙也靈也以此方名施諸有病之家其言實不祥幾何不掩耳而走乎然此尚不過厥口詛祝令人惡聞已耳若其傷寒說意一編分證列方自定分兩則教今人治今病者也古今權量全無考訂而於桂枝湯用桂枝生薑各一兩甘草七錢麻黃湯用麻黃一兩桂甘各七錢大青龍湯麻黃用二兩桂甘亦各七錢生薑亦用一兩白虎湯石膏用五兩承氣湯大黃用一兩四錢彼意以為輕於漢代者已三分之二亦知其重於漢代者且十倍而強乎其麻黃二兩桂枝二兩病者萬不能受旁人即未能知而其一兩之生薑辣且何如七錢之甘草甜且何如則胡弗依其方法煎取三杯溫服一杯而試一嘗之乎其方如是而其於病也乃至疫之溫者云無內熱疫之寒者反用膏黃六元之本氣不病而先有方且以少陰之君火而用少陰之椒附以陽明之燥金而用肺金之麥味又謂小兒出痘無關胎毒當發其汗汗透痘即不出必無表解而再出痘之理甚至於承氣之方可加表藥滋潤之品可云泄邪而曰泄陽明之燥滋太陰之濕於燥而可曰泄於濕而反曰滋只此泄燥滋濕四字即在不知醫者恐亦未能首肯也顧其自制藥方自下論斷不曰四聖心源即曰四聖懸樞則孔子繼伏羲文周而系易胡不聞以三聖名十翼之辭孟子承大禹周孔以拒楊墨胡不聞以三聖名七篇之作乃一己之書動稱四聖遂並廬醫而亦奉以聖之名此則太史公傳方術時所不料也其素靈微蘊二十六篇在十篇以前摘錄素靈原文略焉而弗詳然其稱名也猶正及讀至十一二篇忽有趙彥威錢叔玉其人者初訝其為黃帝時人也不意其為黃氏時人也自紀其所治驗而皆謂之素靈之蘊則凡士人談道砥礪半生晚有所得勒成一書以自道其愜心快意之處胡亦不聞以一己之著述為論孟之微蘊者內經之論狂也曰自高明自賢智人即病狂亦何至僭妄若此不較張景岳之傷寒典雜證謨而更有甚焉者乎夫狂亦聖人所許果其志意高遠力能進取此腹容得卿輩數百人亦足以豪乃其自序者八則又無一篇不是健羨榮華嗟嘆貧老若終身之蒙難呼先哲以群兒遂目仲陽為悖謬東垣為昏蒙守真丹溪為罪孽深重宜乎四庫不收其書以其善罵視作倫父而僅入之存目中也至其懸樞自序曰相而不良其罪小醫而不良其罪大相顧可不良乎醫顧大於相乎又答尹公問以門乏好奇之客為憾夫好奇邪者豈是正道非獨不可以談醫即論事亦為失言昔裴晉公與李習之論文曰世有見人之違道者恥與之同形貌共衣服遂思倒置眉目反易冠帶以示異也而不自覺其倒之反之之非也陳同甫與朱文公書曰因吾眼之偶開自以為得不傳之秘盡絕一世之人於門外而謂二千年之君子皆盲眼不可點洗二千年之天地日月若有若無亦太過矣此兩說也不知為何人發一若為黃氏發者抑又怪近之信其人而用其言輒以三錢五錢之桂枝死其親屬於七八月間之痢疾四五月間之溫病既蒙其毒猶詡詡然自謂能讀黃氏書獨得其貴陽賤陰之秘為愕然者久之論黃氏改經啟元子注素問其為篇次本非全元起之舊黃氏素問懸解復有移易此或如宋人之談錯簡尚可言也乃不獨移易且有刪削已令熟讀內經者見而駭然況更改經之字以遂其私既失本義且足變亂治法則其誤人為何如耶世以老年人多陽衰老年人用藥宜溫熱由來已久自奉黃氏以為圭臬而此風若尤甚焉今始知其貴陽賤陰之說乃改經以成之也記有之五十始衰注家但言衰弱不言陰衰陽衰即素問上古天真論年半百而動作皆衰亦不言衰者是陰是陽至陰陽應象論明言年四十而陰氣自半也起居衰矣正與靈樞人生四十腠理始疏榮華頹落之語互相發明年五十體重耳目不聰明矣年六十陰痿氣大衰九竅不利下虛上實涕泣俱出矣則皆明說陰衰不說陽衰以陰陽有二氣氣本非獨說陽也乃黃氏於氣大衰之氣字改作陽字意蓋必欲貴陽而賤陰故先於此處點竄經字以實之不知前人渾言氣字每兼陰陽二氣而言若獨言陽則言陽獨言陰則言陰若兼言陰陽則又必根上文語意而來此處上下文都說陰氣則此句氣字亦說陰氣無疑黃氏又若未嘗不知故必改作陽字而後注之遂謂年五十陽氣漸虛陰氣漸盛年六十陰氣痿弱陽氣大衰無非為貴陽賤陰預留地步示人以說本經典夫以我注經而改經就我彼自以為巧矣不執原文以正之人不將椐其所改之經反謂黃說之有所本哉黃氏周易懸象且多刪改經文直以孔子之十翼為稿本而筆削之尚何有於內經然而醫司命者也陰陽之交出入尤大此之改氣為陽更不能無損於天下之老者故不容不以未改之經為天下告亦不能不以亂名改作為賢者諱也黃氏既改氣字為陽而於本文陰痿二字又非所解人身九竅上竅七下竅二耳目鼻口為上竅二陰為下竅腎開竅於二陰二陰者前陰後陰也年六十陰痿此陰字即前陰之陰謂人年老而陽道不舉如史記五宗世家膠西王端陰痿注謂不能御婦人者是也黃氏不解乃謂此陰字為陰氣痿弱則彼方言陽氣漸虛陰氣漸盛何以漸盛者忽而痿弱痿弱者既在陰氣何以大衰者忽在陽氣內經於痿有專篇皆言熱證如所云肺痿為肺熱葉焦骨痿生於大熱治痿獨取陽明又云肝心脾腎之熱皆能致痿此處陰痿明即腎氣之熱腎熱之甚則陰氣大衰正與經文陰氣自半起居衰矣之說彼此相符黃氏欲說陽衰不得不將此義抹煞而語意遂不貫串矣論黃氏竊書竊人之書以為己有自昔已然若郭象之於向秀主父偃之於仲舒上官大夫之於屈原以及齊邱化書孟德新書皆其著者也元明以降此風尤甚其歷見於陸定圃書中者亦彰彰耳目間矣至醫家之言竟相揜襲則其事愈隱人罕言之如張景岳之新方八陣全錄方壺道人壺天八法而截去卷尾數方者也其類經亦羅謙甫承其師命所稱三脫稿而三毀之三年而後成者元劉因靜修集有謙甫內經類編序即此書也喻嘉言努力著書其暗襲方氏處為林北海抉而出之楊慄山寒溫條辨之二三兩卷為三原陳素中未刻稿吳儀洛之成方切用即汪訒庵醫方集解其本草從新亦即訒庵本草備要改頭換面又是一書尤不足道然或誦習之久不覺用為已語尚是文人常事若黃氏則自負無雙者也既自以為無雙則他人之物皆當為其唾餘而無足拾者乃其四聖懸樞中六經諸論及元霜七方取用青萍則全是諸城劉松峰說疫之書何哉松峰於說疫一書自言瘟疫之需汗亟矣思能發瘟疫之汗當無過於浮萍其性涼散入肺經達皮膚發汗甚於麻黃取以治瘟疫輒效後又質諸北海老友黃玉楸頗與余意合始敢筆之於書然則六經之論松峰之論也七方之制松峰之方也浮萍一味松峰之藥也松峰說疫刻於乾隆五十年當黃氏作懸樞時尚為松峰未成之書其或松峰有心得而漏之玉楸其或揆自玉楸而鬆峰襲之皆未可知然松峰道及玉楸而玉楸無一字及松峰蓋欲說漢以後無一人自不容同時有二人襲其美者必掩其名他人猶可黃氏大醫而亦同於郭象翼莊之類也是不能為賢者諱也論黃氏貴陽賤陰陽貴陰賤之說自古為昭黃氏著書本此立論撰諸大易消長之機君人者齊治平之道其誰曰不然然而以之論病則有宜有不宜也病有以陽虛而致陰盛者貴扶陽以抑陰病有以陰盛而致陽虛者貴壯陽以配陰是皆宜於貴陽賤陰之法然陽虛則陽可貴陰虛則陰即未可賤也陰盛則陰可賤陽盛則陽即不為貴也貴陽則陽不虛是為宜貴陽則陰不盛亦為宜若貴陽而陰益虛且貴陽而陽愈盛則大不宜陰盛之病既不可以治陰虛者統治之則陽盛之病亦豈可以治陽虛者混言之哉素問惟靈蘭秘典主明則下安主不明則十二官危數語有貴陽賤陰之意此外則云百病之生久則傳化而陽氣當隔隔者當瀉故陽畜積病當死又云陰陽之要陽密乃固陽強不能密陰氣乃絕此其不甚貴陽之意言下顯然而更有意在言外令人默喻得之者如所云天氣清淨光明者也天明則日月不明此謂大明見則小明掩故且欲其陽之藏也不貴也又云蒼天之氣清淨則志意治順之則陽氣固此謂陽不順降即不固密故並懼其陽之逆也不貴也又云陽氣者煩勞則張精絕此更謂陽若侈張陰即因以竭絕也不貴也又云陽氣者精則養神柔則養筋此又欲其陽之柔而不欲其陽之剛且強也不貴也余讀內經覺陽之足以病人者皆不為經所貴所以遍檢素問八十一篇欲求一貴陽之說不可得而於此數處且若預恐來世有以陽為口實者而人多忽之他人不足責黃氏非善解內經者乎天下之病有陰虛有陽虛而惟傷寒論則只論陰盛陽盛否則論陰亡陽亡獨不論陰虛陽虛病人少厥陰盛而陽欲亡所以貴陽病入陽明陽盛而陰欲亡所以不貴陽而貴陰仲景於少厥陰盛用薑附以回陽貴陽也於陽明陽盛用膏黃以救陰不貴陽而貴陰也於少厥之熱厥熱利仍為陽盛即仍用膏黃以固陰收陽者貴陽而此時之陽不貴也非是則少厥之陽貴陽明之陽不貴少厥之陰賤陽明之陰不賤不明乎此自不能說仲景之意他人不足責黃氏非善解傷寒者乎抑黃氏既作貴陽賤陰之說而其言又有自相矛盾者何也凡仲景於陽明用芩連膏黃時皆為陽盛不為陽虛黃氏又自忘其曾言陽盛入腑而變為陽敗陽敗者陽虛也以仲景之見為陽盛者至黃氏而見為陽虛或竟是仲景不及黃氏處然既認定陽虛則竟用補陽之藥以補陽仲景固不與爭也乃於仲景膏黃方中忽加二冬元參生地蓯蓉之陰藥以補陰則又不是陽虛而為陰虛矣陽所由盛黃氏既終身不解而於陽盛之病則認作陽虛之病又於認作陽虛之病教人盡用陰虛之藥是豈病之陽盛陽虛必力與古人辯而藥之所以治陽虛陰虛者不必為今人分乎嗟乎陽明之病非他生死出入之會也若以證之於經則亦陽強陽蓄積之會也人病求醫人豈奈此陽虛陰虛可以通治之醫何此無他總以陽貴陰賤四字獨不得施諸陽明一經所以處處觸喉棘舌萬說不去而強言之異哉黃氏一代之大醫也余以病人之故亦不能為賢者諱也論黃氏不識陽明病傷寒之病陽明為多傷寒之治陽明為要治之得失生死系焉故惟能治陽明者使其病即愈於陽明而不更傳變活人亦為最易蓋以此時之陽明只是邪陷之陽明尚非土敗之陽明也黃氏乃以陷里之實邪認作陽虛之土敗則其於內經所謂氣盛熱壯之陽明仲景所謂土為萬物所歸無所復傳之陽明直是不會識得遂以天下最多之病罔知所措於何見之見之於所為陽明病解而其於葛根芩連一證則尤大失仲景之意者也傷寒論太陽病桂枝證醫反下之利遂不止脈促者表未解也喘而汗出者葛根黃芩黃連湯主之黃氏於傷寒懸解解之曰桂枝證醫反下之敗其中氣表陽乘裡虛內陷雖內有四逆證外有桂枝證而熱在胸膈二方俱不能受宜葛根達陽明之郁芩連清君相之火然後中下之寒徐可議溫又於傷寒說意為之說曰桂枝證醫反下之敗其中氣以致下后里空里宜四逆表宜桂枝而膈熱壅阻二方難用宜葛根芩連達胃鬱而清上熱然後議溫未晚豈知仲景之意不爾也此條之下利不如是講也仲景此條蓋謂本太陽病一經誤下遂將太陽表證陷入陽明即為陽明裡證所陷者實熱也即陽邪也是當專以芩連直清陽明之裡然其脈促其證喘而汗出則不全是陽明之裡而尚有陽明之表故一面清之以芩連即一面達之以葛根條首之必冠以太陽者明乎此時之病已從太陽入陽明不得仍從太陽治所以不復為桂枝證而為葛根證所以不復用有桂麻之葛根湯而用有芩連之葛根湯本經葛根能起陰氣此既為脈促喘汗之利則陽盛而陰欲傷矣陽再盛陰必亡且將繼以白虎承氣適與脈遲倦臥之利當以四逆回陽者相反脈促宜清則脈促之利即宜清喘汗宜清則喘汗之利亦宜清內外本屬一貫虛實絕無兩歧黃氏意中乃只有當用四逆溫之之利曾未識陽邪成實陷入陽明尚有宜用葛根芩連兼表兼清之利所以一則曰議溫再則曰議溫其意直欲便用薑附而又無奈仲景之芩連疊用雖字而字多所轉折接用宜字一落千丈不得不姑就原方順文強解夫利之為病虛寒則竟宜溫實熱則竟宜清豈有本當用溫暫且用清暫且用清終當用溫之理仲景於少厥陽盛之利尚用白頭翁湯之連柏其在三陰且然而況兩陽其在臟病且然而況腑病乃懸解於陽明七章之首自言太陽病將入陽明腑用葛根矣而又以此分作太陽病入太陰臟於說意第七條亦同然則仲景此條畢竟是陽明乎是太陰乎是腑證乎是臟證乎乃忽曰脾陰虛忽曰胃氣逆又曰葛根芩連達胃郁是仍非太陰脾仍是陽明胃矣脾臟也胃腑也一陰一陽一虛一實之分也虛實溫清相反如是是於陽明之實太陰之虛胸中全未了徹故其忽而欲清忽而欲溫手下全無把握況此時之利既不是裡虛里空之利此方之清火亦不是清君相之火此人之中下亦何嘗是有寒之中下且何以必要用四逆桂枝湯而又覺兩方之難用又何以必謂其有四逆桂枝證而又疑二方之不能受既不能受自不當用若果當用有何難用若既難用何必議用其稱傷寒方難用者群兒之聲口自負無雙者不應如是也乃陽明一經全不解仲景意動曰土敗曰氣敗曰陽敗曰中氣敗曰腎陽亦敗一若下利一證舍土敗無他說舍溫無他法者夫既土敗陽敗矣中氣敗腎陽亦敗矣而仲景乃用芩連於中陽已敗之餘再用膏黃於腎陽亦敗之後黃氏既經見到而於葛根芩連之方何以仍可遷就乎揆其所以然總因貴陽賤陰之見橫亙於中而於陽明病陽盛入腑之際仍認作可貴之陽於仲景用芩連膏黃盡力救陰之會仍認作可賤之陰則其所以說仲景之意者果安在哉然而陽明一經為傷寒中最多之病即為傷寒中最要之治苟陽明之不能治又何有於他經靈胎謂傷寒論是學者下手功夫余謂陽明證尤傷寒下手功夫也黃氏之不識陽明更不能為賢者諱也黃氏於葛根芩連方既一誤至此而其解白虎承氣亦大失仲景意仲景之石膏所以退陽佐甘草即可保陰蓋不退陽則陰即不保也乃必於白虎湯另用元參麥冬生地謂為養陰則於仲景用石膏之意全不解矣仲景之大黃所以存陰佐樸枳所以急下蓋不急下則陰即不存也乃必於承氣湯另用天冬地黃蓯蓉謂為滋陰則於仲景用大黃之意既非所解而於樸枳之用且相反矣相反之故病家豈所能知然即此樸枳蓯蓉滋之與燥燥之與潤並作一方滋而是則燥非燥而是則潤非即在不談醫者亦何妨於此一窮詰耶仲景用樸枳之燥正在舌黑齒焦唇裂時以此時誠如黃氏所見熱在胸膈膈熱壅阻不盪滌則陽不退陽不退則陰將亡陰之亡也為陽盛非為陰虛所以斷不用滋潤藥也乃黃氏必曰承氣之法能亡陽盛之微陰又曰變承氣之盪滌泄之以滋潤之品直若縱有承氣證必不可用承氣湯遂云即使確有下證必加天地蓯蓉然後雖用攻下不至亡陰夫仲景之下法為確有下證設也若確有下證而定不用下法則下法將始終無用處而直可廢此法矣其意大不滿於仲景豈僅目漢以後人為群兒哉世之不識陽明者原不獨一黃氏然他人之不識陽明皆不及黃氏之顯反若無從說起今得借黃氏暢發此論使陽明得還仲景治法則黃氏亦大有功於病者古人講學以明道為歸即如朱陸異同亦非門戶之見黃氏著作等身人所不及除此不經盡堪節取惜無有揀金於沙拾珊瑚於大海者論王清任醫林改錯王清任者直隸玉田人自稱鴉鴻橋勳臣其所指醫林之錯而必當改者則黃帝之素問越人之難經仲景之傷寒論也其所由識其錯而可據以改者則俘獲之逆酋凌遲之犯婦暴露犬食之殘骸剩骨也其言曰前人創造醫書臟腑錯誤恨無可證乃於嘉慶二年四月遊灤州之稻地鎮其時彼處小兒正染瘟疫十死八九多用代席裹埋代席者代棺之席也彼處鄉風更不深埋意在犬食利於下胎不死故破腹露臟之兒日有百數初未嘗不掩鼻後念古人所以錯論臟腑皆由未經親見遂不避汙穢每日清晨就視犬食之餘有腸胃者多有心肝者少十中看全不過二三連視十日看全三十餘人始知醫書所繪臟腑即件數多寡亦不相合尚有膈膜一片其薄如紙皆因破壞未得明驗四年六月有遼陽州一婦殺其夫與翁解省擬剮跟至西關忽悟彼非男子不忍近視及行刑者提其心肝肺從面前過始得細看二十五年有打死其母之剮犯行刑于崇文門卻得近前而膈膜已破道光八年五月十四剮犯張格爾又不能近看自思一簣未成不甘中止九年遇江寧布政使恆公言曾鎮守哈密領兵於喀什噶爾所見誅戮甚多細說膈膜形狀始得知之的確因思黃帝下問岐伯何得不知妄對秦越人難經以無憑之談做欺人之事張仲景之傷寒論方雖有效而經絡皆錯於是以內經臟腑繪圖於前以彼親見各囚犯各死嬰之屍身臟腑繪圖於後有左氣門右氣門衛總管營總管津管瓏管雞冠油水鈴鐺出水道等圖為黃帝所未知再證以隨喂隨殺之畜三四日不喂而殺之畜與人相比為越人仲景所未識要後醫遇機會細心查看是教人於胔骼堆中殺人場上學醫道矣試思人之已死癟者癟矣倒者倒矣氣已斷何由知是氣門水已走何由知為水道犬食之屍刑餘之人何由知其件數之多寡心肝肺一把抓在手中何由知其部位之高低彼縱能就死屍之身首一一檢之勢不能再剝活人之皮肉一一比之且於死屍轉若有氣於活人偏說無氣又謂凡斬毆之以破傷風死者凶手擬抵若早明乎氣散氣亡之義即用黃耆半斤大補其氣救一個豈不是救兩個乃今知其治中風之人每服用耆四兩其於治病之耆較之救凶之耆尚輕一半也尚短五成也於是而都下遂盛傳其補陽還五一方論補陽還五湯近日都門有風行之方曰補陽還五以治中風諸病及老年人一切虛證方出醫林改錯中初不解其方之何以名還五也取而視之乃知其所謂五者謂人身十成元氣虧二成剩八成每半身仍有四成氣則無病若虧五成剩五成每半身只剩二成半右半身二成半歸併於左則右半身無氣左半身二成半歸併於右則左半身無氣受病之半身向不病之半身流動比水流波浪之聲尤甚於是思得一方以息其波浪聲而還其五成虧乃分左右各二成半而並之則曰五合左右各二成半之虧而還之則曰還還五兩字於是乎心領神會而得其解矣然於其所以為方者則尚末能明其意也觀其方用黃耆四兩歸尾二錢赤芍錢半川芎桃仁紅花各一錢加地龍亦一錢主治半身不遂方以黃耆為君當歸為臣若例以古法當歸補血湯黃耆五倍於當歸則二錢之歸宜君以一兩之耆若四兩之耆即當臣以八錢之歸今則耆且二十倍于歸矣大約欲以還五成之虧有必需乎四兩之多者若照古方用耆一兩則只還得一成零二分五之氣其無氣之三成七分半久假不歸逋負尚多方即不驗於是乎每服四兩之黃耆亦心領神會而得其解矣然其方之所以名補陽者則又何也蓋以當歸為補血血為陰以黃耆為補氣氣為陽故以黃耆為可補無氣之半身即可補無陽之半身於是而補陽兩字亦復心領神會而得其解矣然而黃耆補氣不補陽氣而補陰氣者也正不得以補陰氣者謂補陽氣而即用其補陰之藥換作補陽之名陰陽二氣之在身陰氣盛則陽氣不能與之敵若以補陰氣之藥誤作補陽氣而恣啖之則陰氣日以長陽氣日以消陰陽消長之機固非王清任所能喻獨所謂合左右身各二成半而為五成者則清任獨知之而他人所不能知即所謂甚於波浪聲者亦清任獨聞之而他人所不能聞此其所以獨有是方而方獨可以是名也都中人語云此方可一二百服准以四兩一服四服即得一斤百服則二十五斤矣二百服則五十斤矣其於真是半身不遂病果在金匱血痹虛勞門者方名雖曰補陽方藥適以補陰或能以病就藥藥雖過度尚無大害然真要在六個月零二十日內服完黃耆五十斤恐亦無此理也若夫中風中氣或且為痰中食中而亦曰此方可以通治則中風當祛風中氣當利氣痰中食中尤當消食豁痰以疏通之此則半身皆可不遂而病則不是虛勞若亦服四兩之耆病即不起罹禍之家主名且有屬矣至其言人病之虛防有瘀血方故取用桃紅此意未嘗不是然凡消瘀之法因於寒者逐其寒因於熱者退其熱因於氣之鬱結者尤必達其鬱解其結而瘀始消正不徒恃桃紅為也且病之利於桃紅者必其大不利於黃耆者也且未聞方之用桃紅者而可名為補陽者也奇哉方乎不奇於鴉鴻橋之有是方正奇在服是方者信其為真有是理而方真可有是名也安得不述此奇談為未受愚之病家告哉
