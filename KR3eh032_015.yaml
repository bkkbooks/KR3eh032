body:
  text: 卷十五文十五答袁生上池問外感六因余既為袁生說六經為標六氣為本之理而生又以外感六因問生之意謂風暑濕燥寒自是外因而火之所以為外因者何在故以為疑則以前人於火之一因久置弗道故幾不知六因之有火耳內經兩言寒暑燥濕風此論天時不論人病故不及於火而為五至其言百病之生皆生於風寒暑濕燥火則始以病之變化言故並及於火而為六人身三陰三陽上奉天之五氣以加臨地之五行天之五氣暑分為火則為六地之五行火分君相亦為六此所以共為六因而氣交之病未有不因此六者韓飛霞所謂五臟皆有火平則怡病則亂者即此火也人則以為四時之邪無不感受於外火則從何感受而亦若自外來耶夫言四時之序春為風夏為暑長夏為濕秋為燥冬為寒皆有外因火則本非外因然以風暑濕燥寒感之於外火未有不應之於內者則在內之火即此在外之五者有以致之蓋此火為人身自有之元陽不病則為熟腐水穀之火一日不可無之火也經云風以動之暑以蒸之濕以潤之燥以干之寒以堅之而火以溫之者是也病則為劫奪津液之火一日不可有之火也經云風勝則地動暑勝則地濕濕勝則地泥燥勝則地干寒勝則地裂而火勝則地固者是也不可無者此火不可有者亦此火經故無不以六者並言之而及其論病則獨言風寒在外燥熱在上濕氣居中而火但曰遊行其間且但言風勝則動寒勝則浮燥勝則乾熱勝則腫而並不及於火蓋以五行之常不為大病火則病大而後有之偶感風寒隨即消散火未及病病不因於火也不消散而遊行之火至此而勝病即因於火矣經言風寒客於人使人毫毛畢直皮膚閉而為熱此熱即因於火輕為表熱重為裡熱輕則漬形以為汗而曰當是之時可汗而發重則少火之氣壯而曰火淫於內治以鹹冷言火之淫於內自非火之感於外矣然既因感而為火因火而為病則火雖病於內而火之所以病則由於外此所以言病之因必當併火計之而為六且以見消散之而不愈者其病必因於火故六因所重正在此一因也人惟略此一因遂於五因外之因火而病者不知所以為治嗟乎火之一因仲景知之矣病在太少火之未病僅為中風傷寒病至陽明火之既病即為濕溫溫熱所以傷寒論陽明經病多屬於火陽明經方皆以治火奈何泥此傷寒兩字於仲景書所用清法凡足以治火之因者皆若未之見也此溫病熱病所以皆失其治而即無以辨風寒溫熱之所由分也彼以陽明實熱認作土敗者直並外感六因之未解耳答施王二生問陽明濕溫之治施生子程王生藝耕同侍坐於世補齊教以濕溫之病必從陽明論治二子惑焉謂陽明主燥太陰主濕夫子乃以濕屬陽明何也且陽明之燥而何以有濕也余曰此陽明中氣之病不求諸內經所言本標中見者不能知其然矣內經六微旨大論以火燥寒風熱濕為本本者六元本始之氣也以少陽太厥少太為標標者六經標著之氣也以上本下標之中見者為中氣中氣者人身臟腑表裡互相為絡之氣也經之言氣則曰有從本者有從標本者有不從標本者經之言病則曰有生於本者有生於標者有生於中氣者經之言治則曰少陽太陰從本少陰太陽從本從標陽明厥陰不從標本從乎中也啓元子解之曰少陽本火太陰本濕標本同故從本少陰本熱標陰太陽本寒標陽標本異故或從本或從標陽明之中太陰厥陰之中相火標本與中不同故不從標本而從乎中其言標本固所易曉而於從中之治則仍言其所當然尚未言其所以然也余謂六經既各有中氣何不可從中治陽明厥陰既各有標本亦豈無從標本治者胡獨於陽明厥陰必從中治耶蓋經既言病言治則治必因病而施彼四經之病不生於中氣則治不必從乎中惟此陽明厥陰兩經則有生於中氣之病故有必從中氣之治試就各經論之少陽相火火為其本太陰濕土濕為其本火陽也而少陽之經亦陽濕陰也而太陰之經亦陰既有火與濕之本在則標從本化而中之木為火母中之金為土子則中氣亦從本化故從本治不從標治亦不必從中治也少陰太陽一為本熱一為本寒本之熱同中陽中之寒又同標陰本之寒同中陰中之熱又同標陽中與本同而標與本則異中與標同而本與標則異故或從本治或從標治而亦不必從中治也獨至陽明則本燥標陽而中為濕厥陰則本風標陰而中為火本與標之不同理易明也而中之火何以見於厥陰中之濕何以見於陽明則人皆忽之而不知病既生於中氣治即不從標本故有必從乎中治者若火但見於少陽則治少陽之本濕但見於太陰則治太陰之本以其病生於本也若厥陰而以中之火病則必治中氣之火陽明而以中之濕病則必治中氣之濕以其病生於中氣也不講內經中見之旨何由知厥陰風病之有火而陽明溫病之有濕哉余於風寒溫熱多所發明而於濕溫之論猶有缺焉二子曰然則濕而見為寒濕則治太陰濕而見為濕溫必治陽明其為方也當是蒼朮白虎之類乎余曰得之矣答云依問內經諸治法濮生云依以內外反正逆從諸治法為問是皆在內經至真要大論中所云外者外治內者內治正者正治反者反治逆者正治從者反治微者逆之甚者從之逆正順也若順逆也者當即以經解經為吾子一一明之如陽虛則外寒陰虛則內熱陽盛則外熱陰盛則內寒此病之內外有異同之分者也從外之內者治其外從內之外者調其內從內之外而盛於外者先調其內後治其外從外之內而盛於內者先治其外後調其內此治之內外有標本之異者也如陽勝則熱陰勝則寒是為正病治寒以熱治熱以寒是為正治重寒必熱重熱必寒是為反病諸寒之而熱者取之陰諸熱之而寒者取諸陽是為反治此正者正治反者反治之說也如陽病治陰陰病治陽藥似與病相逆卻是正治之法通因通用塞因塞用藥似與病相從卻是反治之法此逆者正治從者反治之說也病之微者發表不遠熱攻裡不遠寒其病尚微逆之即愈逆即正治也病之甚者奇之不去則偶之偶不去則反佐以取之其病既甚從之始愈從則反治也此微者從之甚者逆之之說也如重陽必陰治當以寒重陰必陽治當以熱外雖若逆而中則順逆之正所以為順也寒極生熱而再治以熱熱極生寒而再治以寒則外雖若順而中則逆順之則未有不逆者故曰逆正順也若順逆也是即可見逆為正治而順為反治也凡此諸法內經且屢言之如有邪者漬形以為汗其在皮者汗而發之邪之新客逢而瀉之此外治也其高者因而越之其下者引而竭之中滿者瀉之於內此內治也發腠理致津液通氣開鬼門潔淨府與夫身汗得後利則實者活此內外交治者也是皆為正治逆治之法其曰治熱以寒溫而行之治寒以熱涼而行之治溫以清冷而行之治清以溫熱而行之是亦反治從治之法惟病可正治者真形易見人所共曉病須反治者假象難明人都莫辨則於寒熱虛實之真假兩途知之為尤要矣先以寒熱言之真寒則其脈沉或微弱而遲所見之病無非寒象真熱則其脈浮或滑大而數所見之病無非熱象此為真病逆而治之固無可疑獨至陽證似陰火極似水乃熱極反兼寒化而脈亦沉伏者則真熱假寒即陽盛格陰也陰證似陽水極似火乃寒極反兼熱化而脈且浮散者則真寒假熱即陰盛格陽也此寒熱之真假宜於反治者也再以虛實言之則至虛有盛候反瀉則殆如除脹滿之當用人參者是大實有羸狀誤補益困如止瀉利之宜用大黃者是此虛實之真假宜於反治者也故經又曰伏其所主而先其所因先其所因者求病之由伏其所主者知病之本也素問所垂治法多矣人皆謂是無方之書我知其為有方之始惟自天元紀以下七篇後人以其皆論運氣遂若與治法無關棄置焉而弗道豈知治病之法盡在此七篇中而至真要大論尤有大關乎治要者乎由是以求仲景所以撰用素問者於桂麻膏黃之治有內外於陷胸承氣之治有微甚於瀉心之用芩連而佐以乾薑白通之用薑附而佐以膽汁者有反正於烏梅丸復脈湯之寒熱並用諸加參草方之虛實兼到者有逆從仲景之聖亦惟取法於內經而已則苟欲治病內經固不可不讀而苟得其解則內經正不難讀也岐伯曰知其要者一言而終不知其要流散無窮意在斯乎意在斯乎答坤吾問傷寒傳經為熱直中為寒坤吾比部來遊吾門而秋曹政繁未暇旁及余亦慮無以為坤吾益也日者以人稱傷寒之病在三陽為傳經在三陰為直中傳經為熱直中為寒則是三陽皆熱證三陰皆寒證矣貽誤來學豈細故哉原以一言為請余乃為之說曰凡病自太陽來者即至三陰皆為傳凡初起即見其經證不始太陽者雖在三陽亦為中考之於經無不可曉後之模糊影響皆坐不熟經文故耳素問熱病論傷寒一日太陽受之至六日厥陰受之熟玩受之兩字知是病及其經不是其經自病凡所謂逆經傳循經傳越經傳亦有首尾傳者皆傳經也靈樞病形篇邪之中人也無有常中陰則溜於腑中陽則溜於經所以經又云或中於陽或中於陰而尚不知三陽之亦得雲中乎況經又分言之而曰中於項則下太陽中於面則下陽明中於頰則下少陽其中於膺背兩脅亦下其經中於陰者常從臂䟰始蓋以太陽行身之背陽明行身之前少陽行身之側而太陰則主四肢少厥又從太陰而入故也是以傷寒論太陽之頭項強痛項背強𠘧𠘧為中項中背之別陽明之舌乾鼻燥胸中有熱為中面中膺之殊少陽之兩耳無聞脅下硬滿為中頰中脅之異太陰之四肢煩疼手足自溫少陰之手足寒厥陰之諸四逆厥者為中臂中䟰之分中即傷也太陽傷風何以亦名中風豈不亦為直中乃以邪入三陰遂若定為寒證如朱肱活人書云云者是未明乎三陰三陽乃經也非證也證則三陽亦有寒證三陰僅多熱證也不然而傷寒論於太陰亦有大黃證於少厥亦有白虎承氣證者果胡為者耶且於太陽即用真武湯於陽明有用四逆湯者又胡為者耶明乎六經之皆有傳經皆有直中則為熱為寒豈可論經而不論證哉然此尚不過人云亦云已爾余則以為六經之傳變本是六經之氣化本不是手足之六經如太陽陽也而太陽之氣化為寒水則太陽本不是熱少陰陰也而少陰之氣化為君火則少陰本不是寒自氣化之說亡而傳足傳手之論起六經傳變寒熱遂淆今日之六經全非先民之六經矣吾子此問吾道之幸也靈樞云邪雖入於陰經而臟氣猶實實而不能客則還入於腑此即中陰溜腑之義也此義亦久亡矣再與云依論中陰溜腑前以傳經直中與坤吾言之既詳而中陰溜腑之義尚未有所闡發今再與吾子剖之人之但知中陰者既若三陰證皆當溫人之不知溜腑者又若三陰證皆可下則以彼於臟腑之腑表裡之裡皆異於古所云亦不同於吾所聞耳趙養葵醫貫言傷寒邪熱入於胃腑若以六味地黃丸大劑與之何至傳入少陰為燥實堅之證六味丸之謬人所共知且反說成中腑而溜於陰顯背岐伯之訓而於仲景所謂陽明居中土也萬物所歸無所復傳者亦全無理會夫豈能知病苟入胃得為下證即無死證而自陰溜腑之更為可貴也哉若傅青主書亦以胃實一證屬之三陰必非出自徵君之手而為晉人鈔本沿趙之訛妄加以亂真未可知也其有不知腑獨言胃里獨言腑而反說成三陰為里里始當下者成無己也成云三陽受邪為病在表法當汗三陰受邪為病在裡法當下則竟以里屬三陰而惟三陰為可下矣又有不解內經未滿三日可汗滿三日可泄之義本只三日並非六日而反說成三日為陽三日為陰者劉河間也劉云傷寒熱病前三日太陽陽明少陽受之熱壯於表汗之愈後三日太陰少陰厥陰受之熱傳於裡下之愈則以三日為六日而滿三日即為三陰矣於是馬宗素遂有三陰證者其熱在臟臟為里里為陰陰當下之說並有喻嘉言病至三陰則舍大門近寢室便當大開後門使從大便出之說此皆不問溜腑與否直若傷寒熱病惟三陰有下證且非三陰無下法者夫仲景下法皆為腑證皆謂為里蓋與表對舉則曰里與汗對舉則為下下法固獨為陽明熱病設也洵如諸家之說何又與彼所謂三陰皆寒三陰皆當溫者不自顧其矛盾耶此無他一誤於臟腑之不分再誤於表裡之無別先以臟腑言之內經於六腑亦稱臟如十二臟相使十一臟皆取決於膽又曰三陽經絡受病未入於臟可汗又曰治之各通其臟脈者其言臟也蓋言腑也此則臟腑之腑也膀胱為太陽腑胃為陽明腑膽三焦為少陽腑凡本經之表以本經之裡為腑此則經腑之腑而非臟腑之腑也內經之於胃又但稱腑其曰邪雖入於陰經臟氣猶實邪不能客還之於腑腑者胃也王安道熱鬱不得外泄遂還里而成可攻之證里亦腑也即胃也此則中陰溜腑而為胃腑之腑也若夫表裡之裡則更處處不同其腑為表臟為里者言五臟六腑相表裡也三陽為表三陰為里者言手足十二經相表裡也就陽明指太陽為表就太陽指陽明為里者言太陽陽明兩經相表裡也太陽以陽明為里而陽明之經又以陽明腑為里者言陽明一經之經腑相表裡也其不同處皆跟各處上文而來腑字之不辨遂並里字而亦昧之於斯二者既明下法自然不誤仲景所謂堅滿燥實於陽明三言急下者為太陽徑入陽明腑之證所謂諸四逆厥不可下之者為三陰未入陽明腑之證所謂厥應下之且於少陰亦三言急下者為少陰已入陽明腑之證蓋以六經固皆稱腑三陽各自有腑而胃為六腑總司又獨得以腑稱也是知岐伯之言中陰則溜於腑者即此獨得稱腑之腑即此獨有下法之腑正可由此以明中陰而不溜於腑者則為臟寒而必用溫法之陰非即臟實而可用下法之陰奈何諸大家皆不解腑之為胃直將三陰可溫之裡視同陽明可下之裡不待三陰之溜腑輒謂三陰之可下哉惟解得三陰非當下之裡解得胃腑為里之當下則下也腑也里也皆於是乎可明而所恃者則惟靈樞中陰溜腑一語初不料凡屬大家竟無能道此四字者而僅有一慈溪柯氏獨於論翼中引此一段經文也煩吾子以余言告坤吾庶後有疑及下證何以屬三陰三陰何以有下證者得余言而知臟腑表裡之必先分曉也至別有自號大家而云縱有下證切不可用下法獨言之於陽明腑證者則非余所知矣陰陽偏勝治法不同示云依人身之陰陽得其平則不病偏勝則病故有陰虛之病其甚者火且旺有陽虛之病其甚者水且泛有陰盛之病其甚者且格陽有陽盛之病其甚者且格陰人之言曰陰虛者補陰而陰不虛陽虛者補陽而陽不虛陰盛者補陽而陰不盛陽盛者補陰而陽不盛陰陽有對待之觀治陰陽者自當作平列之勢余則以為陰虛而致火旺陽虛而致水泛自應平列其治獨至陰盛陽盛兩證則其勢有不能平列者蓋陰盛之病陰不自為病也凡陰所見病之處必其陽所不到之處故陰盛無消陰之法而但有補陽以破陰之法補其陽始足以敵其陰也若於陽盛之病則有不能補陰以敵陽者矣蓋陽而傷陰必先令陽退而陰乃保凡在補陰之藥無不膩滯而滿中滋陰則不足助陽則有餘故陽盛無補陰之法而但有伐陽以保陰之法伐其陽始足以存其陰也於何徵之徵之於仲景方而已仲景之治陰盛也有真武四逆之薑附焉仲景之治陽盛也有白虎承氣之膏黃焉試觀一百十三方何絶無養陰以退陽者乃即以仲景之不養陰以退陽而別制仲景法外之劑豈知仲景於少厥之陽盛尚有承氣白虎之法而況其為陽明之陽盛乎推原其故則以世之目為陽盛者乃陰盛而格陽看似陽盛實是陰盛又其所謂補陰而陽不盛者乃陰虛而陽亢看似陽盛實是陰虛至以陰盛陰虛兩證皆目之為陽盛而遇真是陽盛之病遂皆作陰盛陰虛觀且置陰盛不言而但作陰虛觀矣故欲明陽盛之治必先將陰虛陽亢陰盛格陽之近似乎陽盛者別而出之然後陽盛之真面目乃見見得陽盛之真面目而尚疑陽盛之亦可補陰養陰之亦可退陽者未之有也陰陽偏勝其治法之不同有如此者再以陰虛陽亢陰盛格陽兩證觀之而歧之中又有歧焉陽之亢陽之格從其外而觀之不知者方以為皆是陽病其知者亦僅謂皆是陰病然其病也一由陰虛而來一由陰盛而來陰雖同而陰之虛盛則相反故凡陰盛格陽之病仍作陰虛陽亢治之不補陽而反補陰鮮不殆者若更以陰虛作陽盛更以陰盛作陽盛尚足與論陰陽哉況復指陰作血不識陰陽皆以氣言所以補陰之藥大半皆補血之藥因更以補血之藥認作可以退陽之藥口中言陰意中實是血也醫者言血病者實是氣也如之何如之何至於何等藥是養陰何等藥可以退陽何等病可講養陰何等病必先退陽者則惟問諸仲景可耳實火虛火陰火總論示云依傷寒病中陽明實熱張介賓所謂果有火證火脈者也人於此證獨名之為實火人於此證而外凡有火證則皆名為虛火余則以為陽明之熱固是實火而論火之實則雜證中自有實火之病正當除此陽明熱而分火之虛實甚非可以雜證之火概目之為虛火也病機十九條凡明言屬火者五而其言屬於熱者亦火也即其言屬肝與心者亦火也凡此皆雜證皆為實火治此火者仍當取用芩連梔柏膏黃犀羚龍膽之屬自夫人概作虛火論而雜證中實火治法遂因之而廢矣除此實火之外則有虛火如經云一水不勝二火二火者君相之火也一水不勝五火五火者五志之火也即經所云少水不能滅盛火而陽獨治陽獨治者不能生養之火此火即由陰虛而來者也凡此則非實火而為虛火治此火者方可用二冬二地二胡及元參石斛蓯蓉龜板鱉甲之屬自夫人以此等藥入之陽明熱證中而於陽明實火治法亦因之而廢矣傷寒有實火絶無虛火雜證有虛火亦有實火人惟不知傷寒無虛火又不知雜證之有實火而治之皆失其道耳火者何人之元氣也即少火之氣也無病則少火之能升能降者化為津液病則氣鬱而升降失其常非惟不化津液而且劫奪其津液則少火變為壯火壯火即為實火矣久之而實火之不去者又變為虛火矣此則實火虛火之所由來也若夫虛火實火之外別有一種陰火者則不豫人以易見故即為人所罕言此為龍雷之火不燔草木得雨而熾即陰盛格陽之火亦即陰極似陽之火經曰重陰必陽火之最大者也陰火之為物也見於木華海賦所謂陽冰不冶陰火潛然者今人言海中遇陰晦波如燃火以物擊之迸散如星當即是此火而如洱海水面火高十餘丈吳楊隆演時濬東塘楊林江水中出火可以燃物此皆以水生火並足為陰火之證而於大兵之後野有青燐其為陰火也不更為身經燹火者曾經目擊者乎此則既非實火又非虛火而獨為陰盛之火其於病也雖見種種火象如面赤戴陽除中能食手足躁擾欲入泥水中坐而用藥則惟大辛大熱之劑一劑可以回陽自夫人仍作虛火治或反作實火治而雜證中之陰火獨宜從辛熱法者又因之而廢矣所以然者一誤於實火之始輒作虛火治而曰滋陰降火再誤於虛火之末忽作陰火治而曰引火歸元終誤於陰火之潛然者又不知有北方元武坐鎮水邪迎陽破陰導龍歸海之法三者之火直無一而可矣洞若觀火誰則能之陽為陰遏陰虛陽亢兩病合論示子範余既成實火虛火陰火總論女夫沈子子範讀而問曰昔之善用升柴以散火者莫如東垣善用知柏以降火者莫如丹溪而人皆非之其非之者是歟抑非之者之亦非歟沈子固心識是非者而必欲得餘一言以定是非則余正有不得不言者矣東垣之用升柴及羌獨輩也所以治陽為陰遏之一病也或寒濕久淹陽氣下陷入陰或過食生冷抑遏陽氣於脾土中陽不得舒則治宜升陽東垣之意誠是也而汪訒庵於升陽散火湯存其肌熱表熱骨髓中熱熱如火燎捫之烙手多因血虛得之之柄此則宜降之火豈是宜升之火於是而東垣之升柴非矣丹溪之用知柏及龜版等也所以治陰虛陽亢之一病也或以陰易虧難成故陽常有餘陰常不足或以陰虛生內熱故坎中真陽飛越於上陰之既虛則治宜補陰丹溪之意誠是也而戴九靈為丹溪立傳謂其有雷非伏龍非蟄海不附於地則動之說此則陰盛之火豈是陰虛之火於是而丹溪之知柏非矣血虛生熱原非東垣升陽之治而後人乃以東垣之升柴治血虛則是後人之非非東垣之非也人以訒庵方柄疑必是東垣手訂之書則直非東垣而已陰盛格陽原非丹溪補陰之治而後人乃以丹溪之知柏治陰盛則是後人之非非丹溪之非也人以九靈立傳疑必是丹溪心得之語則直非丹溪而已夫陽為陰遏之病只見有陰不見有陽者也東垣而後無能道之者矣而動稱滋陰降火者反於此竟用陰藥非東垣所及料也陰虛陽亢之病只見有陽不見有陰者也丹溪而後人盡能言之矣而忽稱引火歸元者偏於此欲用陽藥非丹溪所及料也陰陽兩端混淆無別如此病人不能自言也不能自言而尚可安於不知乎若以火勢燎原捫之烙手之說移作丹溪滋陰降火之治則正相合若以龍雷升騰陰霾四合之說認作丹溪滋陰降火之治則正相反此所以陰陽虛實四字必當知有四證而可獨剩陰虛一證乎哉東垣之十書王宇泰吳勉學多取他人書雜於其內本不是東垣原本丹溪之心法楊楚玉王季桓多取他人方附於其間亦未必盡丹溪原本也東垣為易水高弟丹溪得太無真傳自應各有至理今所傳李朱諸書其是耶其非耶余不得而知之矣人於時邪病不分傷寒溫熱瘟疫於雜證不辨虛火實火陰火故時邪無治法雜證亦無治法以所傳古人醫書半為後人妄增妄改末由取法耳紀文達公嘗謂庸妄書賈取盈卷帙往往假託有醫名者之言流傳於後最足誤世即如東垣丹溪之書其可疑者正多得此洗刷庶見廬山真面俾讀李朱書者亦知所抉擇焉彥模謹識
