body:
  text: 卷九文九論王叔和傷寒序例晉皇甫士安甲乙經自序云近代太醫令王叔和撰次仲景選論甚精唐甘伯宗名醫傳曰叔和性致沉靜博通經方精意診處宋成無己嚴器之並謂仲景傷寒論得顯用於世而不墜於地者叔和之力也林億謂仲景去今八百餘年惟叔和能學之叔和一代名醫去古未遠其學當有所受前人之言叔和者如此則其序例一篇自晉迄宋絶無異議可知乃首發難者為方中行則削而去之矣竊方説為己説者為喻嘉言又存而駁之矣兼襲方喻兩家而視叔和如江湖賣藥之流者為程郊倩則甚至戟手謾罵矣序例之存亡大有關於傷寒論之興替諸家未見原文以為傷寒論壞自叔和直謂黃岐一派至叔和而斬絶何叔和之為千古罪人直如此其大乎徐靈胎曾為之説曰不有叔和焉有此書亦思諸家所集果是仲景原本否耶論極和平而尚不知三家之意所以擠排叔和者實欲抹煞仲景且欲抹煞仲景撰用素問熱病之義夫人病之初每由於寒及其既病勢必成熱仲景傷寒論所以自有熱病而內經熱病論所以首言傷寒既不知仲景之傷寒即內經之熱病故轉以叔和之引來作證者為非又不知仲景之有日數部歷引內經熱病論中語故轉將本知此理之叔和竭力而詆譭之即以叔和之不知有寒襯出仲景之不知有熱謂自晉以後之談醫者皆偽統遂謂叔和之序例為偽例夫例則例矣何偽之有不過欲自以為道統耳私心一起變幻無窮人人甘心於叔和勢必無禮於仲景直若盲左所述盜憎主人者噫異哉三家中喻之才最大其筆最利其私心亦最重所恐讀書未遍之人以三家之言為先入之見遂若叔和真有應削應駁應受罵者不有人焉起而正之叔和不幾為三家所滅耶三家翕翕訾訾本無足責可笑者以黃坤載之自命為大醫既不識傷寒論本兼熱病又不思熱病論本説傷寒於其自著溫病名義特將內經凡病傷寒而成溫者一句暗暗抽去以滅其迹莫謂後之覽者無一明眼人也夫叔和之於傷寒尤二徐之於説文大徐新附小徐系傳亦多有被人指摘者然説文為李陽冰所亂賴二徐修治以傳而必曰二徐為洨長之罪人許學至二徐而斬絶試問治説文者其能首肯也夫論叔和序例及平脈法辨脈法千金翼卷第九第十既為傷寒論最前之本外臺祕要第一卷又引諸論傷寒者八家自陰陽大論起至此則時行之氣也止為仲景原文林億等注謂巢氏病源陳延之小品孫思邈千金方並同以下接王叔和曰逐日淺深以施方治迄於發表以桂枝溫里以四逆一段則叔和之言也此外又遞引華元化輩六家之論合之仲景叔和為首尾八家然則陰陽大論至王叔和曰以上辨明時行非時行者不即是仲景之論而何不即是叔和所採仲景舊論而何三家者目為叔和偽例以為儘可痛詆卻不料其出於仲景者尚有病源小品千金皆可取證外臺又引仲景日數並方二十一首林億先於卷首桂枝湯下注曰出仲景日數部桂枝五味者是於承氣湯下注曰出仲景日數部大黃三味者是則此日數部所引素問熱病篇中語亦出自仲景而非叔和偽例更無可疑乃三家未見兩書或且佯為不見而削之而駁之而痛罵之尚非削仲景駁仲景罵仲景乎且不得謂其陽尊仲景矣余不為仲景匯萃群書而一正之誰復能知序例中言本多仲景之言哉而事更有奇焉者仲景傷寒論自序云並平脈辨證為傷寒雜病論合十六卷蓋謂平其脈辨其證以成此十六卷之論非於論外別有平脈辨證兩篇故千金外臺亦無此兩篇也叔和則於序例之外更有平脈法辨脈法之作絶不類仲景語此則並諸可與不可篇皆叔和所重集為叔和所自言喻氏欲取叔和辨脈法中清邪濁邪數語為瘟疫發端而又礙於此言之出自叔和即其深惡痛絶之人乃作為仲景本有平辨二篇先從他處微微透露以便下筆時全無干格一若仲景於傷寒論外真有平脈法又有辨脈法者豈知仲景自序明言辨證本不是辨脈乎彼於序例則以仲景之言派作叔和於此則又以叔和之言指為仲景逞心而道旁若無人豈有並千金外臺尚未之見而可謾罵古聖賢若此其甚者乎嗟乎千金外臺非僻書也欲論仲景者應請先購此兩書讀之論叔和諸可與不可篇千金外臺或竟為三家所未見或見之而佯為不見皆未可知至於叔和諸可與不可篇則嘉言見之郊倩亦見之矣乃郊倩於叔和自道其重集者明明見之而偏要説是仲景語謂仲景所以將汗吐下法分隸於春夏秋三時而獨不言冬者明乎傷寒非止冬令之病傷寒論非止為冬令傷寒設夫其不止為冬令傷寒設者謂其並春之溫夏之熱而皆在論中也叔和特於此下春夏秋三時數語叔和之工於發明仲景者何如余獨怪郊倩之於叔和固詆譭之不遺餘力恨不墜諸淵而又下石焉者而特於此抉出精義乃反為叔和表章亦若不遺餘力如此不轉幸其偏説是仲景之言而叔和之不可磨滅者乃因此而益顯乎叔和而有知也當亦啞然笑矣論劉河間治溫全用仲景傷寒方世謂仲景但知有傷寒至守真始知有溫病故疑仲景但用辛溫守真始用苦寒治傷寒則用仲景之桂麻治溫病則用守真之膏黃一若仲景方但有桂麻而膏黃則始於守真者其言悖甚然亦有所本也王安道溯洄集傷寒者表有寒邪非辛溫不足以散之此仲景桂枝麻黃湯之所以必用也溫病熱病無寒在表非辛涼苦寒或酸苦之物不足以解之此仲景桂枝麻黃湯所以不可用而後人所制防風通聖散之類所以可用也異哉安道其謂治寒用辛甘溫治溫用辛涼苦寒酸苦者下藥絶不少混其説自可為經然於辛甘溫則曰仲景而於辛寒酸苦則不曰仲景必曰後人是豈仲景之葛根非辛涼乎仲景之芩也連也膏黃芍藥也非寒涼酸苦乎此真余所謂但見論中有桂麻薑附不見論中有芩連膏黃者不意其即始於安道也夫其所指為後人而有防風通聖方者非守真乎後人中惟守真為能用仲景法所以守真之升麻葛根湯即仲景之葛根也三已效方即仲景之石膏也三一承氣即仲景之大黃也天水涼膈即仲景之瀉心豬苓也若人參石膏一方更與仲景人參白虎異名同法惟其欲明溫熱所以暢論傷寒不然者河間六書世皆知其舍寒而論溫矣而何以論溫之書莫不稱傷寒直格傷寒醫鑑傷寒標本書中論溫亦莫不曰傷寒煩躁傷寒發狂傷寒表裡俱熱而凡所以治溫之方皆從傷寒論脫化來耶後人但説仲景有桂麻法其能知仲景有膏黃法者獨一守真耳異哉安道胡絶不見守真所用無一非傷寒方耶種種迷罔總由誤會傷寒二字而起而前人之本知溫熱是傷寒者又不能逆料後人之不解而預防之所以於前人之論傷寒不知其亦兼論溫於前人之論溫又不知其本稱傷寒無怪其看得傷寒論中絶無一治溫之方矣至守真醫鑑一册借刻於馬元素者則因朱奉議活人書將寒熱二字釋作三陽是熱三陰是寒謂病一到三陰皆為寒證故特申仲景用寒之法以闢翼中用溫之非蓋守真固知仲景之能用溫亦能用寒也而豈與仲景有異同哉謂余不信盍取河間書一讀之臨證指南暑病門楊姓案云仲景傷寒先分六經河間溫熱須究三焦夫河間治法亦惟六經是言而三焦兩字始終不見於六書初不解指南之何以有是語久之而悟指南於西昌之論瘟認作河間之論溫約略記得河間之書人皆説是異於仲景者故即不妨托之河間耳觀此先分須究等字亦全不成句法乃因託名大醫人盡耳食遂開吳鞠通上焦之弊置六經於不問不知傷寒論六經提綱本不獨為傷寒設廢傷寒論則六經失傳廢六經則百病失傳莫謂指南所言無關大局也論喻嘉言溫證三篇喻氏醫門法律頗為後學可讀之書即疫論亦稱高絶蓋以此一篇固是論瘟不是論溫也至其尚論後篇之論溫欲以所定之三例敵仲景之六經此則純乎私心不可為訓嘉言以仲景為詳於治寒略於治溫而又誤解內經冬不藏精春必病溫藏於精者春不病溫兩言以謂寒病傷人者少溫病傷人者多適因治愈金鑑一病載之寓意草中此一病也即其據以作溫證中篇為一大例者而不自知其錯中錯也原其致錯之由乃以不識內經精字統指人身津液而言輒認作男女交媾陽施陰受之精如康成之解亦既覯止遂謂腎精不藏由於勞腎生風即內經勞風之證定屬少陰然後以仲景書中太陽病發熱而渴不惡寒者為溫病若發汗已身灼熱者名曰風溫風溫為病脈陰陽俱浮自汗出身重多眠睡鼻息必鼾語言難出五十一字先截去太陽至溫病十四字而下句若發汗之若字則聯屬上文者也乃並此若字去之但引發汗下至語言難出三十六字以便減去三陽痕迹將自汗各證一齊牽入少陰絶不自顧其所引少陰病無非脈沉脈緊脈微欲絶厥逆無脈又脈陰陽俱緊句句與三陽證之陰陽俱浮者相反且不顧陰病無發熱陰不得有汗兩層又不顧仲景尚有三陽合病兩條與此條諸證互相發明乃獨於金鑑案中祕不言脈以為掩著之計無如藏頭則露尾顧此則失彼金鑑之病而果愈於麻辛則其脈必沉必見微細必不陰陽俱浮自是少陰之傷寒本無涉於陽明之溫熱而徒割裂補綴煞費心機演成溫證三篇欲人於春夏秋之溫病盡用麻辛附之溫藥先從別處説仲景治溫凡用表藥皆用桂枝夫曰凡用曰皆用則仲景之於溫病必用桂枝而且用不一用矣不過欲便私圖直可指鹿為馬居心之險詐未有甚於此人者謂為誤解內經尚是曲恕之辭耳試觀千金方溫風之證脈陰陽俱浮汗出體重其息必喘其形狀不仁默默但欲寐一段千金之所謂溫風非即仲景此條之風溫乎千金用石膏三兩設使嘉言見之亦必曰一一皆顯少陰經證而不用石膏且用薑附矣再觀千金所載腑臟溫病共有六方皆用石膏則雖腎臟有溫亦以石膏為治蓋以溫病之少陰固從火化為熱非從水化為寒也陳延之小品亦以葳蕤湯之石膏治冬溫是皆可取以證嘉言溫病用溫藥之謬而溫病之必用石膏者亦可信矣論嘉言溫病屬少陰之誤六經之治有標本中氣之分以其病之或生於本或生於標或生於中氣也然惟陽明厥陰有生於中氣之病故有必從中氣之治若少陽太陰則從本治而不從乎中少陰太陽則或從本治或從標治而亦不從乎中少陰固為太陽之中氣若病在太陽則非中氣為病安得謂太陽病當治少陰乎至於傷寒之病而傳為溫則病之陽盛為之也太陽經在皮毛感冒風寒皮毛閉塞榮衛之氣鬱不得宣甚則內傳胸膈氣聚於胃故太陽病不傳則已傳則必在陽明況溫病不必盡始於太陽且有一起即在陽明者而惟喻氏獨不肯一言陽明喻謂渴不惡寒之溫病其脈陰陽俱浮其身重而多眠睡其鼻息鼾而語言難出一一皆顯少陰經證吾試以傷寒論陽明經證亦一一顯言之如陽明病不惡寒其體必重一也陽明病不惡寒偏惡熱其身體重二也陽明病鼻乾不得汗其人嗜臥三也陽明病汗出多而渴四也陽明病渴飲水漿五也陽明病其人復不惡寒而渴者六也陽明中風脈浮大嗜臥七也陽明病脈浮而緊咽燥口苦腹滿而喘發熱汗出不惡寒反惡熱身重八也再有三陽合病腹滿身重難以轉側口不仁而面垢九也三陽合病脈浮大上關上目合則汗十也三陽合病脈洪大但欲眠睡十一也三陽合病渴欲飲水口乾舌燥者十二也凡傷寒論所載陽明病一一可與此條互證者如此而所謂鼻乾者非即鼻息之必鼾乎所謂口不仁者非即語言之難出乎嘉言既藉此一條以為據則此一條即不得不與之辨其所言一一皆顯少陰經證者處處聱牙余所言一一皆顯陽明經證者句句吻合惜嘉言當日無援成注陽明也三字與之辨論者如其口燥咽乾果為腎水枯竭之象即非少陰本氣君火之病亦是少陰溜府可從下法之病豈即宜用薑附之少陰哉稍緩須臾甕乾杯罄即嘉言所自言梔子豉湯身重四端皆陽明見證亦嘉言所自言矛盾若此抑獨何耶論嘉言誤解內經精字金匱真言論曰夫精者身之本也故藏於精者春不病溫所謂精者指一身津液由於水穀所化水穀之精氣和調於五臟灑陳於六腑為後天生身之本其下遂以精與汗互言之吾試以經解經此即經言食氣入胃散精於肝淫精於脈輸精於皮毛之數精字也亦即經言飲入於胃遊溢精氣上輸於脾脾氣散精上歸於肺水精四布五經並行之數精字也又岐伯論溫病曰人所以汗出者汗生於穀穀生於精邪氣之得汗者邪卻而精勝也又曰汗者精氣也則精即是汗何有異説如嘉言者亦可謂善讀內經者矣何至內經一精字尚不了了味其所言舉此三例以論溫然後與仲景三陽三陰先後同符是其意實欲以三例者與仲景六經為域中兩大既作創論安排內經復以傷寒論渴不惡寒之溫病謂仲景言冬傷於寒之溫以發汗已身灼熱之風溫謂仲景言冬不藏精之溫仲景何嘗有此意乃以一節劈成兩橛請來作如意珠遂將發自陽明一用涼解清泄無不立愈之病肆用反面之薑附桂枝適以助後人夾陰傷寒之説而寒涼泄降之藥概從擯棄吾不能不歸咎於始作俑者之嘉言也論程郊倩生地麥冬為骨蒸勞熱源頭嘉言治溫用薑附之溫熱人尚有能知其非者郊倩治溫用麥地之清滋則言巧似是人更無能發其覆矣郊倩所有條辨卷首數十頁純學金聖嘆既為醫中魔道而其足以害人者尤在第四卷論溫數頁中夫用溫藥以治溫者其弊顯用滋藥以治溫者其弊隱自古隱害之中人更甚於顯然之為害郊倩切切教人以麥地治溫且以活人甚多為證而下文便接此即骨蒸勞熱等病之源頭然則問其於麥地之後作何治驗則皆為骨蒸矣皆為勞熱矣病而既為骨蒸為勞熱則當其骨蒸勞熱時卻未死也未死而不可謂之活乎及其久而仍死則曰是乃死於骨蒸也死於勞熱也若前此之溫病則我早以麥地活之於是直可以一言斷之曰余以此活人多矣此為郊倩所自言為郊倩自己所告人者非我逆料其用麥地後必變骨蒸勞熱等病也以後如溫證論治之望其轉瘧竟得不死則尤為活之明證而遠勝於骨蒸勞熱之必死者矣嘉言之以溫治溫死於旬日郊倩之以滋治溫死於年餘皆可預言其必然以誇眼力余在裡門時多有以十成勞病就余問藥者每述其前一年曾作溫病幸而獲愈而問其今病之始則固在前病之末若告以今病之種種不堪即由前病之種種耽誤則必堅稱其前年之溫確為麥地所愈特不解何故久不復原而又為此諸病耳至有以瘧久不止已成瘧母來求治者其言亦然甚矣病者之愚醫者之幸也黃坤載亦用麥地而或加膏黃於內以其本是膏黃之病當即有愈於膏黃者若吳鞠通之增液清宮則液且立見其涸宮亦萬不得清無怪其吸爍真陰肌膚甲錯亦同於郊倩之骨蒸勞熱可預定於清宮增液時而所言之皆驗也論李士材醫宗必讀以諸血證盡入虛勞門陰與陽為對待血與氣為對待誰不云然不知血也者陰氣之所化也人身之陰陽皆以氣言陰根於陽者謂陰氣根於陽氣也血生於氣者謂陰血生於陰氣也補氣之陽惟附子足以當之若人參黃耆則皆補氣之陰試觀人參養營湯用人參而以養營為名當歸補血湯欲補血而以黃耆為主其義不從可知乎故張路玉曰四物為陰血受病之方非調補真陰之治柯韻伯曰四物乃肝經調血之劑非心經生血之方明乎此而所以治血之虛者安得不注意於陰氣乎更有一等大吐大崩去血過多則血脫者必益氣並不僅在陰氣而在陽氣矣此則非參附大劑壯陽固陰以收效於頃刻萬無他法可施本不徒恃參耆也若夫暴來暴下之忽見血者且有畜血之為血證而不見血者則非血之虛而為血之病病則似與四物無不宜矣然四物並用則動者嫌動滯者嫌滯此又當知行氣開鬱除濕潤燥瀉火撤熱之皆所以治血而去瘀以生其新瘀去而新乃生者尤為補血之大也乃醫宗必讀先論虛勞一大篇首列傳尸勞一證而即繼以吐血咯血咳嗽血三種世之樂得其捷徑者一見有血便歸入虛勞門中將行氣開鬱除濕潤燥瀉火撤熱逐瘀生新等法謂皆不宜於虛勞而盡付諸一勾此所以血證之淺深次第竟無下手處也凡人以吐咯見紅及咳嗽之或已見紅或未見紅者欲其不入怯途若不先明士材之失其將何以為治余哀夫世之為士材所愚也有不忍默爾而息者余於醫宗必讀治血之失言之有素矣近得古今圖書集成於藝術典醫部匯考一門遍讀之中有載李中梓語一條云豫於諸血證之始率以桃仁大黃行血破瘀之劑折其鋭氣而後區別治之雖獲中病然猶不得其所以然也後遇四明故人蘇伊舉論諸家之術伊舉曰吾鄉有善醫者每治失血畜妄必先以快藥下之或問失血復下虛何以當則曰血既妄行迷失故道若不去蓄利瘀則以妄為常曷以御之且去者自去生者自生何虛之有豫聞之愕然曰名言也昔者之疑今釋然矣觀此一條則似乎士材平日本非盡以血證為虛勞故伊舉之言亦為其所信服而醫宗必讀何以盡入諸虛勞門中也向疑士材身享大名本不應一誤至此意者醫宗必讀亦非出自士材之手乎血之為病最多其治法亦甚不一今得此論竊為病血者幸特其言必先用快藥下之則獨宜於畜血而他血證未必盡然姑録於此以見必讀一書亦未必定出於士材也論秦皇士傷寒大白夙聞松江秦皇士有傷寒大白一書以謂傷寒論之難白者得此可以盡白而惜無由求白於皇士也取而讀之乃知其意蓋謂仲景所用桂麻乃治河北長沙北方冬月之病江浙東南為南離巳午地患此絶少故以春夏秋冬分隸南北謂清裡同而發表異教人以桂麻二方只可施諸北方冬月不治春夏秋三時南方之病篇中不厭重復一則曰冬月北方再則曰北方冬月一則曰三時南方再則曰南方三時夫桂麻二方誠有不宜於三時者即北方亦何嘗不然若南方而感風寒未成溫熱即三時亦未必定無桂麻證而其一再言之直若北方獨有冬月南方只有三時何其悖也況既鑿分南北則其於南北方位當必有釐然不爽者乃問其所謂北方者何則長沙也長沙即今湖南長沙府以方輿計之正與江浙毗連處東西相望且略迤南乃以湖南改作河北則似長沙不在洞庭之南而在大河之北矣問其所指為南方者何則江浙也江浙之地但可曰東不可曰南乃以震巽之間直移諸南離巳午則似江浙不在大江之左而在嶺表之南矣不特此也仲景南陽人長沙乃其所歷之官當其守長沙也宗族五六十人未必皆死於長沙則論仲景者自當就南陽言之南陽即今河南南陽府南陽縣於漢時為涅陽以方輿計之亦與江南寶應一帶東西相望況其所據以為北方者且不在南陽而為長沙乎凡論地理當就天下之中以定南北而分東西長沙江浙就天下之大論之實亦相去不遠非真南北迢迢東西亙亙有萬里之隔也而人之於病病之於藥亦何至有於此者必不有於彼宜於彼者必不宜於此哉乃將千古以來一定不易之地輿信手改南作北指東為南而江浙之地遂自此無桂麻證大凡人謂仲景方不可用每為病家所樂從於是南人無傷寒之説遂盛行於江浙間今乃知始作俑者即不識南北不辨東西之秦皇士而傷寒論於是乎大不白於天下矣
