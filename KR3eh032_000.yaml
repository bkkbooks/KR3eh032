body:
  text: 世補齋醫書自序世補齋醫書江左下工為醫學辨誤作也下工之從事刀圭者三十年於茲矣知一病有一病當用之藥即有一病不當用之藥用所當用不過不誤而已若用所不當用則豈僅誤焉已哉凡人有病但能不誤於前則後此之漸即於危者本皆可以不作反是則一誤再誤變幻無極不旬日間馴至於不可救而能知病之本不若是者其誰也即如風寒溫熱等治所昭揭於仲景書中者非皆今病所當用之藥乎乃一不用當用藥而身熱不退矣然猶未至於斑疹也再不用當用藥而斑疹不達矣然猶未至於昏譫也再不用當用藥而昏沉而譫妄而狂而厥無不計日可待而後此則不可問矣當夫表熱初起裡熱漸壯一路由輕而重由重而危藥與病反病隨藥變者無他用所不當用之藥正如救人之飢解衣衣之而飢者不生救人之寒推食食之而寒者仍死明明有當用藥在人人可賴以生者乃必用此不當用之藥而預決其死及其既死於不當用之藥而必仍用此藥以治他人一若舍此別無可用之藥也者此固何為者耶下工治之於其表熱初萌有當用藥而斑疹可不作也於其斑疹已釀有當用藥而昏譫可不作也於其神昏譫妄有當用藥而後此之入陽則狂入陰則厥者尚可以不作也此無他用所當用之藥亦惟知其飢也而推食食之知其寒也而解衣衣之有此病即有此藥亦非此藥不去此病既針芥之相投自毫釐之不爽其輕者可安常而處順其重者亦轉危而為安夫是之謂藥與病投病與藥值苟能是是亦足矣此外如瘧之寒熱往來痢之裡急後重咳逆痰飲之本非怯證而勢必成怯吐血失精之本非勞病而勢必成勞又若因壅而喘一補立危因滯之脹非攻必殆以及婦科胎産兩門兒科驚疳兩證病病有必當用之藥即病病有必不當用之藥略舉數端以概其餘無非誤不誤兩途而已嗟乎父母之為子也子之為父母也兄若弟之各相為也夫之為婦婦之為夫也床有病人急而求藥病家之屬望於醫者何如此王權和所以録對病真方而防世急也夫補後漢書張機傳論書後自媧皇摶土氤氳之化啓神農嘗藥理瀹之功彰然五行遞乘六沴並伏阿衡之湯液失傳岐伯之問難尚晦祕典弗闡師承末由周秦以來不絶如線仲景胚胎玉函囊括緑帙以上手之神為醫中之聖法乳所溉瓣香至今實不廢之江河代明之日月顧當漢之世前有倉公詳甄於遷史後有元化並録於範陳而聖如仲景獨從蓋闕者何哉龍門好奇每事誇飾方技一流尤矜神異史家因之競相附會咽塞則吐蛇腳痛則剖蛤舐藥之犬戾天而飛生疽之龍穿井而報言之色喜聞者忘倦仲景索隱鉤沉課虛責實文簡而義奧旨縟而理稠不啻金石之陸離堂室之杳窱蔚宗丁宋之禪去漢已遠雖無承祚斛米之私不免孟堅目睫之論爰有漏略亦固其所獨念吾家祭酒駁辨異義功在群經受詔掖門顯於身後足以比肩高密抗衡侍中而儒林傳所載寥寥數語僅免遺佚仲景利濟生民師表後學三百九十有七法闡軒帝之微正如九千三百五十文發倉史之祕並資津逮獨致淪蕪掩卷思之不能無憾此姚之駰所以補逸李濂醫史亟亟焉有補傳之作也然濂之為書但求賅備靡有訂正不足示嚮往之專糾時俗之繆九芝先生學必稽古志在活人痛抱薪救火之非探先河後海之本既據傷寒論反復申辨爰綱羅散佚條舉件系為補傳一篇後附論斷即集範書斷句連綴成文述而不作博且益精稚川之論名醫本於良史貞白之撰別録有功本草方之古人殆不多讓由是以思譭譽聽之他人論撰俟之異日燼簡猶在如接先型碎金可融不啻完璧自有此傳背道者息喙索途者知歸昔人謂孟子承三聖功不在禹下先生之於醫學亦曷可少哉古人往矣來者代興其有守真抱朴鍛歲煉年抗希於作者之林貶抑於傖夫之手者夫亦可不恨矣光緒癸未仲夏同郡許玉瑑謹識跋昔者鄧禹有子十三人令各執一藝此治家良法也慈聞之庭訓如此故諸昆季於儒業外凡雜家者流皆以餘力及之而慈獨學軒岐術性所近也舊藏有黃坤載葉天士諸家書大略觀之以為道在是矣家君曰不得良師恐有歧誤遂命從遊於吾師之門師不以其愚而棄之首示以青龍白虎兩大法而凡傷寒與溫熱異同之旨亦因之而有悟慈始愧向之徒為墨守也家君適於壬午夏病熱喜立日中且惡涼飲脈則皆伏群醫咸謂為三陰證慈未之敢信也質於師師驚曰此溫熱之大證陽極似陰者也誤用辛熱必殆乃迭進芩連膏黃輩十餘劑而熱象大顯石膏用至斤許病乃漸退竊思此疾當畏寒脈伏時誰則知其為大熱者若非家君早令習醫受吾師至教鮮克濟矣今吾師世補齋書成讀之而知向所服膺者不得其門適所以滋害也書中如六氣之司天五種之傷寒三法之溫清尤發前人所未發實有益於來學有志斯道者先將此數處反復細讀再觀諸論庶於陰陽寒熱表裡虛實皆無所淆方得如桶底脫否則震於黃葉之名者安能悉吾師補救之心也子輿氏有言不直則道不見有以夫有以夫書凡十六卷計垂十二萬言時家君方以比部郎出守南陽命慈任剞劂之事亦亟欲得此書行世俾讀者於此咸知以仲景為歸也慈不才不能於師道有所發明而重違提命謹述大旨以附篇末並敢述所聞於庭訓者還以質之吾師光緒九年癸未季冬之月受業濮賢慈謹跋
