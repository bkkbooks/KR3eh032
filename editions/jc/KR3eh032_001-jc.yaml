body:
  text: 卷一文一史家之贊孫思邈曰夫人之身出必有處處非得已貴為世補余少問學鮮經濟無補於世退而求思邈之術若有得焉因取以名吾齋而即以名吾書補後漢書張機傳張機字仲景南郡涅陽人也靈帝時舉孝廉在家仁孝以廉能稱建安中官至長沙太守在郡亦有治跡博通群書潛樂道術學醫於同郡張伯祖盡得其傳總角時同郡何永稱之許為良醫果精經方有寒食散論解寒食散寒食藥者世莫知焉或言華佗或曰仲景考之於實佗之精微方類單省而仲景有侯氏黑散紫石英方皆數種相出入節度略同然則寒食草石二方出自仲景非佗也且佗之為治或刳斷腸胃滌洗五臟不純任方也仲景雖精不及於佗至於審方物之候論草木之宜亦妙絕眾醫昔神農嘗草而作本經為開天明道之聖人仲景元化起而述之故仲景黃素元化綠帙並有名稱而仲景論廣伊尹湯液為數十卷用之多驗既至京師為名醫於當時稱上手見侍中王仲宣時年二十餘曰君有病四十當眉落半年而死令服五石湯可免仲宣嫌其言忤受湯勿服居三日見仲宣謂曰服湯否仲宣曰已服仲景曰色候固非服湯之診何輕命也仲宣猶不信後二十年果眉落一百八十七日而死終如其言美哉乎仲景之能候色驗眉也居嘗慷慨嘆曰凡欲和湯合藥針灸之法宜應精思必通十二經脈知三百六十孔穴榮衛氣行知病所在宜治之法不可不通古者上醫相色色脈與形不得相失黑乘赤者死赤乘青者生中醫聽聲聲合五音火聞水聲煩悶干驚木聞金聲恐畏相刑脾者土也生育萬物回動四傍太過則四肢不舉不及則九竅不通六識閉寒猶如醉人四季運轉終而復始下醫診脈知病原由流轉移動四時逆順相害相生審知臟腑之微此乃為妙也又曰欲療諸病當先以湯盪滌五臟六腑開通諸脈治道陰陽破散邪氣潤澤枯朽悅人皮膚益人氣血水能淨萬物故用湯也若四肢病久風冷發動次當用散散能逐邪風氣濕痹表裡移走居無常處者散當平之次當用丸丸藥者能逐風冷破積聚消諸堅癖進飲食調和榮衛能參合而行之者可為上工故曰醫者意也又曰不須汗而強汗之者出其津液枯竭而死須汗而不與汗之者使諸毛孔閉塞令人悶絕而死不須下而強下之者令人開腸洞泄不禁而死須下而不與下之者令人心內懊憹脹滿煩亂浮腫而死不須灸而強與灸之者令人火邪入腹干錯五臟重加其煩而死須灸而不與灸之者令人冷結重凝久而深固氣上衝心無地消散病篤而死以宗族二百餘口死者三之二傷寒居其七乃引陰陽大論云春氣溫和夏氣暑熱秋氣清涼冬氣凜冽此則四時正氣之序也冬時嚴寒萬類深藏君子固密則不傷於寒觸冒之者乃名傷寒耳其傷於四時之氣者皆能為病以傷寒為毒者以其最成殺厲之氣也中而即病者名曰傷寒不即病者寒毒藏於肌膚至春變為溫病至夏變為暑病暑病者熱極重於溫也是以辛苦之人春夏多溫熱病皆由冬時觸冒寒冷所致非時行之氣也凡時行者春時應暖而反大寒夏時應熱而反大涼秋時應涼而反大熱冬時應寒而反大溫此非其時而有其氣是以一歲之中長幼之病多相似者此則時行之氣也又引素問黃帝曰夫熱病者皆傷寒之類及人之傷於寒也則為病熱五百餘言為傷寒日數部著論二十二篇證外合三百九十七法一百一十三方自序之其辭曰余每覽越人入虢之診望齊侯之色未嘗不慨然嘆其才秀也當今居世之士曾不留神醫藥精究方術上以療君親之疾下以救貧賤之厄中以保身長全以養其生而但競逐榮勢企踵權豪孜孜汲汲惟名利是務崇飾其末而忽棄其本欲華其外而悴其內皮之不存毛將安附進不能愛人知物退不能愛躬知己卒然遇邪風之氣嬰非常之疾患及禍至而後震慄身居危地濛濛昧昧戇若遊魂降志屈節欽望巫祝告窮歸天束手受敗齎百年之壽命將至寶之重器委付庸醫恣其所措咄嗟喑嗚厥身已斃神明消滅變為異物幽潛重泉徒為涕泣舉世昏迷莫能覺悟自育若是夫何榮世之有哉哀乎趨世之士馳競浮華不固根本忘軀殉物危若冰谷至於是也余宗族素多向餘二百建安紀元以來猶未十稔其死亡者三分有二傷寒居其七感往昔之淪喪傷橫夭之莫救乃勤求古訓博採眾方撰用素問九卷八十一難陰陽大論胎臚藥錄並平脈辨證為傷寒雜病論合十六卷雖未能盡愈諸病庶可以見病知源若能尋余所集思過半矣夫天布五行以植萬類人秉五常以為五臟經絡府輸陰陽會通元冥幽微變化難極易曰非天下之至賾其孰能與於此自非才高識妙豈能探其理致哉上古有神農黃帝岐伯伯高雷公少俞少師仲文中世有長桑扁鵲公乘陽慶及倉公下此以來未之聞也觀今之世不念思求經旨以演其所知各承家技始終循舊省疾問病務求口給相對斯須便處湯藥按寸不及尺握手不及足人迎趺陽三部不參動數發息不滿五十短期末知決候九部曾無彷彿明堂闕庭盡不見察所謂窺管而已夫欲視死別生固亦難矣此皆醫之深戒病者可不謹以察之而自防慮也孔子云生而知之者上學則亞之多聞博識知之次也余宿尚方術請事斯語其文辭簡古奧雅凡治傷寒未有能出其右者其書推本素問之旨為諸方之祖華佗讀而善之曰此真活人書也靈獻之間俗儒末學醒醉不分而稽論當世疑誤視聽名賢濬哲多所防禦至於仲景特有神功鄉里有憂患者疾之易而愈之速雖扁鵲倉公無以加之時人為之語曰醫中聖人張仲景江南諸師秘仲景要方不傳所傳於世者傷寒雜病論十卷或稱方十五卷或又稱黃素藥方二十五卷辨傷寒十卷評病要方一卷療婦人方二卷五臟論一卷口齒論一卷弟子衛汛有才識論曰凡言成事者以功著易顯謀幾初者以理晦難昭漢自中世以下太官大醫異端紛紜泥滯舊方互相詭駁張機取諸理化以別草木之性高志確然獨拔群俗言之者雖誠而聞者未譬其為雷同者所排固其宜也豈幾慮自有明惑將期數使之然歟夫利不在身以之謀事則智慮不私己以之斷義必厲誠能釋利以循道使生以理全死與義合也不亦君子之致為乎孔子曰危而不持顛而不扶則將焉用彼相矣左邱明有曰仁人之言其利博哉此蓋道術所以有補於世後人皆當取鑑者也機撰著篇籍辭甚典美文多故不載原其大略蠲去復重亦足以信意而感物矣傳稱盛德必百世祀語云活千人者子孫必封信哉贊曰途分流別專門並興千載不作淵源誰徵傳凡引伸處承接處多摭後漢書列傳中語以相聯屬篇首仿左雄傳冠南郡於涅陽之上以漢之涅陽縣屬南陽郡隋開皇初改為淉陽唐武德初屬鄧州貞觀元年省入穰縣金末始置鎮平縣屬申州元屬南陽府明洪武二年省入南陽縣國朝因之仲景生於涅陽傷寒論序尾自署南陽者書郡不書縣也縣則前明始以南陽稱在漢則當稱涅陽故河南通志書張機涅陽人補傳引用諸書目附記於後晉王叔和傷寒論序例皇甫謐甲乙經自序梁陶宏景別錄自序隋巢氏諸病源候論唐孫思邈千金方王燾外臺秘要甘伯宗名醫錄宋林億新校注千金方疏林億等外臺秘要注唐慎微證類本草李濂醫史太平御覽王氏玉海鄭樵通志馬端臨文獻通考陳振孫書錄解題四庫全書目錄河南通志傷寒論自序云撰用素問九卷八十一難陰陽大論胎臚藥錄並平脈辨證為傷寒雜病論合十六卷蓋謂撰用諸經後並平其脈辨其證以成此十六卷之論平字下是脈字辨字下則是證字而非脈字言下了然並非別有平脈辨脈篇也今所傳傷寒論有平脈法辨脈法二篇及諸可與不可等篇皆出叔和之手王安道言之頗詳跡其文筆絕類王氏脈經可斷其不是仲景語王安道於仲景三百九十七法左算不合右算不合勉強湊集終無確數不若陳修圓除去叔和平脈辨脈諸可與不可等篇依成無己註釋篇次適得三百九十七節謂此即三百九十七法一節便是一法以比安道轉覺其直截了當吳興莫枚叔研經言傷寒雜病論十六卷後人改題曰金匱玉函王燾外臺秘要引之概稱傷寒論唐慎微證類本草引之概稱金匱玉函方一從其朔一從其後也當時以十六卷文繁而有刪本二其一就原書刪存要略併為三卷題曰金匱玉函要略方後為宋仁宗時王洙所得其一就原書存脈法及六經治法又諸可不可等十卷題曰傷寒論而削雜病二字即今本傷寒論也此書行而十六卷之原書不可得見矣林億等又以所存三捲去其上卷而分中下二卷為三卷以合原數改題曰金匱方論即今本金匱要略也此書行而並刪存之三卷亦不可復合矣籲唐宋間人於仲景書任意分並一再改題而其去古也愈遠矣馬貴輿文獻通考引灶氏云仲景著傷寒論有大人之病而無嬰兒之患有北方之藥而無南方之治蓋陳蔡以南不可用柴胡白虎二湯以治傷寒謂其言極有理此以灶與馬氏皆不明醫事而妄言之故不問南陽及長沙之地與陳蔡相去幾何而如近人秦皇士傷寒大白又踵其失且移長沙於大河之北因此而謂仲景之方宜於北方冬月不治春夏秋三時南方之病遂以堅後人江浙無傷寒南方無真中風等謬而傷寒論因之益廢可懼也江篁南名醫類案載方勺泊宅編汪訒庵醫方集解載趙養葵醫貫並云仲景為漢武帝治消渴則相去且三百餘年此數人者皆不一問建安為何人年號而仲景之地仲景之時並皆迷離惝恍豈不因史家失傳之故耶或曰葛洪有言仲景開胸而納赤餅謂其為人治病有開胸納丸之異此不類仲景所為或以華元化有滌臟縫腸事而仲景與之齊名遂附會其說歟抱朴子一書率多寓言即其說果出稚川亦未可援以為據也張介賓以方壺八法改作八陣及自作本草並引仲景語如無升麻以犀角代之此實朱肱之言也肱以己所著名活人書亦曰南陽書肱意本欲以此貌似仲景而介賓果認作仲景語耳況華佗安息香丸見於中藏經者乃為犀角入藥之始仲景初未嘗取用犀角安得有是語耶方中行作條辨謂張松北見曹操以川中醫有仲景為誇仲景入蜀事無可據明是稗官家言周禹載傷寒論三注自序中有云仲景未舉孝廉時相者云觀君思致殆曠世之良醫也禹載不言所自他書亦無可考喻嘉言醫門法律謂仲景推演傷寒中寒二論不知中寒論何以不傳至晉初即無可搜求按仲景書見於隋書經籍志者尚多嘉言欲詆叔和妄為此說以見晉人之淺於談醫仲景何嘗別有中寒論耶嘉言尚論篇又謂仲景治溫凡用表藥皆用桂枝吳鞠通溫病條辨因之且謂渴不惡寒之溫病以桂枝湯主之為仲景原文其妄更甚楊慄山傷寒瘟疫條辨載仲景傷寒論曰病家汗家診其尺脈澀先與黃耆建中湯補之然後汗之今傷寒論原文具在安有是言姚首源作古今偽書考謂傷寒論駁雜不倫往往難辨讀者苦不得其要旨然則彼自不能辨自不得其要旨耳此其自知之明於仲景乎何尤若所云錢曉城著醫學辨謬一書分別仲景書真偽惜不可得而見也隋書經籍志載遊元桂林二十一卷目一卷毛子晉本作張譏撰而校刊記據殿本監本改作張機今讀陳書有後主手授張譏玉柄麈尾又於鍾山松林下敕譏豎義取松枝代麈兩事則南朝自有張譏能捉麈豎義者非仲景也子晉不誤而據別本以改之者自誤耳余曾沿其訛採入補傳注中特證明之以志吾過六氣大司天上篇醫書自仲景傷寒論後於晉有王叔和隋有巢元方唐有孫真人王刺史宋有成無己皆足以發明仲景之道未有以仲景為偏於溫者至金元之間劉守真李東垣朱丹溪出而後之相提並論者輒謂仲景偏於辛溫守真偏於涼瀉東垣偏於溫補丹溪偏於清滋於是有疑其偏而棄其法者有用其偏而執其法者有以偏救偏而偏愈甚者而不知皆非偏也子輿氏謂知人必論世凡在尚友者皆然豈至於醫而獨不然乎然欲明前人治法之非偏必先明六氣司天之為病六氣者如厥陰風木司天少陽相火在泉是為風火之氣少陰君火司天陽明燥金在泉是為火燥之氣太陰濕土司天太陽寒水在泉是為濕寒之氣少陽相火司天厥陰風木在泉是為火風之氣陽明燥金司天少陰君火在泉是為燥火之氣太陽寒水司天太陰濕土在泉是為寒濕之氣此逐年司天之六氣可運諸掌上者也余則更以六十年一氣之大司天計之余蓋本於外曾祖王樸莊先生引內經七百二十氣凡三十歲而為一紀千四百四十氣凡六十歲而為一周擴而大之以三百六十年為一大運六十年為一大氣五運六氣迭乘滿三千六百年為一大周公言如此遂以知古人之用寒用溫即各隨其所值之大司天以為治而在其人道與時合往往有不自知者其人而當濕土寒水寒水濕土之運則以溫散溫補為治者非偏矣其人而當風火火風燥火火燥之運則以涼瀉清滋為治者非偏矣自余得公此論爰為古人盡發其藏溯自黃帝命大撓作甲子貞下起元從下元厥陰風木運始以厥陰為下元則少陰為上元太陰為中元復以少陽為下元則陽明為上元太陽為中元合前後三元而配以厥少太少陽太之六氣於黃帝八年起數前三十年為厥陰風木司天後三十年為少陽相火在泉歷金天高陽高辛唐虞夏殷周秦至漢靈帝十七年改元中平之元年為第四十九甲子仲景當建安中乃中平甲子垂二十年時亦屬下元厥陰風火用事當時習用烏附辛熱正值風火運中為治多誤故仲景以桂枝麻黃之溫治中風傷寒之病即以葛根芩連白虎承氣柏皮梔豉之清治溫熱濕溫之病凡遇溫熱即用寒涼其謂仲景但知秋冬不識春夏者不足與論仲景者也由此以推至宋高宗紹興十四年為第六十五甲子劉守真著素問元機序云大定丙午為金世宗二十六年即宋孝宗淳熙十三年乃紹興甲子之四十三年燥火用事亦宜於涼張易水與守真同時李東垣為易水高弟值宋寧宗嘉泰四年為第六十六甲子寒濕用事故宜於溫丹溪生於至元卒於至正值泰定元年第六十八甲子火燥用事故宜於清以上三家亦既按其時運一一符合即王海藏陰證略例純用溫藥麻革於癸卯年序之為金乃馬貞氏稱制之三年即宋理宗淳祐三年仍在嘉泰甲子中至明張介賓為萬曆時人專主溫補則又為嘉靖四十三年第七十二甲子寒濕用事時矣後此吳又可論瘟疫周禹載論溫熱暑疫多用寒涼均值天啟四年第七十三甲子風火用事時故在國朝康熙二十三年第七十四甲子火燥運中遵之多效至乾隆九年第七十五甲子運值濕寒其氣已轉而醫循故轍施治多乖樸莊先生傷寒論注成於乾隆甲寅以寒涼之治謂不合濕土寒水之運公之所治無不以溫散溫補見長蓋公固明於大司天之六氣而自知其所值為濕寒也若與公同時人則但樂於用溫適與時合而實不自知其所以然矣其後嘉慶九年甲子為第七十有六屬於少陽相火厥陰風木則為火風之歲及餘生於嘉慶戊寅中年以後肆力於醫逮今同治三年第七十七甲子又為陽明燥金少陰君火用事時上元之氣未至而至故於二年癸亥上海一隅霍亂盛行盡為熱證時醫以其手足厥逆競用丁附桂姜入口即斃余於甲子年獨以石膏芩連清而愈之或以涼水調膽礬吐而愈之證以我躬親歷而病之各隨司天以變者彌益顯然自此至今所遇時邪莫非溫熱大都以涼散以寒瀉者愈之為多以余所值燥火之運而宜寒涼則風燥二火之亦宜於涼寒濕濕寒之必宜於溫概可推矣由是而知仲景之用青龍白虎湯也以其所值為風火也守真闢朱肱用溫之誤申明仲景用寒之治為三已效方三一承氣也以其所值為燥火也東垣以脾胃立論專事升陽者以其所值為寒濕也丹溪以知柏治腎專事補陰者以其所值又為火燥也明乎此而知古聖昔賢著書立說都是補偏救敝之人仲景為醫中之聖師表萬世黃芩白虎即守真所本也建中理中即東垣所本也炙甘草湯黃連阿膠湯即丹溪所本也補瀉溫涼各隨其運設以守真而遇濕寒決不偏於寒涼東垣而遇風燥決不偏於溫補丹溪而遇寒濕決不偏於清滋乃讀其書不論其世因而不知其人輒謂如某者偏於涼如某者偏於溫孰能知法固非偏而不善用其法者之自涉於偏哉此無他皆坐不講司天故也六氣大司天下篇內經有曰必先歲氣毋伐天和此但就逐年之歲氣言之而六十年之歲氣亦不可不講也審矣余既明前人治法各從歲氣更以古今治痘家按時索之有益覺其顯然者兒病自錢仲陽減金匱八味丸之桂附而其於小兒之痘亦用清法則以其與守真同為六十五甲子燥火用事時也陳文中十一味木香散十二味異功散專主溫補則以其與東垣同為六十六甲子寒濕用事時也至丹溪以解毒和中立法復舍陳取錢則以其時又為六十八甲子火燥用事同於守真而異於東垣也迨前明汪機作痘證理辨自序於嘉靖九年庚寅以是年痘災盛行其治皆主於涼是為宏治十七年第七十一甲子燥火運中有宜然者洎乎嘉靖末年下逮隆萬苦寒之弊層見迭出故萬密齋聶久吾輩首重保元莫不以溫補為事而崇正甲戌費建中救偏瑣言出專主寒涼下奪其書中記一茸附治驗似乎不類而考其時尚為庚申年萬曆庚申正是七十二甲子張介賓著書時若天啟以後所值七十三甲子運轉風火七十四甲子接連火燥此二運風與燥異而其為火則同故費書猶盛行於康雍之間而乾隆九年既交七十五甲子濕寒之運則相沿成習者又相反矣時毗陵莊在田著遂生編以治痘福幼編以治痙切戒寒涼全活無算然揆諸嘉道間則又有不然者以嘉慶九年第七十六甲子又值火風用事故醒未子於嘉慶癸酉重刻在田書已云時師之失固在寒涼莊公之得固在溫補然苟有偏執則亦不能無弊豈不因莊所值為濕寒而醒未子所值為火風度必已有投此而不驗者故為是言而特不能識寒濕濕寒治法不可施諸風燥二火之運耳若余既值同治三年七十七甲子燥火之運每於痘主清熱解毒痙主瀉火墜痰而遇虛寒之體敗壞之證則步趨莊法亦足以應無窮之變蓋病者而果屬虛寒病甚而已極敗壞凡在四損之列者本不得常法是拘即使溫熱之末傳或亦須辛熱之反佐而況地形之南北有高下人身之稟賦有強弱且於抱恙之新久尤有分別凡所以隨機而應變者本非一言可竟而治病之法不出內經內經之治不外六氣自天元正紀以下七篇百病之治皆在其間豈可因其所論皆運氣而忘其為治法所從出哉附大司天三元甲子考明薛方山先生作甲子會紀第一甲子起黃帝八年至嘉靖四十三年為第七十二甲子國朝陳榕門先生作甲子紀元因之余推貞下起元之本准以厥少太少陽太之六氣凡前賢治病用藥咸相符合爰為考而次之如下黃帝八年起第一甲子下元厥陰風木少陽相火黃帝六十八年第二甲子上元少陰君火陽明燥金少昊十八年第三甲子中元太陰濕土太陽寒水少昊七十八年第四甲子下元少陽相火厥陰風木顓頊五十四年第五甲子上元陽明燥金少陰君火帝嚳二十九年第六甲子中元太陽寒水太陰濕土帝堯二十一載第七甲子下元厥陰風木少陽相火帝堯八十一載第八甲子上元少陰君火陽明燥金帝舜三十九載第九甲子中元太陰濕土太陽寒水夏仲康三歲第十甲子下元少陽相火厥陰風木帝相六十歲十一甲子上元陽明燥金少陰君火帝槐四歲十二甲子中元太陽寒水太陰濕土帝不降四歲十三甲子下元厥陰風木少陽相火帝扃五歲十四甲子上元少陰君火陽明燥金帝孔甲二十三歲十五甲子中元太陰濕土太陽寒水帝癸二十二歲十六甲子下元少陽相火厥陰風木商太甲十七祀十七甲子上元陽明燥金少陰君火太庚十五祀十八甲子中元太陽寒水太陰濕土太戊二十一祀十九甲子下元厥陰風木少陽相火仲丁六祀二十甲子上元少陰君火陽明燥金祖辛十祀二十一甲子中元太陰濕土太陽寒水祖丁二十九祀二十二甲子下元少陽相火厥陰風木盤庚二十五祀二十三甲子上元陽明燥金少陰君火武丁八祀二十四甲子中元太陽寒水太陰濕土祖甲二祀二十五甲子下元厥陰風木少陽相火武乙二祀二十六甲子上元少陰君火陽明燥金受辛十八祀二十七甲子中元太陰濕土太陽寒水周康王二年二十八甲子下元少陽相火厥陰風木昭王三十六年二十九甲子上元陽明燥金少陰君火穆王四十五年三十甲子中元太陽寒水太陰濕土孝王十三年三十一甲子下元厥陰風木少陽相火共和五年三十二甲子上元少陰君火陽明燥金幽王五年三十三甲子中元太陰濕土太陽寒水桓王三年三十四甲子下元少陽相火厥陰風木惠王二十年三十五甲子上元陽明燥金少陰君火定王十年三十六甲子中元太陽寒水太陰濕土景王八年三十七甲子下元厥陰風木少陽相火敬王四十三年三十八甲子上元少陰君火陽明燥金威烈王九年三十九甲子中元太陰濕土太陽寒水顯王十二年四十甲子下元少陽相火厥陰風木赧王十八年四十一甲子上元陽明燥金少陰君火秦始皇十年四十二甲子中元太陽寒水太陰濕土漢文帝三年四十三甲子下元厥陰風木少陽相火武帝元狩六年四十四甲子上元少陰君火陽明燥金宣帝五鳳元年四十五甲子中元太陰濕土太陽寒水平帝元始四年四十六甲子下元少陽相火厥陰風木明帝永平七年四十七甲子上元陽明燥金少陰君火安帝延光三年四十八甲子中元太陽寒水太陰濕土靈帝中平元年四十九甲子下元厥陰風木少陽相火蜀漢后帝延熙七年五十甲子上元少陰君火陽明燥金晉惠帝永興元年五十一甲子中元太陰濕土太陽寒水哀帝興寧二年五十二甲子下元少陽相火厥陰風木宋文帝元嘉元年五十三甲子上元陽明燥金少陰君火齊武帝永明二年五十四甲子中元太陽寒水太陰濕土梁武帝大同十年五十五甲子下元厥陰風木少陽相火隋文帝仁壽四年五十六甲子上元少陰君火陽明燥金唐高宗麟德元年五十七甲子中元太陰濕土太陽寒水元宗開元十二年五十八甲子下元少陽相火厥陰風木德宗興元元年五十九甲子上元陽明燥金少陰君火武宗會昌四年六十甲子中元太陽寒水太陰濕土昭宗天佑元年六十一甲子下元厥陰風木少陽相火宋太祖乾德二年六十二甲子上元少陰君火陽明燥金仁宗天聖二年六十三甲子中元太陰濕土太陽寒水神宗元豐七年六十四甲子下元少陽相火厥陰風木高宗紹興十四年六十五甲子上元陽明燥金少陰君火寧宗嘉泰四年六十六甲子中元太陽寒水太陰濕土理宗景定五年六十七甲子下元厥陰風木少陽相火元泰定帝泰定元年六十八甲子上元少陰君火陽明燥金明太祖洪武十七年六十九甲子中元太陰濕土太陽寒水英宗正統九年七十甲子下元少陽相火厥陰風木孝宗宏治十七年七十一甲子上元陽明燥金少陰君火世宗嘉靖四十三年七十二甲子中元太陽寒水太陰濕土熹宗天啟四年七十三甲子下元厥陰風木少陽相火至我國朝聖祖仁皇帝康熙二十三年七十四甲子上元少陰君火陽明燥金高宗純皇帝乾隆九年七十五甲子中元太陰濕土太陽寒水仁宗睿皇帝嘉慶九年七十