body:
  text: 卷六文六溫熱病說一余既取難經傷寒有五之文明仲景撰用難經之意凡溫熱之治即當求諸傷寒之論者無疑義矣而其二曰傷寒與四曰熱病五曰溫病則傷寒自是傷寒溫熱自是溫熱正有不可不辨者而余謂此亦最易辨也何以辨之則仍辨以傷寒論太陽陽明兩經之證以經言之太陽在外陽明在內以證言之太陽為表陽明為里傷寒由表入里其始僅為太陽證溫熱由里出表其始即為陽明證苟非能識傷寒何由而識溫熱苟非能識傷寒之治何由而識溫熱之治人苟於太陽陽明之部位既從兩經歷歷辨之再勘定其人之所病或僅在於太陽或已在於陽明而寒與溫之分途自截然而不爽故必能識傷寒而後能識溫熱也用藥之法傷寒起自太陽惟辛溫始可散邪不得早用辛涼溫熱起自陽明惟辛涼始可達邪不得仍用辛溫寒與溫皆稱汗病病之初皆當汗解而辛溫之與辛涼則有一定之分際而不可混者故必能識傷寒之治而後能識溫熱之治也且夫傷寒論之有青龍白虎也蓋因傷寒初起失用溫散寒邪內傳便成溫熱治必改就寒涼故兩方並用石膏而其分則在一用桂麻一不用桂麻有桂麻者不可用於溫熱病專屬陽明之候但可用於傷寒病欲轉陽明之候無桂麻者則即可用於傷寒病已入陽明之侯即可用於溫熱病發自陽明之候蓋其時陰為熱傷傷津傷液惟寒涼之撤熱力始足以救陰熱之不撤陰即有不克保者所以芩連膏黃皆以治溫非以治寒只除去起首桂麻二物則傷寒論中方大半皆治溫治熱方矣凡傷寒發熱者不渴如服桂枝湯已而渴服柴胡湯已而渴不惡寒反惡熱始初惡寒一熱而不復惡寒凡傷寒欲解時寒去而熱亦罷若寒去熱不罷汗出仍熱而脈躁疾皆溫病之的候也病之始自陽明者為溫即始自太陽而已入陽明者亦為溫是故太陽病發熱而渴不惡寒者為溫病此一條本以太陽病發熱五字為句以而渴不惡寒者六字為句蓋上五字為太陽而下之渴不惡寒即陽明也又太陽病桂枝證醫反下之利遂不止脈促者表未解也喘而汗出者葛根黃連黃芩湯主之此一條桂枝證本太陽病而以醫誤下遂入陽明蓋上六字為太陽而下之脈促喘汗即陽明也觀此兩條之渴也喘也汗也脈促也不惡寒也皆屬溫熱即皆屬陽明而條首仍冠以太陽字者正令人於渴利等字知其病之已從太陽傳入陽明急當專就陽明治也若因其上有太陽字仍作太陽觀仍用太陽方或並認作太陰病者皆非能識溫熱者也溫熱病說二溫熱之病為陽明證證在傷寒論中方亦不在傷寒論外本不難辨自夫人以論外之瘟疫作論中之溫熱惟恐瘟疫與傷寒混適將溫熱與瘟疫混反將溫熱與傷寒混傷寒溫熱瘟疫三者愈辨愈不清矣是故欲得溫熱之真必先嚴瘟疫之界乃能知傷寒之論本自有溫熱之方凡病之裡巷相傳長幼相似其小者如目赤頤腫咽痛咳嗽之類常常有之屬溫者多其大者變起倉猝一發莫制有不定其病之為寒為溫者眾人傳染如徭役然因其傳染乃名為疫若病只一身即在同室侍疾之人亦不傳染則溫為溫病熱為熱病其初傳與傷寒之太陽異其中傳與傷寒之陽明同既不傳染即不得以疫名乃人皆以病之傳染者始謂之溫而反以不傳染之溫病獨不得用桂麻青龍者仍狃於傷寒二字而用桂麻青龍之方十治九誤所以欲明溫熱者必與傷寒辨而尤必先與瘟疫辨與瘟疫辨者無他蓋即辨其傳染不傳染耳明乎傳染之有寒有熱者為瘟疫即知不傳染而有熱無寒者為溫病其所以異於瘟疫者只在此不傳染之三字其所以異於傷寒者亦只在不用桂麻青龍之三方此外則與傷寒病寒既成溫而後病無少異方亦無不同凡溫病之宜用葛根芩連湯白虎湯諸承氣湯及凡為清法所治者病在論中方亦在論中知病之如是者即謂之溫乃不以病之傳染者始謂之溫而反以溫病之不傳染者仍用桂麻青龍之法矣質而言之溫病者陽明也傷寒論注以成氏為最先成氏只有陽明也三字包掃一切言簡而明他若葛稚川以蔥豉湯治溫而云傷寒有數種庸工皆不能辯劉守真以升麻葛根湯治溫而云傷寒曰大病以其為害之大也夫治溫而曰傷寒有數種治溫而曰大病之傷寒則知前人之通稱傷寒者由來已久然苟不先嚴瘟疫之界即不能得溫熱之真柯韻伯曰溫熱利害只在一人瘟疫利害禍延鄉里今人不分溫熱瘟疫以辭害義矣周禹載曰一人受之則謂之溫一方受之則謂之疫薛一瓢曰江西才宏筆肆而論溫自呈敗缺溫瘟二證絕無界限人不知其牽混也黃坤載曰溫病者一人之病非眾人所同病其州里傳染眾人同病者謂之疫癘只此數語分別溫瘟病者可以蒙其福學者可以受其益解人不當如是耶故比年以來人每以溫之何以別於傷寒者問余必先以溫之所以別於瘟疫者對而凡昔之愈辨愈不清者庶幾自此而一清乎溫熱病說三溫熱之屢變而亂其真也由於傷寒之一變而失其傳風寒諸病由太陽入陽明者有傷寒論在尚且各自為說至溫熱而漫以為仲景所未言更不妨別出已見每先將溫病移入他經或且移作他證如奕棋然直無一局之同者若喻嘉言移其病於少陰腎周禹載移其病於少陽膽舒馳遠移其病於太陰脾顧景文移其病於太陰肺遂移其病於厥陰心包秦皇士移其病於南方吳鞠通移其病於上焦陳素中楊慄山移其病為雜氣章虛谷王孟英移其病為外感尤其甚者則張介賓張石頑以及戴天章輩訾移其病為瘟疫而石頑又移其病為夾陰娓娓動聽亦若各有一理也者而不知陽明為成溫之藪古來皆無異說皆以傷寒論陽明方為治自夫人慾廢陽明方故必先將陽明病移出陽明外非余之故為皆議也苟其不然則東扯西拽者何以必將千古相傳之定法弁毛棄之哉禹謨曰宥過無大刑故無小不知而移之出於無心也過也猶可恕也知而移之出於有心也故也不可言也潛窺其隱恐尚不僅為明昧之分後有作者或更別有移法總欲令世人不知有仲景而樂就其簡便之門新奇之說耳然此皆將溫病移出陽明外者更有明知其在陽明亦必謂不可用傷寒方而自制一二味藥以為此非仲景所知其實除此一二味則仍不離傷寒論之葛根膏黃試一問黃坤載楊慄山輩於青萍蠶蟬外所用何藥即可見矣此則暗襲傷寒方而即明斥傷寒論又以不移為移者也吾願任斯道之君子毋為移字訣所誤看得仲景書只宜於寒而疑傷寒之方真不可用於溫熱之病則吾道之幸亦病家之幸也爰為選方如下仍是諸家所用藥不過彼暗而此明耳附溫熱病選方葛根黃連黃芩湯此為陽明主方不專為下利設葛根黃連黃芩炙甘草白虎湯石膏知母炙甘草粳米大承氣湯諸承氣法酌用大黃芒硝厚朴枳實五苓散去桂術豬苓茯苓澤瀉黃芩湯黃芩赤芍大棗炙甘草大黃黃連瀉心湯溫熱之用瀉心法者只用此一方大黃黃連茵陳蒿湯茵陳大黃梔子梔子豉湯諸梔豉法酌用生梔子香豉四逆散柴胡枳實赤芍炙甘草白頭翁湯秦皮白頭翁黃連黃柏此以上皆仲景方升麻葛根湯升麻葛根赤芍炙甘草涼膈散連翹薄荷黃芩梔子大黃芒硝炙甘草天水散滑石生甘草此以上為河間方肘後蔥豉湯蔥白豆豉肘後葛根蔥白湯去姜葛根蔥白知母川芎赤芍節庵柴葛解肌湯去薑棗柴胡葛根白芷羌活石膏黃芩赤芍桔梗生甘草局方柴葛升麻湯去姜柴胡葛根升麻荊芥前胡石膏黃芩赤芍桑白皮豆豉羌活沖和湯生地生薑酌用羌活防風川芎白芷蒼朮黃芩生地炙甘草蔥白生薑荊防敗毒散人參酌用荊芥防風羌活獨活柴胡前胡川芎枳殼桔梗薄荷人參茯苓炙甘草黃連解毒湯大金花丸去梔子加大黃黃連黃芩黃柏梔子三黃石膏湯黃芩黃連黃柏梔子豆豉石膏蒼朮白虎湯蒼朮石膏知母炙甘草粳米此餘二十餘年酌用之方病無不愈不敢自私以貢病家瘟疫病說一說文疫民皆病也從疒役省聲小徐系傳若應役然釋名疫役也言有鬼行疫也一切經音義注引字林疫病流行也此即內經刺法論所謂五疫之至皆相染易無問大小病狀相似亦即仲景原文所謂一歲之中長幼之病多相似者是也惟其大小長幼罔不相似故曰皆病惟其皆病若應役然故謂之疫仲景為後漢人請即以後漢言之安帝元和己未會稽大疫延光乙丑京師大疫張衡上封事謂民都病死死有滅戶人人恐懼朝廷焦思以為至憂此非長幼相似病不獨在一人者乎仲景當靈獻時遭疫者六建寧之辛亥熹平之癸丑光和之己未壬戌中平之乙丑建安之丁酉皆有疫而以丁酉之疫為最曹植嘗言曰是年癘氣流行家家有殭屍之痛室室有號泣之哀或闔門而殪或覆族而喪罹此者悉被褐茹藿之子荊戶蓬室之人耳若夫殿處鼎食之家重貂累蓐之門若是者鮮焉此乃陰陽失位寒暑錯時是故生疫仲景所值有疫之年如此此六年外豈無溫病而為一人所獨者一人獨病即不是皆病之疫近人於無疫之年所遇溫病概名為疫幾若一人獨病之溫世間更無此病者然然則此病其安往乎其在宋元時則不名為疫而名曰瘟蘇公雪夜詩云稍壓冬瘟聊得健蓋以俗傳有雪壓瘟疫之語此亦指皆病之瘟言之也近如喻嘉言所謂雞瘟死雞豬瘟死豬牛馬瘟死牛馬吳又可所謂大頭瘟瓜瓤瘟蝦蟆瘟疙瘩瘟絞腸瘟軟腳瘟劉松峰所謂葡萄瘟鸕鷀瘟龍鬚瘟蝦子瘟芋艿瘟又有所謂椅子翻扁擔翻王瓜翻所謂鵓鴿掙烏鴉掙兔兒掙狐貍掙猿猴掙者瘟也翻也掙也皆疫也即所謂皆病之疫也陳素中謂凶暴大病死生人在數日間戴天章謂中人人病中物物傷試察廁間糞氣與凶地屍氣自能辨之楊慄山謂毒霧之來也無端煙瘴之出也無時餓殍在道胔骼之掩埋不厚死屍連床魄汗之淋漓自充凡為疵癘旱潦之氣禽獸草木往往不免即此諸說且不僅為長幼相似直有比屋連村一家而斃數人者矣不獨死生在幾日間且有朝發夕死夕發朝死尤急則頃刻而死者矣如是者即古人之所謂疫如是者即近人之所謂瘟或數十年而一見或數十年亦不一見試問病家其與年年常有之溫一人獨病之溫有何干涉若年年常有之溫何至朝廷亦為之焦思如張平子之所言乎若一人獨病之溫何至闔門覆族家家痛室室哀如陳思王之所言乎著作家或意本在溫而跡其所指則皆瘟疫或其書竟名瘟疫而味其所言則仍是溫生其後者不且迷於所向而無可適從哉余特將凡言瘟疫之大異於尋常溫熱者羅列於此以告病家冀病家先識此為瘟疫而將尋常溫熱之病別而出之庶知溫熱之治仍可取用傷寒論中之方而頭頭是道矣瘟疫病說二余即明瘟之與疫不過為古今異名則疫即是瘟瘟即是疫而與溫熱之溫全不相涉者概可明矣乃更有謂溫瘟為古今字不可以溫瘟為兩字者則吳又可之瘟疫論也蓋又可欲謂溫瘟為一病故謂不可以溫瘟為兩字夫疫有兩種一為溫之疫一為寒之疫若既論疫則疫之溫者宜寒疫之寒者宜溫各有治法又可之書只說疫之有溫本未及疫之有寒且但說疫中之溫本不說不疫之溫其義自在若必欲以溫瘟為一字則疫之寒者既不可稱寒溫豈疫之溫者獨可稱為溫溫乎其後周禹載之分溫熱暑疫王孟英之集溫熱濕疫非不欲明疫之外自有溫熱然皆平列四證則又不知溫熱暑濕皆就一人之病言疫則必以病之傳染言如其溫熱暑濕之四證而併為一時所傳染則溫為溫疫熱為熱疫暑濕為暑濕之疫且當與寒病之有傳染者皆以疫名若之何其可平列乎凡著書者但說溫疫不說寒疫故並果為有疫之年而其疫之或為寒或為溫者亦令人罔知所措也瘟疫病說三疫之稱謂不可不明疫之治法亦不可不講內經五疫之至各隨其所值之年由伏而發其治盡於木鬱達之火鬱發之土鬱奪之金鬱泄之水鬱折之五法蓋治疫獨講太少之五運與夫主客之六氣就寒溫兩面而言卻是溫疫多而寒疫少故五運之有木火土金水也半寒而半溫也六氣之有濕寒寒濕風火火風燥火火燥也溫又多於寒也然正不得以溫多於寒而遂置寒疫於不問也周禹載於溫獨說春溫而於疫又獨說溫疫則既不解溫之無寒又不解疫之有寒故耳黃坤載則知有寒疫矣然於溫疫則云無內熱無內熱何以謂之溫乎於寒疫則反用石膏用石膏何以謂之寒乎喻嘉言論疫專主三焦頗得治疫之法坤載之於疫偏說手足六經夫疫之小者不分經絡疫之大者頃刻變生尚何六經傳遍之有只是仲景六經之藥不外溫清兩法以之分治兩疫亦為甚合大抵以溫而疫則論中芩連梔柏之統於膏黃者可用也以寒而疫則論中吳萸蜀椒之統於薑附者可用也余獨舉運氣一方冠其首而又舉普濟消毒飲之治溫疫者以概清法舉聖散子之治寒疫者以概溫法而禹載之惑可解坤載之混可別及嘉言治溫而用薑附即鞠通本之而用桂枝者皆可刪總而言之不傳染而有熱無寒者是曰溫傳染而有寒有熱者是為疫不得以治寒疫者治溫疫更不得以治寒疫者治溫病也此溫熱瘟疫所以必嚴其界而瘟疫寒疫所以亦不可偏舉也附瘟疫病選方運氣五瘟丹方載韓氏醫通馬氏瘟疫發源萬氏家抄方亦名代天宣化丸大黃甘草梢黃芩黃柏山梔黃連香附紫蘇葉上八味於冬至日將大黃三倍於他藥煎湯去渣熬膏糊丸如雞子大硃砂雄黃為衣再貼金箔每一丸取泉水一碗浸化可服七人甲己年甘草稍為君乙庚年黃芩為君丙辛年黃柏為君丁壬年山梔為君戊癸年黃連為君凡為君者多一倍余為臣使者半之普濟消毒飲東垣方亦見王氏準繩黃芩黃連連翹薄荷桔梗牛蒡馬勃板藍根元參殭蠶升麻柴胡陳皮人參炙甘草便秘加大黃煎湯飲金泰和間多有病大頭天行者醫以承氣下之不愈東垣曰身半以上天之氣也身半以下地之氣也今邪熱客於心肺之間而以承氣瀉其胃熱是為誅伐無過病以適至其所為故因處此方全活甚眾遂名普濟按金泰和初年尚在六十五甲子火燥之末可見東垣於嘉泰甲子以前亦能用寒劑也余以此賅清法諸方焉聖散子巢谷世方見龐氏總病論暨蘇沈良方麻黃附子細辛炙甘草柴胡防風藁本獨活蒼朮厚朴枳殼藿香半夏吳茱萸高良薑草豆蔻白朮白芍豬苓茯苓澤瀉石菖蒲銼焙作散每服三錢空心下陳無擇三因方云此藥實治寒疫因東坡作序天下通行辛未年永嘉瘟疫被害者不可勝數蓋當東坡時寒疫流行而公實誤以陰躁為陽狂乃云藥性小熱而陽毒發斑入口即覺清涼有不可以常理詰者不知陽能發厥陰能發躁寒疫亦能發斑物極則反理之常然今錄以備寒疫治療用者宜審寒溫二疫不可偏奏也青田說如此余按公謫居黃州尚在六十三甲子濕土運中方必大效至五十歲後又值六十四甲子相火之運故至辛未而即有被害者矣陳氏固深明運氣者余亦以此賅溫法諸方焉溫清二法外如玉樞丹紅靈丹蘇合香丸牛黃清心丸人馬平安散諸葛行軍散輩分治溫疫寒疫寒溫錯雜之疫病不僅在腸胃而實蒙閉氣道對病即為良藥獨不可施諸溫熱病中蓋溫熱獨病燥金若疫則不定為燥金病故必先明寒溫二疫而後知溫熱之病自不得混稱疫矣
