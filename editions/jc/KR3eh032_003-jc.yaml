body:
  text: 卷三文三太陽寒水病方說太陽主表為心肺之陽統一身之營衛實寒水之所司衛氣疏泄而行於外風能中之營氣固密而行於中寒能傷之風寒之中傷皆發表熱其中風者有惡風惡寒頭痛項強等證其傷寒者更有嘔逆腰痛骨節煩疼等證而表邪之在衛在營則以脈之浮緩浮緊分之即於身之有汗無汗定之衛病營未病則脈緩而有汗營病衛亦病則脈緊而無汗汗出而不喘滿者用桂枝喘滿而不汗出者用麻黃不汗而喘喘而煩躁者用石膏此桂麻青龍所以為汗法之三級也有汗不用麻黃湯無汗不用桂枝湯不煩躁不用大青龍湯其辨如此太陽以膀胱為腑邪入里為犯本汗為心液水之氣也故太陽病以發汗為出路又以利水為去路凡利水之法以小便不利為辨其渴欲飲水小便不利而為水逆者五苓散用桂枝是通里仍兼解表也非水畜而畜血則又以小便自利為辨其人善忘如狂小便自利者桃仁承氣湯亦用桂枝是攻裡仍兼解表也古稱寒熱病為汗病謂皆當從汗解故汗不可過而亦不可失過汗則液涸而亡其陽邪入少陰則有薑附之治而理中四逆同之失汗則熱熾而爍其陰邪入陽明則有芩連之治而白虎三承氣繼之陽明燥金病方說陽明主裡為燥金氣化外候肌肉內以候胃有病經病腑之不同如身熱汗自出不惡寒反惡熱始雖惡寒二日自止目疼鼻乾不得眠或多眠睡脈大而長者經病也胃實不大便潮熱日晡所熱譫語睛不和昏不識人甚則循衣摸床撮空理線脈滑而實者腑病也其陽明之經病先有不同如脈浮汗出惡風者仍用桂枝湯脈浮無汗而喘者仍用麻黃湯脈浮無汗惡寒而或兼自利者則用葛根桂麻湯是皆太陽病初入陽明之表也若裡熱達外之表則病已離太陽或本不始太陽斷無更用桂麻之理而如葛根芩連一法即大青龍之變局實陽明病之主方蓋葛根之發大異桂麻而芩連之清亦微異於石膏也其淺者虛煩懊憹則以梔豉湯探吐之其重者渴飲多汗壯熱滿悶則以白虎湯直清之虛則白虎加人參湯補而達之此皆陽明在經之證無不以汗為先務吐為正務清火為要務失此不治而至胃家實腹有燥屎則為入腑燥屎不去病變不可勝言此時撤熱救陰舍承氣無他法是又為腑證中急務也而陽明之腑證又有三焉其邪自太陽來為脾約脾不能為胃行其津液用麻仁丸謂之太陽陽明邪自少陽來為大便難木氣不能疏通其土用大柴胡湯謂之少陽陽明二方與正陽陽明胃家實之必用三承氣者微有不同凡攻下之法必待惡寒罷表盡解之後若惡寒者則尚有太陽表證未了慎不可攻此所以有急下存陰之訓而又曰下不厭遲者正謂有惡寒即不可議下也少陽相火病方說少陽主半表半裡其病發於腠理三陽經太陽為開陽明為合而少陽為之樞所以為半表半裡也少陽汗下俱禁故特立小柴胡一方為和解之局其表證有往來寒熱胸脅痛而耳聾心煩喜嘔其脈必弦小柴胡湯主之其里證有口苦咽乾目眩痞滿咳悸或渴或不渴或嘔或不嘔其脈亦弦治悉從小柴胡加減皆和局也若其心下支結已屬少陽而發熱惡寒與太陽同則邪偏於表治必從柴胡桂枝兩解之亦和局也其因誤汗而胸肋滿微結者仍當微汗而解則有柴胡加桂枝之治因誤下而胸脅滿微利者又當微下而解則有柴胡加芒硝之治散結除滿用此二方是又為汗下兩誤者作和局也若夫結之甚而為痞滿之甚而為噫則有瀉心三方及旋覆代赭湯黃芩湯乾薑黃芩黃連人參湯諸治亦所以散結除滿而皆不外乎和局者是夫少陽者相火所寄也故有必從清火而解者其相火以遊行於表為輕以鬱結於裡為重小則仍用小柴胡大則須用大柴胡亦何莫非少陽中和局耶其謬以柴胡為汗劑者抑胡不思少陽之治特以禁汗而乃有柴胡之用也三陽寒熱之分身雖大熱而仍惡寒者太陽也寒已而熱熱已而汗寒熱往來者少陽也始雖惡寒一熱而不復惡寒者陽明也太少兩陽病在肌腠兩陽合明病歸中土故論經則以太陽陽明少陽為次論病則太少之邪俱入陽明也太陰濕土病方說太陰為陰中至陰腹滿痛為太陰主病脈沉細為太陰主脈凡濕土之氣化其證多見虛寒宜理中以溫補此大較也而桂枝一法亦為太陰表藥蓋以太陽傳來之邪有四肢煩疼嗌乾脈浮之表而脾司肌肉桂枝解肌故以為治即因誤下而大實痛仍須桂枝中使以大黃因誤下而腹滿時痛仍不過於桂枝中倍以芍藥誠以太陰臟本屬寒如前兩證皆由太陽轉屬太陰而非太陰本病若病一入臟而見脈弱自利雖當行大黃芍藥者即宜減之此太陰之所以大異於陽明也三陰皆有自利自利不皆屬寒少厥之自利多口渴太陰之自利則不渴不可見太陰之獨有寒耶其曰手足自溫者正謂其一身無熱而但有手足之尚溫故即未成厥逆亦有取乎四逆之治夫腹滿痛為太陰陽明公共之證而太陰為陰道虛為卑監之土腹滿而時痛其脈必弱陽明為陽道實為敦阜之土腹滿而大實痛其脈必大蓋以太陰陽明同居中土其邪而在陽明即為實其邪而入太陰即為虛則惟於大實痛之痛無已時腹時痛之時痛時止者辨之少陰君火病方說少陰為君火之化然有水火二臟邪從水化為陰邪其標也邪從火化為陽邪其本也從標治在回陽從本治在救陰回陽救陰二法有不可偏廢者其脈沉反發熱為少陰之表證麻附辛甘二湯為少陰之表藥此仍從太陽傳入者也如下利咳嘔煩渴用豬苓湯心煩不得眠用黃連阿膠湯病皆從火化為陽邪是宜從本以撤熱為救陰法如下利或渴或悸而小便不利者及身體痛骨節痛手足寒背惡寒而口中和者用真武湯附子湯如下利惡寒倦臥者且煩躁者用通脈白通茱萸桃花諸湯病皆從水化為陰邪是宜從標以驅寒為回陽法此為少陰中截然兩途宜分溫法清法以為治豈可一涉少陰即認作但有溫法耶三陰經太陰為開厥陰為合而少陰為之樞故臟有水火治分標本以此認得少陰庶無誤耳況有四逆下重為陽邪滯下者只宜用四逆散或口燥咽乾自利色純青腹脹不大便為陽邪內實者且當用大承氣湯陽明有急下三法少陰亦有急下三法是亦陽為病而並宜從本治者即內經所謂中陰溜府後人所謂還而成可攻之證是也若夫太陽誤治汗而復下下而復汗即見少陰之煩躁者雖有固陰收陽壯陽配陰兩法為太陽顧本之治即為少陰難治之條如更汗出息高利止眩冒惡寒身倦不煩但躁則皆少陰中死證即復脈一湯亦未必及救矣厥陰風木病方說厥陰為陰之初盡即為陽之初生與少陽同為相火遊行之部即為風木主化之經經屬陰而臟不寒每多陰陽錯雜寒熱互形之證而尤重在厥利兩端其手足厥逆脈細欲絕者為厥陰之表證當歸四逆湯即厥陰之表藥厥者何熱是也先厥者後必熱厥深者熱亦深厥微者熱亦微此蓋陽熱在裡陰氣被格陽反居內陰反居外其熱不除其厥不已其人不生切不可因手足之冷而遂認作虛寒輒投薑附故於脈滑而厥當其里有大熱還而為陽明證者且當以白虎湯清之惟有大汗大下利厥逆而惡寒者嘔而小便利身無熱而見厥者方可用四逆湯以溫經而臟厥吐沫之用茱萸湯蛔厥吐蛔之用烏梅丸胥准此耳其下利亦屬熱者多故其於熱利下重便膿血必用白頭翁之連柏下利譫語有燥屎且用小承氣之樸枳惟有大汗出而厥外惡寒內拘急下利清穀者始可用通脈四逆湯久利亦用烏梅丸此則寒利之治也三陰中少陰多內真寒外假熱厥陰多內真熱外假寒其間陰盛格陽陽盛格陰最為危候故少陰有死證五條厥陰有死證六條若見身汗如油喘而不休環口黧黑直視搖頭即復脈一湯亦未必及救不皆為厥陰中死證歟病至三陰宜溫者多宜清者亦不少太陰為寒臟尚有大黃芍藥少陰火為本而水為標亦有大承氣厥陰陰之盡而陽之初亦有白虎小承氣溫清之所以不可偏廢也附傷寒論溫清三法選方溫法選方十三道類方十四道溫法諸方即仲景所以治中風傷寒者凡治寒疫亦用溫法桂枝湯桂枝加厚朴杏仁湯本方加樸杏小建中湯本方倍芍藥加膠飴桂枝二越婢一湯本方加麻黃石膏桂枝生薑芍藥大棗炙甘草麻黃湯桂枝麻黃各半湯桂枝二麻黃一湯即與桂枝湯合用麻杏石甘湯本方桂枝易石膏麻黃杏仁桂枝炙甘草五苓散桂枝白朮豬苓茯苓澤瀉麻黃附子細辛湯麻附甘草湯本方去細辛加炙草麻黃附子細辛理中丸及湯附子理中本方加附白朮乾薑人參炙甘草附子湯與真武湯一為參附三白一為薑附三白附子人參白朮白芍白茯苓真武湯有加減附子生薑白朮白芍白茯苓四逆湯四逆加人參湯本方加參茯苓四逆湯本方加參再加苓亦即附子理中去朮加苓炙甘草乾薑生附子當歸四逆湯即桂枝湯去薑棗加當歸辛通當歸四逆加吳茱萸生薑湯本方加茱萸湯之半當歸細辛通草桂枝芍藥炙甘草通脈四逆湯有加減通脈四逆加豬膽汁湯本方加膽汁炙甘草乾薑生附子蔥白白通湯白通加豬膽汁湯本方加童便膽汁乾薑生附子蔥白吳茱萸湯吳茱萸生薑人參炙甘草桃花湯赤石脂禹餘糧湯本方加餘糧去薑米赤石脂乾薑粳米清法選方十三道類方八道清法諸方亦即仲景所以治溫病熱病濕溫病者凡治溫疫亦用清法葛根黃連黃芩湯葛根黃芩黃連炙甘草白虎湯人參白虎湯本方加參竹葉石膏湯本方加人參竹葉麥冬半夏去知母石膏知母炙甘草粳米大承氣湯小承氣本方去芒硝調胃承氣本方加草去樸枳大黃芒硝厚朴枳實梔子豉湯梔子甘草湯枳實梔子豉湯本方一加甘草一加枳實梔子柏皮湯梔子厚朴枳實湯本方一加柏皮一加樸枳生梔子香豉黃芩湯即桂枝湯以芩易桂去姜黃芩芍藥大棗炙甘草小陷胸湯栝蔞根半夏黃連大黃黃連瀉心湯大黃黃連茵陳蒿湯茵陳大黑山梔麻子仁丸亦名脾約丸即小承氣加二仁芍藥麻仁杏仁芍藥大黃厚朴枳實四逆散有加減與四逆湯之薑附大異柴胡枳實芍藥炙甘草白頭翁湯秦皮白頭翁黃連黃柏黃連阿膠湯黃連阿膠黃芩芍藥雞子黃豬苓湯即五苓散去桂術加膠滑豬苓茯苓澤瀉阿膠滑石溫清合法選方十四道類方八道溫清合法諸方即仲景所以治寒熱錯雜之病大青龍湯即桂枝麻黃越婢湯三方去芍加膏又小青龍即桂枝湯去薑棗加麻辛薑半五味子與十棗湯之芫花遂戟同為治水之劑麻黃杏仁桂枝生薑大棗炙甘草石膏葛根湯即桂枝湯加麻葛葛根麻黃桂枝生薑芍藥大棗炙甘草小柴胡湯有加減小柴胡加芒硝湯本方加硝又旋覆代赭湯本方柴芩易旋代柴胡黃芩生薑半夏人參大棗炙甘草甘草瀉心湯生薑瀉心湯本方加生薑為君半夏瀉心湯即本方以半夏為君並加人參生甘草黃芩黃連乾薑半夏大棗附子瀉心湯附子大黃黃芩黃連黃連湯即半夏瀉心去芩加桂黃連乾薑桂枝半夏人參大棗乾薑黃芩黃連人參湯乾薑黃芩黃連人參梔子生薑湯與梔子乾薑湯一走表一和中梔子生薑桃仁承氣湯即調胃承氣加桃仁桂枝桃仁桂枝大黃芒硝甘草大柴胡湯即小柴胡去人參棗草加枳芍大黃柴胡黃芩生薑半夏枳實芍藥大黃柴胡加桂枝湯即小柴胡本方加桂柴胡黃芩生薑半夏人參大棗炙甘草桂枝桂枝加大黃湯即桂枝湯本方加大黃桂枝生薑芍藥大棗炙甘草大黃烏梅丸又麻黃升麻湯與此方同法烏梅蜀椒細辛桂枝附子黃連黃柏人參當歸復脈湯此方不可去薑桂去之即不得仍名復脈炙甘草生薑桂枝生地麥冬阿膠人參大棗加酒煎雜療方共四十三道亦有溫清各法桂枝加