body:
  text: 卷十四文十四答沈沃之問邪之所湊真氣必虛書辱手教以內經評熱論邪之所湊其氣必虛懲今人之好言虛者每援此為口實謬以僕為今之戴侍中責其以經解經一破時扃僕則何敢當也請以素所誦習者為大君子陳之經文此二句下尚有陰虛者陽必湊之故少氣時熱而汗出也二語合而觀之明即今之偶有感冒身發表熱一汗而愈之病蓋即玉機真藏論風寒客於人使人毫毛畢直皮膚閉而為熱當是之時可汗而發者是也亦即八正神明論凡邪新客溶溶未有定處推之則前引之則止者是也經脈別論勇者氣行則已怯者則著而為病怯即虛之謂也著即湊之謂也此即氣虛邪湊之說也九宮八風論風雨寒暑不得虛邪不能獨傷人必因虛邪之風與其身形兩虛相得此亦氣虛邪湊之說也凡風從沖後來者亦謂從虛鄉來即名虛風若一見虛字便云當補則虛鄉之風且當先補其風乎歲露論月郭滿則海水西盛人血氣積月郭空則海水東盛人血氣虛故八正篇又曰以身之虛逢天之虛是為兩虛至真要大論亦謂乘年之虛失時之和遇月之空是為三虛空亦虛也若見一虛字便云當補則天之虛亦當先補天月之虛亦當先補月乎此可見邪因虛湊不過為一時之邪著而為病怯者不如勇者之氣行而即已有必待推之引之發其汗而邪始去耳按刺志論曰氣虛形虛此其常也反此者病谷虛氣虛此其常也反此者病脈虛血虛此其常也反此者病三言以虛為常不可見虛之不為病乎三言反此則病不更見不虛之即為病乎又按通評虛實論曰邪氣盛則實精氣奪則虛而結之曰虛則可治實則死蓋病以邪盛為實實之不去最足至虛其曰奪者明乎精氣之非自為虛必有奪之使虛者而始虛也否則盛與衰對若非因奪而虛則何以不曰盛則實衰則虛而必曰奪則虛乎且何以不曰實則可治虛則死而必曰實則死乎人本虛也有盛焉者則實人本不虛也有奪之者則虛兩則字當作如是解而凡經所言實則瀉之及無實實之訓皆可明矣許叔微於此段經文嘗下一轉語曰邪之所湊其氣必虛留而不去其病則實鄉先輩靈胎徐氏解此句曰其氣之虛固宜補矣所湊之邪不當去耶亦斯意也至柯韻伯傷寒論翼序不著撰人名氏妄謂邪湊之為氣虛者謂邪乘腎氣之素虛而傷之則沿傷寒偏打下虛人之謬且足為談夾陰者樹其幟此必非韻伯意也縱言至於斯未知與足下詁經之意有合焉否恨生之晚不及奉教於停雲樓中也答陸曦叔問經月不寐書曦叔足下不寐者經月矣豈小病耶囑擬接服方並詢以不寐證共有幾種其最淺者為胃不和則臥不安其最大者則心腎不交而不成寐子松深於易者也宜其以天地交天地不交水在火上火在水上之辭為否泰既未濟作通卦驗而所檢用之磁朱丸獨遺神麯則心為嬰兒腎為奼女而不得入脾之黃婆為之媒合即嬰奼亦終不和此交通之媒所以全在神麯一味若以為克脾而舍之將並胃亦不得而和矣何以使臥之能安也靈樞邪客篇衛氣晝日行於陽夜半行於陰行於陽則陽氣盛陽氣盛則陽蹻陷不得入於陰則陰氣虛陰虛故目不瞑治之以半夏秫米湯覆杯即臥此以陰陽一通其臥立至半夏秫米亦不過和其胃而已然此數味服之已多何以臥仍不安即可見病之不僅在是矣此外則有膽虛不眠膽熱亦不眠者利叔檢得之酸棗仁只治膽虛未足以清膽熱固知堆書滿案按圖刻舟於病未必盡合也僕則獨以為膽之熱者以近日肝火旺盛素不作疾言遽色而今乃多怒若此謂非乙木之不戢即甲木之不清乎肝與膽相表裡臥則魂舍於肝今之不寐而神魂若顛倒者魂不歸於肝也鄙意仿許學士珍珠丸法用珍珠母一兩臣以龍齒犀角各如其數之半佐以參茯歸地棗柏二仁又遞減之使以沉香薄荷各少許作為湯液珍珠母為涼肝要藥龍齒與肝同類可以安魂犀角兼清心熱賴以安神而沉香以降逆上之氣薄荷亦養育心神之品治相火以安君火正與交通心腎之說不甚相懸木平則不侮土亦何嘗不可以和胃耶貢愚如此惟足下圖之尋聞其服此方而神大倦及三服後一臥三日病遂以愈不誠如經所云一劑知二劑已耶臥幾及三日者久不遊黑甜鄉樂而忘返也近有知醫者亦以不寐商投桂附余以芩連柏梔兼進石膏而愈尚能見信幸哉與葉丈調生論劉𢘅階溫熱病書損書及詩賜題拙著花近樓小草推許過當竊滋愧矣𢘅階自五保河來遊滬上舍於夫己氏之以醫名者車馬喧闐其門若市而𢘅階一室灑然筆床研匣仍得閉戶著書致足樂也惟常有小病夫己氏為之處方已與病情不甚合及今得溫熱病乃傷寒中之陽明病也脈得浮大為葛根芩連證夫己氏認以為太陽病而用桂枝以其在夫己氏也未便過而問焉但勸其少服藥耳初六日丈親臨敝寓挾以偕行因感丈意之深復切友朋之念不肯不往往而為處白虎加味以其脈之滑數為陽盛故也服此病當解未服而反以陰虛為辭藥則元參麥冬生地石斛於是熱益壯神漸昏至初八日又迫丈命再往診之則潮熱已作手肢習習風動疑其病已入腑按其腹堅滿實硬具詢其僕已十日不更衣而脈見沉數尚非燥屎而何治之以承氣湯或尚可轉危為安乃夫己氏歸以其神昏遂投犀角且曰伯仁由我死可矣何必有人相助耶自是聞暹犀外再加珠黃二物及初十日遣伻往省則神益昏口遂噤表熱轉微風動反靜而知其不能生矣嗟乎仲景之法亡而溫病無生理誰知其舍館之定即伏死機哉其實此等病不過失用苦寒藥耳病在陽明利用苦寒不利甘寒者也苦寒為清甘寒為滋自世人以麥地輩之滋法認作清法而宜清之治於是乎失傳矣𢘅階精於六書之學又長於詩拙稿亦承評泊前月上瀚會得其贈詩一律有故山西北雁云邊之句今雁云尚杳人琴已亡有太息不置已爾今歲暑氣早來惟餐衛珍重是禱修於是年之夏以葛根芩連白虎承氣活不相識者十餘人而故友如𢘅階曾不得進一匙命矣夫答鄭仲協問內經刺法本病二篇論疫素問刺法論本病論二篇原在六元正紀篇後專為內經論疫之文不知何代為人竊出私傳不入正本此明馬氏仲化之說故林億等校正王氏本及所見全元起本皆無之而疫之一字反不見於內經遂令後之人不識何病是疫而輒以傷寒中之溫熱當之其誤實基於此也漢劉成國釋名一書分為二十七門其第八卷兩門一為釋疾病所載疾病甚夥而獨以疫癘二者列於第一卷釋天並不纂入疾病門內蓋以疫為天行時氣人病不必為時行惟疫則必為時行所以仲景之論傷寒首將時行與非時行兩兩相比以明其於一歲之中長幼之病多相似者乃謂之疫可見東漢以前皆不以疫為疾病之常故專屬諸時行之氣且必歸之於天而不僅言之於人病中也是氣也唐以前謂之疫宋以後謂之瘟至明而通稱瘟疫且以溫熱病通作瘟疫自此而並溫與瘟之字亦不復能辨矣內經無瘟字但有溫字然其字則一其病則異如生氣通天論冬傷於寒春必病溫金匱真言論冬不藏精春必病溫此兩溫字與評熱論有病溫者熱病論凡病傷寒而成溫者皆言溫熱之溫至六元正紀大論辰戌紀初之氣民乃厲溫病乃作卯酉紀二之氣厲大至終之氣其病溫寅申紀初之氣溫病乃起丑未紀二之氣其病溫厲盛行遠近咸若子午紀五之氣其病溫己亥紀終之氣其病溫厲則厲即癘字溫即瘟字而其病則為疫說文解字疫民皆病也一切經音義人病相注曰疫此不可見民不皆病病不相注者即不是天行之瘟疫而但為尋常溫熱病乎自後世大著作家皆於傷寒外動稱瘟疫皆不識何病是溫熱實皆不識何病是瘟疫則欲其識得溫熱病必先令其識得瘟疫病今考此二篇所說五疫之至皆相染易無問大小病狀相似正與六元紀之遠近咸若仲景之長幼多相似者一一可以互證使人知如是者方是疫乃可以知不如是即不是疫然後溫病熱病必當求諸傷寒論中者益於此而可見此內經遺篇刺法本病二論所以亦不可廢也斯二者馬仲化取而注之高士宗亦為之注吳鶴皋則棄而不取吳意以為近於誕也而不知疫之為病所不同於尋常溫熱者正賴有此二篇以明之也足下以疫為問而意實在於欲明溫熱故謹復如此與徐丈冶伯論種子書丈以七十生兒作詩志喜適文孫先舉一雄遂得曾孫讓乳乳叔祖句誇示同人詩為佳句事亦佳話也前年坎離丸之獻丈曾以不事溫腎為嫌今果以此育麟則其效居然可睹不當為丈細剖之併為世之求子而信服辛熱者告乎世傳種子方多矣類皆彙集大辛大熱佐以固澀之品作助陽說者不知釜底添薪適以煎熬津液即有子亦多不壽此丹溪所以有秦桂之誡也凡求子者每在中年以後而內經明言人年四十而陰氣自半也起居衰矣則其衰也明在陰而不在陽以陰之衰而助其陽陽得助者陰益衰矣試問中年後人當補陰乎當補陽乎而況其在老人乎經又云人年老而無子者何也岐伯曰丈夫二八腎氣盛天癸至故有子七八腎氣衰天癸竭故無子經又云年已老而有子者何也岐伯曰此其氣脈常通腎氣又有餘故身年壽而能有子由此觀之天癸者壬癸之水天一之真水也腎者主水腎氣之盛腎水之不虧也水虧則氣脈不流利然則年老而無子者將補水乎抑補火乎而年七十之居然生子不即可推而知乎丈右手常顫右脈長垂尺澤凡六部之脈以左尺之水生左關木左關之木生左寸火即以左寸回應右尺之火生右關土右關之土生右寸金而金又下生左尺之水循環無端生生不已丈之右尺脈其大倍於左尺非火有餘而水不足乎是不當壯水之主以制陽光如王太僕之所言乎曾記上年服藥逾月復診得兩尺均調是即水火之既濟也只論老年治法亦不當如是耶坎離丸者山右閻誠齊觀察取作種子第一方最易最簡最為無弊若尊生八箋云云皆道家言正無足取袁了凡曰天地生物必有氤氳之時萬物化生必有樂育之候此易理所以通於醫也楓江漁父圖冊勉成七古一章適兒子潤庠自郡來省命其繕寫並大著粵遊草奉還湯餅之會期在何日當一詣南溪草堂飫領麈教也坎離丸為紅棗黑豆等分紅棗色赤入心取其肉厚者蒸熟去皮核黑豆色黑入腎即大黑豆非馬料豆也不落水手搓之令皮亮用桑椹汁浸透亦於飯鍋蒸之蒸熟再浸再蒸二味合搗數千杵令如泥糊為丸或印成餅隨宜服食亦能烏鬚髮壯筋骨以此種玉其胎自固而子亦多壽壬午夏曾以此方貢于徐侍郎頌閣入之便見驗方中世之專事補陽而用硫附輩者慎不可從如果陽道不舉不能堅久精薄無子還是鹿茸尚為血肉有情之品然亦須同二冬二地及黃柏一味大補其陰則男婦皆可服也此亦誠齊之說也七答客問於余曰子言陽明定為實熱然傷寒論有曰胃中虛冷者攻其熱必噦則陽明亦有虛熱且有虛冷虛之與實冷之與熱明明相反其有說乎余曰此尤氏在涇嘗言之矣陽明以有燥屎為實熱故以無燥屎為虛熱虛蓋指屎之未定成硬言此熱本不可攻攻之必殆本句當重讀攻字也傷寒者寒水之邪故內經熱病必曰傷寒蓋從其病變言之則曰熱從其病本言之則曰寒凡傷寒論中寒字有時須作熱字看冷字亦然故曰表有熱里有寒里有寒者里有熱也又曰胸有寒胸有寒者胸有熱也陽明之為病胃家實也宋本作胃家寒千金於病到陽明不曰胃家實而曰中有寒中有寒者中有熱也寒邪至陽明而成熱故於陽明言寒即是言熱否則仲景胡為而主以白虎耶後人於表有熱里有寒白虎湯主之句必改之曰表有熱里有熱或又改之曰表有寒里有熱以就白虎之治是皆未明斯義者也其實不必改也凡陽明之就寒水言者即是傷寒成溫之始尚在胃未成實之前仲景特於此申明屎未硬不可攻故曰攻其熱必噦所以然者胃中虛冷故也是明言冷即熱也又曰胃中虛冷而飲之水即噦是明言冷即水也豈真胃中有與實對待之虛胃中有與熱對待之冷乎余始亦疑之讀書十年乃悟此理客問於余曰病之有結其在成注太陽病脈證並治法第七篇言之最詳不知何以結之一字至今日而寂無聞焉不幾疑病之本無所謂結乎余曰此正因乎時尚以為無病不虛虛宜補結宜解解結之藥適與補反有大不利於所謂虛者故欲潛廢其解之法遂若惡聞此結之名而凡傷寒論中所有心下支結心中結痛少腹急結熱結在裡熱結膀胱熱入血室其血必結又有陽微結陰微結臟結無陽證冷結在膀胱關元而且言結胸者如胸脅滿微結水結在胸脅寒實結胸小結胸正在心下利止必作結胸與夫如結胸狀不結胸反不結胸者皆置弗道豈知結之為病所關甚大病之為滿為悶為痞為閉為熱淤為寒凝者總以解結為治而與補澀滋膩適相背而更相遠蓋以結為病之實非病之虛當夫病之未去直無一不涉於結者奈何令病家絶不知病之有結且不知結之宜解遂不知結一解而病無不去而徒畏虛喜補使邪氣之盛者卒至於精氣之奪也至於內經之言結曰結陽者腫結陰者便血又曰二陽結謂之消三陽結謂之隔三陰結謂之水一陰一陽結謂之喉痹此更結之大者尋常病中或不多見耳客問於余曰病之有衄是去病乎是加病乎仲景何以不出方也陽明病口燥但欲漱水不咽此必衄口既欲漱水矣何以又不欲咽不欲咽者水耳何以知其必衄余曰傷寒論此一條與金匱同舊注均無的解夫漱之與咽相去幾何能漱而不能咽必有其故且以其口之不欲咽即知其鼻之將有衄又必有故余以為人於口鼻兩竅有不能一時俱閉者初之欲漱為口燥也繼之不欲咽為竅閉也漱未必閉其口而咽則口必閉人之將衄其血已壅於鼻若咽則水又將壅其口此必其鼻之先有所壅而致其口之不能再壅因即其口之不能再壅而知其鼻之先有所壅此時也口之燥在欲漱上看出但欲漱在不欲咽上看出鼻之衄即在口燥上看出而惟能預料其將衄者乃能知其但欲漱而又不欲咽故曰此必衄也熱盛於經必動其血血見於衄其熱隨解仲景之意微矣而病家見衄必責醫家溫散之非醫者見衄亦不知正是溫散之效不讀仲景書不知仲景有衄乃解三字而且以為病變也是可笑也客問於余曰汗法宜麻黃下法宜大黃二法俱峻宜用汗下者固不可少而汗多可以亡陽下多可以亡陰此仲景所以有誤汗誤下之大禁乎余曰仲景時之誤汗非麻黃也仲景時之誤下非大黃也叔和序例曰神丹胡可以妄發甘遂胡可以妄攻外臺原注云神丹者崔氏六味丸用硃砂烏附半夏參苓蜜丸薑湯下甘遂者水導飲也用甘遂白芷搗篩水服大抵彼時習用之物三日內必皆發便用神丹三日外必皆攻便用甘遂謂神丹以治虛寒甘遂以治實熱也按傷寒論中一則曰醫以丸藥下之再則曰醫以丸藥大下之劉河間曰古所稱傷寒熱病用銀粉巴豆下之許學士曰丸藥是巴豆小丸子強迫溏糞而下王朴莊公亦曰如深師夬豉丸之類皆用甘遂巴豆等藥所謂大下也況更有燒針令其汗及以火熏之以水潠之灌之其誤多端仲景之用芩連石膏也所以救烏附之誤也仲景之用梔子柏皮也所以救巴豆之誤也故知誤汗非麻黃誤下非大黃而麻黃大黃用失其當亦為誤特未可恐其誤而廢麻黃恐其誤而廢大黃如今日之失汗而又失下耳夫失汗失下弊亦同於誤汗誤下且或有甚於誤汗誤下者病家安能知病之既作舍此汗下兩法別無可以去病者哉又焉知病之不去只此失汗失下直可以此殞其生哉客問於余曰仲景於汗下外又有吐法汗下之不可失固已若病而欲使之吐恐更有難焉者故吐法久廢吐其可終廢乎余曰仲景之吐亦非今之所謂吐也今以欲令人吐認作欲令人嘔宜其難矣不知仲景吐法是吐痰也當時謂痰為飲而飲之原出於水飲之名亦為寒且謂之冷仲景吐法一則瓜蒂再則梔豉於瓜蒂證謂胸有寒者當吐之以痰在膈上也於梔豉證謂病人舊微溏者不可與以痰在膈下也已在下則不可復令上越也論中凡言心下有水氣水結在胸脅水漬入胃必作利冷結在膀胱關元者皆言飲即皆言痰此意惟喻嘉言知之惜嘉言但說痰不說水遂來汪苓友之譏蓋苓友又不識痰之即為水耳夫痰結於中既不在表故不宜汗又不在腑故不宜下然則痰惟貴吐仲景吐法謂非吐痰而何後人既不知言寒者即是水言水者即是痰而又誤以古之言吐謂為欲令人嘔此吐法之所由終廢也知此而痰之既不在表又不在腑者舍吐其何法乎吐之法不屬之痰而誰屬乎余故知仲景之半夏生薑茯苓皆吐法也吐不定在瓜蒂也即後世之萊蔔子白芥子輩亦吐法也吐法實未嘗廢也客問於余曰吐不必定為瓜蒂則汗亦不必定為桂麻此外表藥正復不少而何以失表者如此其多也余曰世無所謂表藥也藥借病用者也有表證而凡可用以解表者皆得稱為表藥荊芥防風以其能散風寒也而謂之表藥羌活獨活以其能追遊風搜伏風且能以風勝濕也而謂之表藥升麻柴葛以其能升清陽起陰氣也藁本蔓荊以巔頂之上惟風可到也而謂之表藥他若香薷清暑氣藿香逐穢氣白芷除眉稜骨痛川芎秦艽能入血而活絡與夫紫蘇葉之祛寒薄荷桑葉之泄熱是皆可以解表故皆名為表藥豈得以不可發汗一語而廢麻黃者因而盡廢之哉況以芩連石膏滌經熱而表解大黃芒硝撤腑熱而表解則白虎承氣即是表藥更有陽虛不能解表而以人參附子作其汗陰虛不能解表而以人參歸地化其汗則參附歸地亦皆解表藥矣此即余所謂藥借病用之說所以麻黃髮表而入之定喘方中即不汗柴胡達表而入之疏肝調經劑中即與表分無涉皆此理也人惟於荊防以下皆謂為表藥而於無表證者不敢用且於有表證者亦不敢用病其庸有豸乎客問於余曰世以養正邪自除邪去正乃安二句謂是養其正則其邪去而其正安然則凡有邪者養正顧不重歟余曰句中一自字一乃字非虛設也夫病豈有純虛無邪者因其正之虛而邪干之如所見之邪果由正虛不達則宜清金宜建中宜安神宜滋水涵木宜壯水之主益火之原惟此補之一法徹乎始終喘亦補脹亦補滿亦補多痰亦補食不化亦補五臟六腑十二經無往而不用其補者何也補其正始足以敵其邪凡在正虛而邪不達者若再用逐邪之藥則邪不除而正益傷惟不事逐邪而專力於補補力既足邪自然去故曰養正邪自除也此乃虛不達邪之證反是則不名為虛而名為實實者邪也是為當去之邪何謂當去蓋以有邪不去即未有不傷其正者故宜消則消宜散則散宜攻則攻宜伐則伐以消散攻伐者去其邪始足以保其虛若既有邪在而徒畏虛喜補補虛則不足留邪則有餘即不議補而當消散不消散當攻伐不攻伐邪一日不去則正一日不安故曰邪去正乃安也自字宜輕讀乃字宜重讀也斯二者如霄淵之相隔若冰炭之懸殊夫豈得於邪方盛時輒以養正為言哉余於朋舊周咨諸生問難時有裁答久不省為誰發而與青浦胡生紫瑜嘉定印生雪鴻言者居多胡生從遊於梨川印生同客於漢上相處最長其質難亦不僅止於是會稽沈生少牧録余舊論亦最多匯此七章聊記一時晤對云爾
