body:
  text: 卷八文八真中風論附痹痿厥風痹痿厥四病內經各有專篇而風之為病也尤多傷寒論之中風即今所謂傷風如經言風寒客於人皮膚泄則灑然寒閉則熱而悶者是也此與金匱風之為病當半身不遂脈微而數者不同金匱之言中經中腑中臟者則經所謂風氣入通於肝及所謂諸暴強直皆屬於風諸風眩掉皆屬於肝此則真中風也善解此證莫如河間河間謂此多由熱甚兼燥而熱為主心火暴甚腎不能制則陽實而熱鬱甚則心神昏冒猝倒無知皆以熱甚故也此河間主火之説也至東垣則以氣言氣因火鬱也丹溪則以痰言痰因火結也二子者雖一主氣一主痰實皆主火而亦皆為通論蓋人身無內風不招外風無內火不起內風風由於火火又生風風火交煽風為標而火為本苟得內火之降則內風熄苟得內風之定則外風除然則欲去風於外者安得不先去火於內耶繆仲醇曰休治風休治燥治得火時風燥了知其要矣喻嘉言宗之制祛風至寶膏用藥二十六味煉蜜為丸如彈子大每服一丸方以清火為主佐以祛風蓋清火以治病本而祛風以治其標若陰已傷加以和陰陳修園載諸金匱中風門注極表章之皆所以治真中風也若夫金匱血痹虛勞門中方則專以治非風之證斷非可以治真中風者自夫人以虛勞之病概作中風而不問張介賓之所謂非風又因介賓有非風之説而從其説者又將真中風之病概目之為非風想當介賓時必以非風為辨而當今之世則又必以非非風為辨果遇非風自當從非風治若非非風則仍當從風治而治風之要尤在清火火之不降風必不除洄溪醫案首章即是治風正軌凡病皆有兩端焉得歸於一致而於此病則既當辨其是非尤當辨其非非庶真中風者不盡死於非風之説也彼病之近於風者又有痹痹病亦多由於熱其風氣勝為行痹風陽邪也本熱也濕氣勝為著痹濕上甚為熱也寒氣勝為痛痹寒閉而為熱也即喉痹亦多熱證非虛證皆非血痹門中之所謂虛勞者至於痿則更為熱經屢言肺熱葉焦而肝心脾腎之熱皆能致之非獨骨痿之生於大熱也經又謂治痿獨取陽明石膏為陽明主藥言取陽明則所取之為石膏不待言矣至於厥則有寒厥有熱厥其為寒厥固多而熱厥亦不少余所見除一二虛勞外無非熱厥治皆從仲景厥應下之之法以余所值為燥火之運故人病多屬燥火若在寒濕濕寒運中當不如是今之燥火尚有四十年以後值寒濕六十年過此以往又值風火火燥者百二十年他時運氣轉移自有明者應運而生余則就今言今可矣釋飲痰飲之名始於仲景詳見金匱第十二篇中有二飲四飲五飲之別二飲者曰留飲曰伏飲僅以病之新久言之留則留而不去伏則伏而不出無所關於治要也四飲者懸飲溢飲支飲痰飲懸謂懸於一處每聚脅下故脅痛溢謂溢於四旁每漬肌膚故膚腫支者如木之有枝或左或右每易上逆故胸膈喘滿而不得臥分言之則飲有三合言之則總為痰飲而亦不外乎留伏之理但水之稀者為飲稠者為痰水得陰凝聚為飲得陽煎熬成痰此則治有殊矣五飲者水在肝脅下支滿故嚏則引痛水在心築築然悸動火與水為仇故不欲飲水在脾脾惡濕故身重水在肺吐涎沫肺不得清肅故渴欲飲水在腎腎本為水臟正不勝邪故臍下悸欲作奔豚此之謂五飲久而不愈而或懸或溢或支之無定者亦皆為留伏而已今夫人身之所貴者水耳天一生水有氣以為之母有胃以為之海故飲入於胃遊溢精氣上輸脾肺下輸膀胱水精四布五經並行何病之有及其水不通調日積月纍轉為淤濁而水飲成焉是故水飲之患未有不起於胃上脘者但有一毫陽氣不到處即為水之所伏留蓋陽得充足則陰氣化為津液以資灌溉而奉生身陽失運行則陰氣即化為水而成病從其初而言則水停於胃流於脅泛於肌膚逆於胸膈此四飲所由來也從其既而言則水由胃而上入陽分漸及於心肺下入陰分漸及於脾肝至腎而劇此五飲所由來也病之初起不外乎風寒外侵肥甘內滯氣機因而不利往往畏風畏寒汗閉溲閉咳逆倚息不得臥甚則膚腫水為陰邪故時而頭目眩暈是水邪怫鬱陽氣不上升非痰火濕熱之謂也時而口乾舌燥是水邪阻遏津液不上潮非陰虛火旺之謂也且水飲之脈必弦或雙弦或單絃其弦之見於右關者象類數亦非數則為熱也其舌必光滑而不立苔此則沮洳之地其草不生亦非陰虛內熱之所謂光如鏡面者也於此求治或開鬼門或潔淨府總宜以導痰滌飲為事隨證酌加他藥而不可遽補雖在高年亦必先通後補即補亦惟參朮薑附是宜若洋參石斛之養胃生熟二地之滋陰麥冬阿膠之保肺兜鈴蛤殼之清金貝母栝蔞輩之滑痰潤燥則皆宜於他人之火燥適相反於此人之水寒患者固不能以病湊也總而言之振胃陽以逐寒水宜汗則汗宜利則利即使久咳肺虛終是水寒在胃故雖行補劑亦惟壯氣以通陽不可益陰而助病仲景小青龍湯及理中湯真武湯輩皆水飲正治之方也今不言飲證廢此數方而反有所謂陰虛痰飲者夫痰飲為陰盛之病乃以陰盛而謂為陰虛則其用藥為何如哉飲證平時服枳朮丸法金匱枳朮湯用枳實七枚術二兩今從張潔古法改湯為丸將二味研末攪令勻另用鍋巴焦青荷葉煮湯糊丸如桐子大次第作為三料第一料用枳四兩術二兩第二料用枳術各三兩第三料用術四兩枳二兩每日食遠後吞服三錢冬月用淡薑湯夏月用藿香湯送久之自然有效按金匱君枳臣術湯以蕩之枳多術少以瀉為主易水君術臣枳丸以緩之術多枳少以補為主至於宜瀉宜補多寡久暫之間則孰君孰臣有此三料病人可自為轉換也此方主治甚多而治心下堅大邊如旋盤者尤驗宿飲除根服控涎丹法此陳無擇三因法也用甘遂大戟白芥子等分末之糊丸如桐子大臨臥薑湯服五七丸至十丸痰盛者量加之凡甘遂若干用甘草四分之一煎湯浸三日湯黑去湯再換清水日浸日淘每日換水數次三日後去心再淘再浸以盆中水無殊色為度取出瀝乾麵裹如團煨至麵糰色黃去面曬乾大戟去旁枝水浸透去皮骨切曬白芥子微炒共為末成丸聽用按甘遂能行經隧之水大戟能泄臟腑之濕白芥子能搜皮裡膜外之痰主治甚多而背寒如掌大一塊者非此不能去之釋燥內經病機十九條獨不言燥喻嘉言作秋燥論初謂十九條內諸氣膹郁諸痿喘嘔皆指燥言繼又似乎十九條內自有諸澀枯涸幹徑皴揭皆屬於燥十二字則將於經文十九條去何條而入此條乎余初譏其杜撰繼乃知此十二字為劉河間傷寒直格中語嘉言以其句似素問故即以為是內經其燥之一證有由風來者則十九條內諸暴強直皆屬於風是也有由濕來者則十九條內諸痙項強皆屬於濕是也風為陽邪久必化燥濕為陰邪久亦化燥並且寒亦化燥熱亦化燥燥必由他病轉屬非必有一起即燥之證內經所以不言燥者正令人於他證中求而得之由是而證以經文及傷寒論各病則凡六經皆有燥證嘉言所制清燥救肺湯一方獨指肺金而言斷不足以概之如人病頭項強直項背強𠘧𠘧脊強而厥腰似折膕如結髀不可以屈則太陽之燥證也頭面動搖缺盆扭痛卒口噤齘齒腳攣急臥不著席輕亦口乾舌苦則陽明之燥證也口眼喎斜手足牽引兩肋拘急半身不遂則少陽之燥證也又若腹痛吐利胸內拘急者則太陰之燥證惡寒倦臥尻以代踵脊以代頭俯而不能仰者則少陰之燥證睪丸上升宗筋下墜少腹裡急陰中拘攣膝脛逆冷者則厥陰之燥證燥必血虛而筋急仲景謂之為痙所以治風用葛根不獨以辛散祛風發汗太過治濕用栝蔞茵陳蒿不獨以香燥逐濕耗竭肝陰意有在也風濕之外凡大筋軟短小筋馳長以及身體煩疼骨節掣痛不能轉側等證多因於寒熱之久亦可在十九條內屬寒屬熱各證求之若以言乎六經之燥則惟陽明一條最為重候蓋以肺固屬金而手足陽明之胃大腸正屬燥金為六氣之一而可獨指肺金為燥哉嘉言惟不識十九條之皆可以求燥證故不知十九條之所以無燥證耳至補出秋燥一層自有卓見不可沒也清燥救肺湯惟人參七分石膏二錢五分尚允甘草一錢桑葉三錢太重其麻仁一錢杏仁七分再加炒黃阿膠八分枇杷葉一片太輕此亦誤以徐之才輕可去實之輕字為分兩之輕耳此方取以治肺家纖小之病正合若燥之大者及胃大腸燥金為病亦用此方其何濟乎老年治法素問五常政大論陰精所奉其人壽陽精所降其人夭蓋以陽能發泄陰能堅凝陽固可貴陰亦未可賤也上古天真論年半百而動作皆衰陰陽應象論年四十而陰氣自半也起居衰矣於此益知垂暮之年陰易虧而陽易強不知何時認作老年多陽虛老年之藥宜補陽而老人則自此危矣昔之言老年治法者宋陳直有養老奉親書元鄒鋐有壽親養老新書明劉宇有安老懷幼書皆不傳於世未知其意云何國朝大醫則惟靈胎徐氏最為善治老人其言曰能長年者必有獨盛之處陽獨盛當顧陰陰獨盛當扶陽然陰盛者十之一二陽盛者十之八九陽太盛者非獨補陰並當清火以保陰乃世為老人立方總以補陽為事熱甚者必生風是召疾也若偶有外感尤當使之速愈老年氣血不甚流利豈堪補住其邪以與氣血為難故治老人感證總與壯年一例或實見虛弱量為補托則當就其陰陽之偏勝而損益使平試察千年之木往往無故自焚陰盡火炎萬物一體斷勿以辛熱助亢陽竭陰氣當耆艾之年而加以焚如之慘也靈胎之論悉合經旨誠能體味其言並會內經陽隔當瀉之意自不致如粗工之敗事矣惟所指老人陽證如頭熱耳鳴面赤目赤膚燥便燥其脈洪者猶人所易見余更推之則凡昔肥今瘦不耐煩勞手足畏冷腰腳痠軟筋絡拘攣健忘不寐口流涎沫涇溲頻數陽痿不舉其脈沉小者皆陰竭而血不充熱甚而水易沸陽蓄於內不達於外此正人所據以為陽虛者尤不可不辨也張文昌詩老去相傳補益方以老年而商補法鄙意以為惟董文敏所傳延壽丹一方最為無弊延壽丹者思翁年登耄耋服此神明不衰鬚髮白而復黑精力耗而復強梁茞林中丞云我朝服此方者亦不乏人咸能臻上壽享康強黃髮變元腰腳轉健真延年卻病之仙方也又云康熙朝有人珍公手録是方字帶行草斷為晚年所書其效尤為可睹余就養以來自處方劑雖不全用此方而取意必本於此今年近七十矣鬚髮未見二毛燈下能書細字未始非不服陽藥之功也録方如下併為各藥注釋焉延壽丹方何首烏七十二兩豨蘞草十六兩菟絲子十六兩杜仲八兩牛膝八兩女貞子八兩霜桑葉八兩忍冬藤四兩生地四兩桑椹膏一斤黑芝麻膏一斤金櫻子膏一斤旱蓮草膏一斤酌加煉熟白蜜搗丸附延壽丹方藥解何首烏白雄赤雌兩藤交互夜合晝疏故以開合為功能治錯雜之病氣味苦辛冬至後採者良用雌雄各半米泔水浸三日竹刀刮去皮切為片每一斤取淘淨黑大豆二升柳木甑上蒸之豆熟取出去豆曬乾換豆再蒸如是九次曬乾為末自第二次至九次將後八味於未為末前各拌蒸一次尤妙豆則始終用之豨蘞草味苦辛氣臊採於五月中者佳感少陽生髮之氣凡熱淤生濕腰腳痠軟者此味有專功溫水洗淨九蒸九曬用酒與蜜灑之灑宜令勻曬乾搗為末菟絲子味辛平當春末夏初絲縈蔓引其實結於季夏得金水之氣腎陽不足者助陽味以化陰腎陰不足者助陰味以化陽米泔水淘淨略曬揀去稗子酒浸一晝夜乘潮研碎微火焙乾再研極細杜仲辛甘而苦味厚功專腎肝溫不助火以其陽中有陰故非偏於陽也竹刀刮去粗皮每斤用蜜三兩塗炙炙至蜜盡為度或用青鹽水浸一宿所貴在絲不可炒枯新瓦上焙乾為末牛膝味苦氣溫懷慶府産者根極長大而柔潤能引諸藥下行凡四肢乏力者不可缺以其善達木火於金水中也亦用青鹽拌之曬乾為末女貞子氣味甘溫一名冬青實子色黑者真凡腎陰虛而有熱者宜之孤陽不生得陰乃能有子理之常也蒸爛攤開盡一日曬乾研末放地上得地氣桑葉氣味苦甘寒經霜者佳能以利血之功獲治風之效下通命門上合心包以升陰中之陽降陽中之陰微火焙乾研末忍冬藤味甘氣微寒藤蔓左纏亦名左纏藤凌冬不調晝開夜合花葉皆佳而藤尤勝能透經脈以息風又通大腸結燥乙庚相生之義也照豨蘞法研末生地黃氣味甘寒稟天一之真陰為和血之上品故能療水不濟火諸病此方只宜生地熟則呆滯矣溫水洗淨加水煮至中心透黑所貴在汁不可濾去桑椹氣味甘寒為益陰妙品故使血氣自通血為水所化益血遂以行水風與血同臟益血即以息風胡麻氣平味甘一名巨勝亦曰脂麻治風先治血血行風自息故風藥中不可少又能益氣力耐寒暑金櫻味酸澀氣平澀可治滑故能治脾泄便溏寢汗入夜溲數旱蓮色黑入腎氣味甘酸平折其苗有汁如墨故名墨汁旱蓮力能益陰故治便血而通涇溲黑大豆亦色黑入腎腎之谷也即肆中所用以發大豆黃卷者井花水洗不可久浸久則發芽不可用矣是丹以赤白首烏七十二兩為君以豨菟各十六兩為臣佐以杜牛女桑則半之忍冬地黃又半之亦合七十二兩而以桑麻櫻蓮四膏各一斤為使水用井華火用桑柴並忌鐵器合而成養陰退熱之功法實本於生氣通天論陰平陽祕精神乃治陽強不能密陰氣乃絶之大旨為此方者真善讀內經者也是方又經吾蘇謝善人家刊入良方集腋中並載白門陳遜齋解組歸田後二十餘年只服此一方於壬子年七十五歲時自八月朔起至明年癸丑重九登雨花臺先友人而上非若向之需人扶掖尚且氣喘心甚異之自言不獨向之不能步履者今且行走如飛且向已鬚髮全白今發全黑而須黑其半矣遜齋固知醫者所以尤信任焉集腋於方後再有加味云陰虛加熟地則此方本為陰虛設已有生地無庸再加熟地況熟地本不治陰虛耶又云陽虛加附子更與方意不類若果以陽虛多濕多痰則此方全不可用豈一加陳半即一變為逐陰乎方中諸藥無非養下虛之元清上盛之熱元參等物悉本方之所包豈加味所能盡此必後人無識畫蛇添足刪之可也婦科經帶論婦人百病與男子同所異者胎産經帶耳胎産之治見於閻氏心法武氏濟陰綱目法已備矣其經帶二者皆水也人惟不知經之為水故治之不得其道夫經豈血之謂乎乃天一之水耳天一之水出自坎宮至陰之精而有至陽之氣其色赤陰中陽也古聖人所以立經水之名者經常也謂常道也以其為壬癸北方之水故又曰天癸世人沿習之久見其色赤類血而即以血視之倘果是血則何不即名為血而必曰水乎且血豈可使之常出而乃曰經乎婦人一有娠即以此水養胎則不月矣一有子即以此水化乳亦不月矣乳湩之色白胞衣中水亦白故皆不可名血年四十九天癸絶所絶者癸水也若是身中之血則經盡而血何以不虧乎女子二七天癸至七七而天癸竭丈夫二八天癸至七八而天癸竭男子亦有天癸尚不知天癸非女子血乎尚不知血之不可以為經乎經水先期者水中火旺也經水後期者火旺水虧也先後無定期者水與火之不調也經欲行而先作痛者水火交戰之象也能治火乃能治水能治水乃能調經而婦人水病往往多見於帶下謂之帶者以帶脈而名也其經年纍月白沃下流者為白帶其脾有濕熱土不治水而色黃者為黃帶有時而為青帶也肝之火鬱而真臟色見也有時而為黑帶也腎之火熾而火極似水反見勝己之色也此二者病不多見獨有帶下色赤似血非血淋漓不斷此則尤為平時濕熱流行帶脈之間人每謂是經血不止斷為血虧罕有知其為赤帶者無他既不知經本是水又不知帶亦是水更不知此為帶之水非經之水故不知宜於利水宜於逐濕清熱而收之斂之滋且膩之逮補澀之久並帶不行反以為不止之經得以收攝而自此遂成臌脹或變為乾血勞者不知凡幾金匱水分血分之界所以不可不嚴否則秦越人何以過邯鄲而為帶下醫耶必能治水乃能治帶必能治帶乃能調經莫謂經帶病微無關生命也生化湯説天曰大生亦曰大化生化湯所由名也生化湯之用莫神於傅徵君青主凡胎前産後徹始徹終總以佛手散芎歸二物為女科要藥生化湯亦佛手加味耳方中炮薑只用四分不過藉以為行氣之用助芎歸桃仁以逐淤生新而甘草補之寒固可消熱亦可去丹溪謂産後宜大補氣血雖有他證以末治之非置他證於不問只是調和氣血為本而他證第從其末耳不善會丹溪大補兩字又不免以大補害人而不知生化湯即是大補徵君加減各有至理後人見方中有炮薑炭遂援其例而乾薑生薑桂附丁萸一概摻入以為産後宜溫又將丹溪所言認作黃耆肉桂之十全大補而用之且將川芎桃仁疑前人之不通而去之於是而生化湯遂多變相直謂生化湯不可用不知所説之不可用者即此變相之生化湯非此但用四分炮薑之生化湯亦非以芎歸桃仁為治之生化湯也靈胎言薑桂芍藥不可用亦是已變之生化湯不可不辨至於胎前之保産無憂散臨産之開交骨散皆仗芎歸皆與生化同功潘偉如中丞所刻産寶一書當與亟齋居士達生篇並傳其於胎産之道得焉矣小兒驚風説小兒之驚風小兒之傷寒也甚則傷寒中之溫病熱病也急驚風是三陽證慢驚風是三陰證驚風之名方中行喻嘉言闢之於前陳飛霞幼幼集成闢之於後又有用莊在田福幼編之法以闢之於今者其書具在然而愈闢愈堅卒莫能去此驚風之名者權在病家而不操於醫家也余謂只要有方治得驚不必問其驚之真不真凡兒病延醫醫來必先告醫以驚而醫漫應之既漫應之則又必以是名何驚為問而於是有天釣驚看地驚馬蹄驚蟹沫驚蝦蟆驚烏鴉驚彎弓驚撒手驚等名實即俯仰怵惕躁擾諸證只風動二字熱極風生四字足以概之而勢有所不得已者則以不如此説病家即以是醫為不識驚並驚之名而不能舉於此而欲不言驚不歷歷有以名其驚也胡可得哉前人闢之不遺餘力然而正言之不如曲從之力奪之不如婉導之余思驚之一字若起居如驚狂言及驚並驚駭驚惕驚悸之類內經及傷寒論亦屢言之何必定言其非即風之既動入陽明嘔入太陰瀉竄入筋中則攣急流入脈絡則反張似與內經諸嘔吐酸暴注下迫皆屬於熱諸熱瞀瘈諸躁狂越皆屬於火者略同亦何必定言其無而徒與不識病之婦女家爭此名哉凡病不外寒熱兩途治亦不越溫清兩法其所謂急驚風者病之熱病之實也宜用清法者也即瀉也其所謂慢驚風者病之寒病之虛也宜用溫法者也即補也其所謂急慢驚風者則不定其為寒熱為虛實也宜用溫清合法者也安知其不當補瀉兼行也再論方治則有項背強𠘧𠘧者仲景用葛根湯有口噤齘齒背反張腳攣急臥不著席者仲景用承氣湯或用葛根芩連湯白虎湯梔子柏皮湯此皆可以治急驚其有瀉利之久為陽不內固者仲景用真武湯有真是厥冷為陽不外衛者仲景用四逆湯白通湯通脈四逆湯吳茱萸湯此皆可以治慢驚既名急驚定須清法既名慢驚定須溫法陳飛霞之沆瀣一氣湯正是急驚時之良劑若莊在田之逐寒蕩驚湯是欲救其病於已成驚之後余之為是言也更欲卻其病於未成驚之先只須認定小兒之驚即是傷寒即是傷寒中之溫病熱病則仲景之方俱是治驚之方而驚且不成即成亦尚可得生夫病家豈有不樂其兒之生者亦苦於習俗之相沿耳則與其力闢驚字必使醫者共明之而難何如姑作驚論即令病家自明之而易乎方中行謂驚即是痙自是確論而嘉言傳至三陰竭力攻之其謬已極飛霞誤搐類搐非搐言亦似是而非其用在田法者復誤施諸未顯裡熱及外有假寒之際則又在平時辨證之明也若腦麝蛇蠍珠黃金石之毒及清宮增液之大不利於病家者亦何必贅言哉説文痙強急也玉篇痙風強病也以此釋驚字最切而有以痙為脹者史遊急就章痿痹脹顏注脹四體強急難用屈伸王氏補注謂脹當作痙是也有以痙為痹者易通卦驗足太陽脈虛人多病筋急痹痛是也又有以痙為痓者六書故人中寒濕發熱惡寒頸項強急身反張如中風狀或掣縱口噤為痓是也自此醫家遂以仲景有汗之柔痙作柔痓無汗之剛痙作剛痓矣周鶴亭太史曰説文無痓字廣韻六至痓惡也與玉篇同痓並訓惡無強急之義總之痙變為痓形之誤也痙變為驚聲之訛也莫謂形聲訓詁無關於病自小學之不講而醫道亦幾於息矣
