body:
  text: 卷十二文十二續蘇談防其說甚矣哉醫道之壞也人謂壞自醫家吾謂壞自病家人謂當責醫家吾謂當責病家蓋醫有不得不然之勢焉實病家迫之使然也一或不然則必見拒於病家即不能苟容於同列即如天下設防之舉蓋惟恐其如此而欲其不如此故貴乎有是防而使防其如此者必不如此耳從未有防其東而東防其西而西防其來者自來防其去者竟去而曰吾以是為防也則弗如其無防矣往聞吾蘇於嘉道年間有所謂防其之醫而竊有異焉客有仿楊君謙松壽堂筆意作續蘇談者紀嘉道間事一則云假如人得寒熱病一二三日未必遽命醫也至四五日而不能不藥矣醫來病家先以一虛字箝其口若惟恐其不以為虛者藥用大豆卷淡豆豉防其留戀增重也此數日間絶不用些微辛散防其虛也不如是不合病家意五六日用生地用石斛立案書防其昏譫不如是而欲以苦寒者去病病家不樂聞也越日而昏沉譫妄矣六七日用犀角羚羊角案則書曰防其肝風動防其熱入心包不如是而欲以攻下者去病病家所大畏也逾時而妄言妄見手肢掣動矣如是者謂之一候一候既過病勢已成然後珠黃散蘇合香丸及至寶丹紫雪丹貴重之物於焉畢集病則舌強言謇目光散亂囊縮遺尿手足厥冷種種惡候相隨而至於是他無可防而獨防其脫矣此等病狀皆在七日以外十三四日之內病家一味防虛十分忙亂親友滿堂或說陽宅不吉或疑陰宅有凶或則召巫或則保福一面按日開方所防皆驗甲乃拉乙乙仍拉甲甲乙復拉丙丁方人人同防亦人人同病至此即有真醫安能將真方真藥希圖挽救於不可必得之數而適陷坎中亦惟有與時俯仰而已是亦病家迫之而使之然韋君繡蕊珠居集亦痛切言之洵乎其為砭時救俗之書也而其所以然者則半由於有所為半由於有所不知其有所為者盡在道不談道四字中其有所不知者則師以傳弟弟又作師師師非度亦由閲歷而來然而病家之愚且有牢不可破者其明日必至之狀皆其昨日預防所及一若此病本有是天然之節奏者病家皆耳熟焉而不知病本可以不若是也薛鶴山曰病家不咎其手法之疏轉贊其眼力之高徐洄溪曰病家方服其眼力之高不知即死於其所用之藥然則康乾中已如此且不起於嘉道之年幸其後有任斯道之君子出而維持之此風得少息矣續蘇談又曰人於其時病經三四日延過一二人越日更醫到即問病幾日矣延幾人矣即知豆豉石斛輩皆用過矣及其更醫者再問亦如前而告以病也何如虛也何如即知犀角輩亦皆用過而病所未劇者口尚能言則知珠粉牛黃尚未用也於是一用牛黃而口遂噤一用珠粉而並不能狂藥之諸惡物全病之諸惡候亦全所剩者生脈散去五味復脈湯去薑桂悉照葉派開方防其虛脫病家更無他望如是者群相告曰時邪好手此豈醫所願哉亦迫於不得已耳續蘇談又曰病以七日為一候十四日為兩候藥而如此則以一候愈藥而如彼則以兩候死試將死於兩候與愈於一候者比當其在一候之前病不大相懸也而一則用藥如彼一則用藥如此截然不同不可相形而見乎然凡愈於一候之人必不知病機病勢與延至兩候而死者當其在一候時大略相同而其漸漸不同者每在一候以外況一候而其人既愈也亦斷不知不用此藥則一候外之病機病勢即此愈於一候者如其不愈亦皆得而有之故雖一室兩榻一愈一死亦不過曰一人甚虛故死一人不甚虛故愈至於用藥之絶不相同則一室之親人滿堂之戚友竟無人一問及之者所願此後之病家察其死於兩候間者一路用何等藥察其愈於一候間者一路用何等藥勿認作一候之病輕故愈兩候之病重故死也其所由死只死於一虛字箝醫之口迫之而使出於一途互相遷就此其權實在病家不在醫家使病家而肯不以實作虛也則醫自能於病實處曲折求之而何必以一虛字了之哉余故曰所以成此一道同風者毋徒責醫為也論過橋麻黃吾蘇有所謂過橋麻黃者於淡豆豉之旁書麻黃三分同搗云是避重就輕之法往者吾蘇老醫馬元儀以方書麻黃每為病家疑懼維時病家恆向醫家取藥故元儀得預用麻黃湯浸豆發芽凡遇傷寒無汗應用麻黃者即以湯浸之豆卷畀之殆其後則取藥於肆更無麻黃湯浸之豆卷矣豆卷治濕痹證僅一見於金匱薯蕷湯入之氣血並補方中用以宣腎初不聞其發表也若豆卷而能發表則以黃豆芽作盤中飧者不且一頓飯而汗出如浴乎或又曰惟其豆卷未必發表所以改用豆豉又因江西豆豉雖稱麻黃蒸窨正恐未必果然所以再用麻黃同搗書於其旁使人不覺亦猶是元儀之意而美其名曰過橋過橋者吳門市上有過橋面方名即仿乎此夫麻黃為一方君藥而君藥之麻黃本不過三分之數即依仲景之法亦不過七分而止豈一經旁寫便不是君藥乎遇無汗之傷寒則不論正寫旁寫皆為對證若有汗之中風汗多之溫熱則麻黃正在禁例不因旁寫而減成也藥雖旁寫下咽則同今之用麻黃於應用葛根時本與元儀之治傷寒無汗者相反豈在過橋不過橋哉奇在病家果以旁寫之故更不問病之可發汗不可發汗直認作過橋面而大啖之也葛根之不敢用而獨敢用麻黃耶論假石膏吾蘇又有所謂假石膏者夫石膏而何以云假也藥有寒熱溫涼溫與熱異初非當用溫者可概用熱藥也涼與寒殊亦非當用寒者可但用涼藥也所以甘寒之品不可以代辛寒更不可以代苦寒辛則能散能潤苦則能泄能降甘則緩而且滿中惟石膏具辛甘寒之性用石膏者用其辛亦用其寒且用其淡石膏之甘謂其淡也豈與凡為甘者之甜同其用哉今乃以宜用石膏之病輒以不足發表之豆豉與滋膩陰寒之生地二味同搗名曰黑膏即於二味外再加石斛一味其意蓋因豆豉之與生地本有膏名而石斛又有一石字在上遂美其名曰假石膏是亦明知此時之當用石膏矣奈病家畏真而喜假於是乎假石膏行而真石膏遂廢不知石斛但有甘而無辛專補虛勞羸瘦與溫熱病全無干涉石之名同石之用異也此時再禁芩連則又失其苦寒泄降之道寒雖同而甘與苦相反豈有相反者而可謂之相同哉況此時惟有苦寒足以去病而甘寒適以留病一去一留病亦於是乎相反夫病之去留即人之所由以生死豈有生與死之相反而亦可謂之相同者此所以必用真石膏不得用假石膏真則生而假則死試問石膏之用宜真乎宜假乎合之所禁芩連凡可以苦寒生者亦莫不以甘寒死惟病家未識異同之故有如是之不可通融者故似不妨以假為真耳然則生地石斛將始終不可用乎則又非也當夫芩連石膏兩三劑後熱退身涼神清脈靜得此八字佳境已出死關而津虧液傷元陰尚難遽復稀粥爛飯胃納始得微開即以生地養陰石斛養胃徐徐而作善後之圖亦為要藥只是遲早先後間則有確乎其不可易者且夫病家之喜甘寒而惡苦寒何哉改習聞苦寒伐胃甘寒益腎故也然而內經所言久而增氣乃指久服黃連反兼火化者言非指一二劑治病之黃連也此時熱邪在胃正賴苦寒之能伐胃者安其胃即以堅其腎所以經又曰腎欲堅急食苦以堅之又曰水位之下其補以苦苦亦補也苦豈獨主瀉乎乃今之補惟有甘寒一若甘寒外皆瀉藥則經又曰少陰之主其瀉以甘少陰之客以甘瀉之彼以甘補少陰乃正用少陰之瀉藥使其少陰而真有待於補者則反因其誤以為補而日從事於瀉矣明者但曰愈補愈虛而不明言其故然不若將此義昌言之庶幾愈補愈虛之理俾病家鹹得曉然也既而假石膏外又有假黑膏矣以豆豉與生地同搗為真黑膏以豆豉與石斛同搗為假黑膏石斛之用提早一日而所防之變亦早一日其所以要早一日者買藥回家時可將二味一較量之看其異在何處即得之矣論黑膏不全方吾蘇方藥之有黑膏亦已久矣黑膏之始共為五物以豬膚與生地豆豉同搗載在外臺祕要以治陽毒發斑者也夫病至發斑而為陽毒則津枯液涸陰無以化毒熾而斑不消危殆已極故必君豬膚生地汁以滋陰而潤膚臣豆豉蒸發而達邪佐雄黃麝香消斑而解毒此方之所以必有五物也乃因醫宗必讀正書豆豉二物而以豬膚三物列入制度中低一格書之人遂但見正書之二物不見並列之三物仍名之曰黑膏初不問原膏之名特為豬膚而設以救溫熱末傳之病今乃用之於病初起時此時發表清裡為法正多病亦未甚危篤其去陽毒發斑安危遠甚亦何取於此義而為之乎余謂藥本借病以為功惟其無是病而用是藥必不應所以非是病而用是藥亦不靈所以有是病而無是藥且不生今病之死於諸藥者非諸藥之即能死人也且當其用諸藥時亦未始不以為能愈人也然病家但見諸藥之不曾愈病安知此病之本不用此藥乎故當病隨藥變人謂其死於所用之藥我謂其死於所不用之藥昨日之豆豉生地昨日不曾用藥也今日之生地石斛今日不曾用藥也豆豉生地石斛之日正是急於用藥之日溫熱之病不是可以勿藥之病是日之急急延醫者非欲是日之急急用藥乎乃昨日無藥今日無藥病則不及待也如之何其不昏譫不厥不脫而凡所防之皆驗哉自此更醫至再皆出一途匯所不可用之藥排日而進而獨於必當用之藥一味不曾到口於此欲病家知病所由死不死於所用之藥而死於所不用之藥者有幾人哉其實所不用之十餘味亦尋常手頭藥耳乃所用者不過彼十餘味而百無一生所不用者不過此十餘味而十有九治一彼一此一轉移間事耳而生死之判如此華他有言治療不明因循至大本從微起浸成巨候種種多狀莫有達者故使愚俗束手受斃仁者見此豈不傷哉元化此言亦賈生長太息之意也夫合論珠黃散蘇合香丸至寶丹紫雪丹余於假石膏假黑膏之別既言之詳矣而吾蘇於溫熱病七日以後又用珠粉牛黃二味此即珠黃散為外科藥也不知何時摻入內科中遂若真是內科藥者吾鄉外科以王洪緒全生集為通行本觀所載梅花點舌丹用珠黃則治瘡癤紅腫者也聖愈丹用珠黃則治楊梅結毒及諸廣瘡者也犀黃丸與當門子同用則治橫痃乳岩等證者也山梨峒丸之犀黃與阿魏同用則治跌僕損傷腫毒危重者也觀諸方柄便知與內科無涉況珠性極重力能下死胎胞衣當陽明病神昏氣窒之時正是熱阻胸膈急須疏達解散之時而可用此重墜之物壓住其欲疏欲達之氣乎或曰石膏之性亦重何以不虞其墜不思石膏用煎僅服其氣珠粉用研並服其質且病家以為物價之昂者必能起死回生一釐也少不得必使無纖屑之或遺姑無論其性若何即此質重而墜之一端已與欲疏欲達之病機大相背戾況此時起死回生正有必需之藥且不索重價乎每當珠粉下咽即噤口不言並狂譫之不作而脈之數疾頓微反喜其狂止而人靜嗟乎狂則自此止矣人則自此靜矣即或此病不死亦多成癡呆不慧之人此正與犀角入肚表邪一陷外反不見有熱病家且喜其表熱之解同一機括也至於牛黃原載本經自有對病之用而東垣之言曰牛黃入肝治筋凡中風入臟者用以入骨追風固可拔毒向外若中經中腑而即用之反能引風入骨如油入面莫之能出然則陽明經腑之溫熱亦若中風之尚未入臟也何苦引之入臟使之動風而案必先書防其風動亦若胃邪並未入心而藥用犀角送邪入心案亦先防其熱入心包耶向聞高麗牛黃丸為牽牛大黃以彼中人喜食牛肉腸胃多厚非此不能消導故日日服之濮生云依問而得實其力能日服者可決其非貴重之牛黃也此則大可取用於當行承氣之日正恐無人肯用耳若夫局方之蘇合香丸所以治傳尸鬼氣局方之至寶丹紫雪丹所以救鍾乳五毒試問陽明經腑之病豈與傳尸勞金石毒等乎匯録三方於下不必置議見者自明蘇合香丸療傳尸骨蒸殗殜疰忤鬼氣瘴瘧痃癖丁腫小兒驚癇大人狐貍蘇合香油安息香丁香木香沉香檀香熏陸香香附烏犀蓽茇訶子硃砂冰片麝香蘇合香即獅子糞熏陸即零陵香至寶丹療難産悶乳胎死腹中胞衣不下中惡氣絶中諸毒中風不語卒中客忤生烏犀尖生玳瑁屑牛黃雄黃硃砂安息香龍腦當門子金箔銀箔紫雪丹療五尸五疰口中生瘡狂易叫走並解蠱毒鬼魅瘴疫卒死黃金一百兩寒水石磁石滑石硝石朴硝石膏羚羊角犀角木香丁香沉香麝香硃砂升麻元參甘草三方主治何等病特因病家不見方柄即不知其所治如彼而認作貴重之品必能愈病耳表而出之俾病家見而知之若見之而仍若不知則終無知之之望矣醫為病家所迫不得已而用之豈可不責病家徒責醫家哉陰虛說吾不解吾蘇之人何陰虛者如此其多藥之宜於滋陰者如此之繁也凡人以病延醫未有不先道其陰虛者而醫亦不得不說陰虛於是滋陰之弊遂固結不可解及問其何者為陰何者為陰虛則病者不知也醫亦不知也夫病之果是陰虛者自當從陰虛治此外則有陰虛即有陽虛有陰虛即有陰盛有陰虛且有陽實陰陽虛實四字明明當有四病豈可舉其一而置三者於不問乎其以陽虛作陰虛以陰盛作陰虛猶或遲之久而方即於危若傷寒溫熱而為陽實之病則陰與陽反實與虛反其四字之盡相反者且不浹旬而死矣蓋人所病者寒也溫也熱也在表宜汗在經宜清入腑宜下當清者再汗則傷應下者徒清無益仲景法不外乎此如法治之只去其寒與溫與熱其人而陰本不虛者無恙也即其人而本屬陰虛者亦無恙也乃不防陽盛傷陰而獨防陰虛邪戀於是防其劫津防其發疹防其風動防其熱入心包至未而防其脫夫既曰劫曰發曰動曰入則自有劫之發之動之入之之物在不去其劫之發之動之入之之物而藥反留邪以劫津引邪以發疹助邪以動風領邪以入心包而同歸於脫防云何哉乃於老人則曰氣血兩虧於小兒則曰小船重載於婦女則曰素體嬌弱一若無人不虛無病不虛而於陽之方盛徒曰存陰陰既不能以些微之藥而存而三五日間陽邪之足以傷陰者方且勢如奔馬涸液枯津是其陰之傷於藥後者不更甚乎夫人有病邪則無論強人弱人壯人羸人皆謂之實經曰邪氣盛則實邪者陽也盛即實也正謂邪之盛者不死於虛死於實也且死於虛者少而死於實者多也嗟乎病為陽實藥則陰虛藥與病反其禍立見為此說者豈不以病家不明虛實故可總名之曰虛病家更不知陰陽故可總名之曰陰虛況陰虛之說已為病家所習聞即為病家所樂道哉此外則如瘧之作陰虛治而成痞痢之作陰虛治而成臌咳嗽之作陰虛治而成痿痰飲之作陰虛治而成腫吐血泄精之作陰虛治而成勞濕阻食滯之作陰虛治而成格凡雜證中或陽虛或陰盛一歸諸陰虛之途而終無不虛者病家之所由深信也若以藥論則經言寒熱溫涼隨其攸利亦明明有四種如小寒之氣調之以溫小熱之氣調之以涼即經言微者調之也大寒之氣平之以熱大熱之氣平之以寒即經言其次平之也病不獨是陰虛藥豈獨尚滋陰總之使病速去陰始不傷去病不速陰即難保用藥滋陰適以助陽陽得藥助傷陰更甚欲保其陰必速去病去病之藥十餘味耳亦甚平常並非險峻有歷驗者非空言也孫蘊苓中翰承鑑曰凡木器得漆則堅固樹非木比若亦連枝帶葉而漆之行見青青之枝葉未有不因一漆而枯者尚以為木之即樹木既因漆而堅樹亦當以漆而固也不亦顛乎夾陰傷寒說夾陰之說天下同之而吾蘇為甚試問陰而曰夾通乎不通天下豈有不可通之說而謂生死系之者此所謂陰其為陰經之陰乎其為陰證之陰乎抑竟以男為陽女為陰乎自夫人惟虛是尚而無奈病者是男其年正壯其形體又充盛則所說氣血兩虧小船重載素體嬌弱之三虛字皆不得出諸口而潛窺其人或當新昏或蓄少艾一有寒熱外感即無不以夾陰為辭不幸病者偏有太陽病之惡寒脈浮弱傷暑脈之弦細芤遲足脛冷灑灑然毛聳厥陰證之熱深厥深而脈沉伏等象為之湊泊於其間適足以實其夾陰之言而病家亦不敢不信或其父兄問之而對曰無之則云不問可也即問亦不肯說吾於脈自有憑蓋即藉此數種之脈與證言之耳黠者又遁而之他改作病前奪精之說則奪字既足聳聽且有夢遺夢泄或並本人亦未驚心而其言更無扦格此所以可作三虛外一條出路也否則如年壯氣盛何徐靈胎曰陰證無發熱之理藥亦無補寒之法乃有以溫熱之邪派作陰證又以夢泄房勞之後而得外感謂為陰證更屬奇談吳又可曰即使房事後得病病適至行房亦不過比人略重到底終是陽證即四逆亦為陽厥劉松峰曰世間原有一種寒疫其人必不發熱也或因過服寒涼所致到其時亦必無身熱周揚俊曰房勞亦有屬陽證者若因曾犯房勞便用溫藥殺人多矣合數說觀之惟有發熱不是陰證惟有陰證必不發熱則世間夾陰傷寒一說直可削而去之以救天下之館甥以全少年之伉儷乃津津樂道者只用桂枝三分謂得夾陰祕法而三分之桂枝尚不見十分之壞象因即以未見壞象之桂枝為據而一切賴以撤熱賴以救陰之要藥悉付一勾轉以箝不言夾陰之口而病家始不以門外目之及其表不解而成為壯熱仍用犀角之涼邪既陷而發為陽厥又用鹿角之溫凡及收日所謂寒熱溫涼皆用過者即此夾陰之說階之厲也而其時病者之婦有因此而貽笑於戚黨者矣有因此而失歡於舅姑者矣且有因此而直以身殉者矣無其事不容置辨即有其事亦不知病之本不因此如靈胎諸人之言者而病家一聞夾陰方且引為己咎一若本是不起之證非醫藥所能為哀哉病家其能知太陽證有惡寒脈弱傷暑證有足冷脈芤遲厥陰證有厥逆而脈沉者皆為外感病應有之事且皆是陽證不是陰證而果為陰證又必無發熱者哉夫病家焉能識病然此數種常見之脈證而一作夾陰則動關生死他即未能悉知此則不可不理會也況其人而果荒淫無度以至於病自當如經所言醉而使內及入房太甚發為筋痿白淫金匱所言臥不時動搖當得血痹虛勞之證者而必不作發熱宜汗之病也又況其所謂夾陰病不可救者但指一次入房而言夫豈有一次之房事而直可以此殞命者信斯言也父母愛之而願為之有室則足以殺其軀而已矣其然豈其然乎脈有力無力說脈之有力無力為實為虛至無定矣凡有力無力而出於醫之手無可疑有力無力而出於醫之口未可信也自陶節庵以有力無力為言而景嶽因之且曰不問其脈之浮沉大小但指下無力重按全無便是陰證又曰脈之妙全在有力無力上分有力者為陽為實為熱無力者為陰為虛為寒節庵言之景嶽喜之後人便之遂無有一審其是非者夫從有力無力上分陰陽猶之可也從有力無力上分寒熱則不可也微獨熱者不定有力寒者不定無力而且熱之甚者亦可無力寒之甚者亦可有力乃以有力即為實無力即為虛統觀一部景嶽全書無不斤斤於此自此說行而欲說是實即云有力欲說是虛即云無力病家於實病言虛或尚有未能盡信者至以脈之有力為無力則萬不能知即萬不能辨於是有以暑證之脈虛身熱為無力者矣有以濕病之脈遲而細為無力者矣且以桂枝證陽浮而陰弱本當無力者謂陰證之無力者矣而於陽明實熱脈之浮大而濡謂為無力尤極相似其可不問浮沉大小而謂之重按全無哉夫脈之既沉必浮按而全無則脈之既浮亦必沉按而全無理也即令病家自將浮脈重按至骨亦未有不真似全無者況並無此能自按脈之病家耶望聞問切切居其末豈可論脈而不論證耶里門某姓一獨子年才冠新昏病傷寒中之溫證表熱不退裡熱已成陽明之脈浮大而促葛根芩連證也熱再盛則白虎承氣證也醫執病在上焦不在中焦之見用辛涼輕劑藥不及病越日更醫方且防其劫津用滋潤之元參麥地謂是養陰退陽或又防其昏厥用瘍科之腦麝珠黃謂是清宮增液藥不中病病不待也未幾大醫來診其脈出語人曰遲矣遲矣脈無力而重按全無明日即防脫矣尚作何等病觀耶病家習聞夾陰之說病適留戀增重悉如所言意本以虛為疑乃大嘆服參耆並進手寫熟地炭生地炭口中則議投薑附臨行誦盲左之言曰雖鞭之長不及馬腹而明日果然
