body:
  text: 卷二文二傷寒有五論一傷寒論之不明於世也久矣昔人謂讀傷寒論當求其所以立法之意余謂讀傷寒論當先求所以命名之意不審其論之何以名傷寒則何怪人之不善用傷寒方哉凡病之為風為寒為溫為熱為濕溫者古皆謂之傷寒乃人知風與寒為傷寒論中病而於溫與熱謂不可用傷寒論中方其意若曰方既出於傷寒論自是治寒方必非治溫法豈有治溫而用治寒方者於是一遇溫熱病無不力闢傷寒方更無人知溫熱之病本隸於傷寒論中而溫熱之方並不在傷寒論外者仲景傷寒論自序云撰用素問九卷八十一難則欲讀傷寒論必先於素問求之素問曰熱病者皆傷寒之類也又曰人之傷於寒也則為病熱又曰人傷於寒而傳為熱何也寒甚則生熱也又曰凡病傷寒而成溫者先夏至日為病溫後夏至日為病暑蓋素問之言熱言病之既仲景之言寒言病之朔比而觀之自知寒之必化為熱而溫之必本於寒其反援素問以駁仲景者固不足與議矣然苟非證之以難經尚不知仲景所以名論之故難經五十八難曰傷寒有幾答曰傷寒有五有中風有傷寒有濕溫有熱病有溫病傷寒者病之總名也下五者病之分證也傷寒為綱其目則五一曰中風二曰傷寒三曰濕溫四曰熱病五曰溫病明說傷寒有五種焉病既來自傷寒是當從病之來路上立論論即從病之來路上命名故仲景傷寒論之傷寒字即難經傷寒有五之傷寒字非二曰傷寒之傷寒字也仲景所以撰用素問難經者如此明乎此而以傷寒論中病一一按之如太陽病發熱汗出惡風脈緩者名曰中風太陽病或已發熱或未發熱必惡寒體痛嘔逆脈陰陽俱緊者名曰傷寒其病皆自傷寒來其為方也如桂枝麻黃之辛溫者皆治之如太陽病關節疼痛而煩脈沉而細者此為濕痹太陽中熱者暍是也其人汗出惡寒身熱而渴也太陽病發熱而渴不惡寒者為溫病其病亦自傷寒來其為方也如葛根之辛涼石膏之辛甘寒黃芩黃連大黃之諸苦寒者皆治之豈不以傷寒之為論固為諸傷寒病設凡傷寒之若風若寒若溫若熱若濕溫五種無不於論中列方既用桂麻治風寒即以葛根輩治溫熱分系其方於傷寒論中而豈獨治五種內惡寒體痛嘔逆脈緊之傷寒一種乎哉慨自沿習之久莫不以仲景傷寒有五之大綱為專治二曰傷寒之一種一若但見論中有桂枝麻黃不見論中有膏黃芩連者夫膏黃芩連豈治寒者哉豈不是治溫治熱者哉乃以論名傷寒即謂仲景不知溫熱則論亦不名中風何不並云仲景不知中風乎古人有言不明五運六氣檢遍方書何濟是惟先識仲景所值氣運為風為火宗族之病死於風寒溫熱濕溫之幾種者居多當時習用崔文行神丹君硃砂而臣烏附佐以半夏人參茯苓使以射罔名曰赤丸以象朱烏七宿者其人初病風寒既不宜於附子其人若病溫熱更不宜於烏頭乃於三日以內便用神丹不識溫熱寒涼四法未可通用所以仲景特用東方蒼龍西方白虎北方元武而獨不用南方之朱雀也然而宋元以來於傷寒論之但用三方竟無能舉其說者宜莫不以傷寒論中方為用溫之祖絶不知傷寒論中方亦為用寒之祖矣夫仲景方為上古聖人相傳之方所謂經方也伊尹歿而仲景出凡伊尹湯液之失傳者膏知之辛寒硝黃之鹹寒芩連柏之苦寒始與薑附桂之辛溫辛熱各標見於傷寒之論奈何人云亦云習焉不察不將難經傷寒有五之文求仲景傷寒論所以命名之意而以為治風寒者可取諸論中治溫熱者必求諸論外故風寒之治得其法而溫熱之治盡失其傳也余以秦越人發幾種之問作五種之對乃知五種之傷寒並隸於傷寒之一論則傷寒論者明是五種傷寒之總論而溫熱之治即在其中前人言之而未詳猶待後人申之而大白也快哉余讀仲景書如桶底脫矣傷寒有五論二王叔和搜採仲景舊論録其對病真方以防世急而作序例舊論者即此五種之論也對病者對此五種之病也五者之說徐靈胎言之於難經經釋呂𣗪村言之於傷寒尋源若程郊倩之二十五葉非不欲明此意而牛鬼蛇神陷入魔障無足深論獨其於傷寒所致太陽病痙濕暍與傷寒相似條下釋之曰上傷寒字指傷寒論一書下傷寒字指寒傷營一證則其言抑何精也再有雙行自注傷寒猶寧國嘉興之有府傷寒病猶寧國嘉興之有縣寧國之蘭陵涇縣亦稱寧國嘉興之平湖秀水亦稱嘉興以其府屬之同也只此數言罕譬而喻頗足解頤亦何必作此二十五葉之天魔舞哉彼徽産也故言皖浙我是吳儂但知吳地吳之有江寧府亦有江寧縣也江寧縣即傷寒論之傷寒也其上元六縣則傷寒論之風也溫也熱也濕溫也而上元諸縣人均得稱江寧人者不言縣而言府也以此明風寒溫熱之皆名傷寒而傷寒之五種不亦同於江寧之七縣哉推而論之則如鍾鏞之皆可名鍾鼎鼐之皆可名鼎尊罍之皆可名尊即此類也然猶不若以五金言之一曰金二曰銀三曰銅四曰鐵五曰錫五金之中其一曰金傷寒論非五金之總論耶且不若以五侯言之一曰公二曰侯三曰伯四曰子五曰男五侯之中其二曰侯傷寒論非五候之總論耶能近取譬可以為方惟願五者之復明於世俾人知風寒溫熱之皆在論中論中之方可治風寒亦治溫熱則凡為傷寒方難用之說者可一掃而空矣傷寒有五論三世人之不解溫熱為傷寒者比比然矣豈知世所不解者且不獨在傷寒之溫熱而並不解傷寒之中風於何見之見之於林億等千金方例第八條億以彼時將傷寒中風熱病溫病通曰傷寒為非謂此為今日醫家公患故其於外臺第二卷亦曰臣億案傷寒論傷寒中風自是兩疾今云傷寒中風者非則億之不解傷寒為總名而中風為傷寒之一者顯然矣余所見外臺書為日本醫官尚德以宋本校刊者尚德於是書其眉曰傷寒固並傷寒之中風言億等未達其旨耳林億之言其貽消於東瀛如此余按外臺中風第一條引巢氏病源中風傷寒之狀王燾之意豈不曰中風為傷寒中一狀乎蛛絲鳥篆尚賴有隋唐間人足以取證而億等所言謬已如此又遑論乎其後哉再觀千金方第九卷為傷寒上第十卷為傷寒下所載大青龍湯治中風傷寒陽旦湯栝蔞根湯治傷寒中風參錯言之蓋以其病為傷寒內之中風皆非平列兩證也故其於解肌湯酒膽湯皆云傷寒溫病烏扇豬脂方大棗烏梅方皆云傷寒熱病凡此皆言傷寒內之溫熱意亦猶是後人於此等處俱看作兩證並列則胡不一審其卷第固是傷寒而卷中分系各證正與仲景之以傷寒名論者同其例乎不察乎此則解肌烏扇諸方可不分寒與溫與熱而通治之耶不能瞭然於目所以不能瞭然於心乃余則正以億等之誤解而又得一確據矣吾蘇嘉慶年間顧西疇之孫大田懸一榜於門曰顧大田傷寒大田固通治四時寒熱之病者也而但標傷寒兩字於門可見大田時人尚能知四時寒熱皆名傷寒否則大田豈獨為冬醫而春夏秋無過而問焉者耶傷寒方論一仲景為醫中之聖傷寒論為醫書有方之祖傷寒論以前則神農氏遍味草木著寒溫平熱之性有本草經三卷而不出一方軒轅氏命岐伯俞跗雷公察明堂究息脈咨岐伯作內經巫彭桐君處方餌而僅有數方伊尹以元聖撰用神農本草作為湯液而方不傳春秋時醫和醫緩以醫名而不以方傳扁鵲受長桑君禁方所傳於世者八十一難而其生郭太子見齊桓公午及其為帶下醫顱囟醫耳目痹醫者俱未悉其所以為方也倉公受公乘陽慶禁方所僅存者一二方耳其他如陽劑剛石陰劑柔石者亦未審其何以為方也然則方不肇自仲景用方者不仲景之是求而誰求哉至其後乎仲景者華他中藏經有方六十道而刳腸湔胃刮骨縫腸大異仲景之治雖有方而不恃乎方晉皇甫謐甲乙經專論針刺而無方王叔和脈經但言脈法而無方隋巢元方諸病源候論第載病源而亦無方惟李唐之初孫真人王刺史出而以其方重之曰千金珍之曰祕要是皆足以考仲景方者此千金方翼外臺祕要兩書所以亦不可不讀也今人常見之病一一為仲景常言之病並非古人別有古病而今病為古人所不識也病即其病而謂獨不可用其方者何歟傷寒方論二一部傷寒論只有三種方一曰辛散桂麻諸方是也一曰寒瀉膏黃諸方是也一曰溫補薑附諸方是也升葛柴辛統於桂麻芩連梔柏統於膏黃吳萸蜀椒統於薑附薑附桂麻為溫法膏與黃為清法桂枝之與石膏芩連之與乾薑附子之與大黃為溫清合法補則用人參者十八方亦分三種以為治而皆補陰氣不是補陽試觀仲景補法一則甘草再則棗草輕則白芍棗草重則人參棗草此數者悉是補陰之品仲景之用補於去病時者如是焉已耳且論中諸方惟桂麻青龍為正治風寒之法此外則皆救逆法也試以桂麻論之太陽有桂枝湯麻黃湯葛根湯大小青龍湯陽明之始亦有桂麻二湯少陽有柴胡桂枝湯太陰有桂枝加大黃湯理中加桂湯亦有桂枝湯少陰有麻附辛甘二湯厥陰有當歸四逆湯蓋皆不離桂麻二味病而僅屬風寒不論傳在何經只須桂麻辛散表邪自無不解不治而病入陽明腑則為實熱不可辛散矣不治而病入太陰臟則為虛寒不可寒瀉矣少厥病之虛寒者同於太陰臟亦宜溫補若少厥病而為實熱仍還陽明腑則應寒瀉蓋桂麻以辛散者祛寒膏黃以撤熱者救陰薑附以辛熱者回陽人參以養陰者退熱病在太陽則用麻桂病在太少則用柴胡病入陽明則用葛根病入少厥則用細辛此仲景之辛散也非寒不瀉芩連膏黃仲景之瀉藥非溫不補萸椒薑附仲景之補藥一百十三方以此數語括之頭頭是道何難用之有傷寒方論三古今之病不外寒熱兩途古今之治不外溫清兩法古於汗病通曰傷寒不知何時浸失此旨遂不審傷寒之論不獨有治寒之方前人於溫熱病禁用傷寒方者只是教人於葛根等病不得仍用桂麻等方而非通指傷寒方言也不知何時又失此旨將傷寒論中方自葛根而下如芩連梔柏之統於膏黃者始則不識其病繼且不解其方因而不用其藥最可笑者韓祗和覺桂枝之難用而謂今昔有不同朱肱龐安常皆謂夏月用麻桂發表須加寒藥否則熱甚斑黃王安道曰近代學者視仲景書欲仗焉而不敢終決欲棄焉則猶以為立法之祖而莫能外甚則待為文具又甚則束之高閣至陳素中特作傷寒辨證且曰人遇溫熱病但以為桂枝麻黃今時難用或以為春夏用桂枝麻黃鬚加石膏黃芩已極可笑而又曰或亦有知用寒涼清解反不敢用桂枝麻黃者則更不知所云矣夫傷寒論豈止桂麻二方用傷寒方者豈必用桂麻二物總由傷寒兩字礙目刺手不能知風寒溫熱皆歸此論溫法清法劈分兩途故有此種種疑難徒貽笑柄吾則以為遇太陽有汗之中風則用桂枝遇太陽無汗之傷寒則用麻黃遇陽明惡熱不惡寒汗多渴飲者則用葛根芩連而已病之有汗無汗惡寒不惡寒渴與不渴能食不能食無一不豫人以可見而更參之以脈合之以時宜溫宜清固有截然不淆者況以醫者當身所值六十年之氣化計之濕寒寒濕之運則以能用桂麻薑附為長風燥二火之運則以能用芩連膏黃為長六六三百六十年宜從溫法者二宜從清法者四即言六氣不過寒熱兩途即言六氣之治亦不過溫清兩法而傷寒論為法具備其斯以為仲景矣乎傷寒去實論天為清虛之府人為虛靈之體不為病也有病則為實寒之邪曰實邪傷於寒曰表實猶曰虛器之中有物焉以實之非強實壯實之謂徐之才十劑中輕可去實即此實字自夫人以體之強壯者為結實以體之不甚者強壯者為不結實遂謂結實者必無病病必由於不結實而將內經實則瀉之及毋實實之訓亦認作結實之實且於臨病人時預懸一強壯之形於心而目中則正見其病態之郎當固無怪天下無當去之實而只有當補之虛即未必定用補虛之方亦決不敢用去實之藥所以徐之才謂病為實彼方謂實則不病孰知之才之所謂實即彼之視以為虛者哉況在病者因實而病彼且謂因病而虛又誰知彼所謂虛即病之所由以實者哉於是而我意中之實為彼口中之虛彼意中之虛即我口中之實實字之不解遂並虛字而亦昧之竟無人知無病為虛虛不為害有病為實實必速去之理而於經所云邪勝則虛之者更不解矣或曰然則補藥何時可用乎余曰除虛證外一則無病一則病後若既有實邪斷不議補於邪實之時試請曾受此害者一回想之可乎即如彼之言曰稟氣旺者雖感重邪其發必輕稟氣弱者即感微邪其發亦重以余所見則稟之弱者隨感隨發其發也輕以其邪亦不能實也稟之厚者感受之久鬱而不發發則必重以其邪亦實之甚也或又曰人之強壯者盡力去邪盡不妨事人之羸弱者即用些少去病之藥亦所不勝此言亦大不然以余所治人果強壯即留病一二日於事無妨而用藥則不可輕若其人而已覺羸弱則去病宜速只多留一二日之病即危而用藥本不必重兩說並存以俟後之覽者一評騭之何如傷寒補虛論邪實於表為表實邪實於裡為裡實余既明古人所說實字即是邪字自不至執體虛之見因而廢邪實之治矣然病固自有虛不達邪者亦豈無法以處之仲景於此固自有補虛法而人又不知耳其法云何始則芍草而已繼則人參芍草而已如麻黃湯白虎湯大青龍湯則以甘草為補也桂枝湯葛根湯黃芩湯四逆散則以芍草為補也柴胡湯理中湯吳茱萸湯則以參草為補也而如瀉心湯四逆湯復脈湯之君甘草者更可見也余故知甘草為仲景之補藥芍草尤仲景之補藥豈必於芍草外另尋補藥乎再以參論則仲景於桂枝證用參而有新加湯矣於芩連證用參而有瀉心湯矣於石膏證用參而有人參白虎湯竹葉石膏湯矣於柴胡證用參而有柴胡湯附子證用參而有附子湯矣更以利止亡血證用參於四逆湯以已極汗下證用參於茯苓四逆湯芍草之助人參焉耳余故知仲景惟以人參為補又豈必另尋補藥於人參外乎別録謂人參功用同於甘草凡在寒溫補瀉之劑皆可相劑以成功國朝徐靈胎亦謂仲景之於人參以補為瀉從無與滋膩之物同入感證中者所以喻嘉言每用三五七分之參於去病方中為獨得仲景法蓋惟嘉言能知仲景之用參一如其用草者則且不必問仲景之何以用參只一問仲景之何以用草而已識仲景於去實之方即有補虛之藥矣以此教人後世猶有謂傷寒無補法者自參之為用失其法而當其去病未聞有一用參者及其病既危篤則非一二三兩之獨參湯必不能回無氣於無何有之鄉乃至此而方用三五七分之參又雜以他藥反見脹滿反見脹滿則曰虛不受補夫補藥所以救虛豈有果虛而不受補者蓋既不善用參於病未危之前又不善用參於病既危之後嗟乎一參而已其於先後多少之間能信任而元惑者有幾人哉傷寒論六經提綱太陽之為病脈浮頭項強痛而惡寒六經提綱皆主氣化六經為標六氣為本太陽之為病寒水之氣為病也寒為病故宜溫散水為病故宜利水篇中凡言太陽病者皆就寒水之病言也陽明之為病胃家實也千金作胃中寒蓋推病本言之也兩陽合明名曰陽明寒水之邪至此成熱即至此成實胃屬燥金其在氣化則燥金病也篇中凡稱陽明病皆有胃家實三字在內提綱以邪實為主而凡所言身熱汗自出不惡寒反惡熱者亦綱也並所言陽明居中萬物所歸無所復傳者亦綱也少陽之為病口苦咽乾目眩也少陽氣化為相火故以相火病為提綱而凡往來寒熱脅痛耳聾咳悸嘔渴但見一證即是相火之病亦皆為少陽之綱篇中凡言少陽病皆仿此太陰之為病腹滿而吐食不下自利益甚時腹自痛若下之必胸下結硬謹案御纂醫宗金鑑謂腹滿下當先有自利二字又謂自利句當在結硬字下否則仲景不當於自利益甚後復言若下之矣千金作食不下下之益甚無自利二字或提綱中本不言自利乎太陰病生於本本者濕土也屬寒者多其有溜入陽明腑而為熱者則已見於陽明篇故太陰篇次獨少也凡篇中言太陰病皆指此提綱言少陰之為病脈微細但欲寐也少陰之上君火主之本陽標陰其病從標為足少陰從本則為手少陰以下利為腎水病而咽痛即君火病也世以少陰咽痛謂為腎病宜溫皆忘卻氣化之為君火況即下利一證亦有從本化而為熱者哉但欲寐是欲寐而不能寐非多眠睡也篇中凡言少陰病皆指此脈證言之厥陰之為病消渴氣上撞心心中疼熱飢而不欲食食即吐蛔下之利不止兩陰交盡名曰厥陰厥陰為標風木為本故厥陰病皆風木之病木中有火標陰而本陽凡厥陰病主以消渴猶太陰病主以腹滿腹滿消渴二端尤為太厥綱中之綱篇中一言厥陰中風兩言厥陰病並此只有四條皆為綱仲景書本為傷寒雜病論六經提綱傷寒如此雜病亦如此舍此則不能治傷寒亦不能治雜病凡六經之分在寒水燥金相火濕土君火風木之六氣不僅為足六經手六經也讀內經者自知之彼謂傳足不傳手者隔膜語耳傷寒論脈法仲景論脈所重浮沉遲數而浮大數動滑沉澀弱弦微以類相從浮沉以位言遲數以至數言浮數陽也而大滑動亦為陽沉遲陰也而澀弱弦微亦為陰叔和辨脈法云陽病見陰脈者死陰病見陽脈者生仲景之平脈以辨證者如此叔和可稱能說仲景之意者矣凡人以不浮不沉不遲不數為經脈反是則為病脈而病脈之中又以脈有胃氣為吉真臟脈見為凶此則真有關於生死者若本文之生死二字則正教人以不使之死而使之生也如病之初為浮大數動滑而其繼也漸見沉澀弱弦微者是陽消陰長之機於病為進病之初為沉澀弱弦微而其繼也漸見浮大數動滑者是陽進陰退之象其病為欲愈此脈之有定者也醫必當體會之如浮為陽而兼見大數滑動之陽脈是重陽也必為陽盛之病當急撤其陽邪沉為陰而兼見澀弱弦微之陰脈是重陰也必為陰盛之病當急破其陰邪且也浮既為陽而浮之中反見澀弱弦微則陰氣上入陽中將有亡陽之變當以扶陽為急沉既為陰而沉之中反見大滑動數則陽邪下陷陰中將有陰竭之虞當以存陰為急此脈之無定者也醫則能轉移之仲景之意蓋謂陽病不可使見陰脈陰病必當使見陽脈耳豈於陽病一見陰脈即曰無可治陰病一見陽脈即曰不必治乎余於是即仲景之脈法以求仲景之治法仲景於太陽病用桂麻者以其脈之浮緩浮緊也緊與緩皆陰脈而治之以辛溫則不死於太陽病用薑附者以其脈之微弱沉微也微與弱亦陰脈而治之以辛熱亦不死仲景於陽明病用膏黃者以其脈之浮大浮長也長與大皆陽脈而苟非治以苦寒則必死仲景於三陰之陰病用薑附者以其脈之沉細於三陰之陽病仍用膏黃者以其脈之浮滑也沉細為陰脈苟非治以辛熱則不生浮滑為陽脈苟非治以苦寒則亦不生是故宜用辛溫時不可早用辛涼宜用辛涼時不可仍用辛溫而於宜辛熱者不得僅用辛溫可知宜苦寒者不得通用甘寒亦可知矣惟其治之有法所以能使陽病不見陰脈能使陰病得見陽脈也此仲景之意惟叔和為能說仲景之意也更以仲景論舌苔觀之經云能合色脈萬舉萬全舌亦色之一也夫病以證為主凡仲景言舌者五舉一白苔而分燥滑即以其舌參觀其證必有證而後有方方以治證非徒以治舌也乃元人杜清碧不以證言徒以舌言繪為三十七圖或廣至一百三十六圖或又減為一百二十圖每色有十餘圖每圖莫不有方並不言此舌之因何證而見一若方即以舌為準而不必更論其證者徒亂人意實無關於治法也
