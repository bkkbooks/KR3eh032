body:
  text: 卷十六文十六下工語屑醫之為道莫要於不使病大不使病大莫要於先分虛實虛實之不分則一錯到底凡為醫者必先論其見地之明昧然後可論其手法之高下果能於病有見到處則動手自有準對即使當時尚未極高明他日必為良醫臨病人於俄頃便處湯劑何敏捷乃爾要惟有定識於平時乃克有定力於片刻醫是講學不是市道故商賈貿遷之術無一書之傳而醫家言則汗牛充棟諺云十個醫十個法此言不然病者只有一個病自當只有一個法案者斷也必能斷乃可云案方者法也必有法乃可云方若非步武前賢安得有此學術書本不載接方以接方之無定也然醫則全在接方上見本領學醫從傷寒論入手始而難既而易從後世分類書入手初若甚易繼則大難矣六經之病以證分於讀書時先明何經作何證則於臨證時方知何證為何經病者不告以我病在何經也故必先讀書而後臨證乃能明體達用六經要分看又要合看總以胸中先有六經之病然後手下乃有六經之治病有必待問而知之者安得以不問為高即如脈以合病而病者之於醫但令切脈夫寒熱表裡此可以脈得之然一脈關數證得此脈矣所病之證仍不能以脈知也故醫者不可以不問病者不可以不說病有本不是一劑藥可愈者用藥亦不必重病有必賴一劑藥建功者用藥則不可輕輕則藥不及病而反滋惑石膏不可鍛鍛則如石灰不可用矣非生者重鍛者輕也大黃生者走後陰熟者但走前陰亦非生者重而熟者輕也承氣法加芒硝以助之是欲其舉重若輕重病以領出死關引入生路為事病在關內朝夕可以有變出得此關病雖未愈無死機矣豈以復舊為愈哉內經無論真不真總是秦漢間書得其片語即是治法傷寒論無問全不全苟能用其法以治今人病即此亦已足矣後學能識病全賴此數書彼以此委諸僞書之列者自矜博雅不自知其與病人為仇也傷寒論注以成無己為最先金匱注以趙以德為最先趙氏名良仁元末長洲人從丹溪學淵源有自皆必讀之書注傷寒論者明時已有五十餘家今則百餘家矣其篇次各不同欲得傷寒論原次必要讀千金翼張劉李朱金元四大家也張謂戴人自李士材以張為仲景而仲景於是卑矣運氣之學壞於馬元素之徒至以某年生人於某日得某病當用某藥為言丹溪所以訶之再有程德齊者作傷寒鈐法以得病日之干支用藥自有此等人而明其大義者轉不肯以此為言此學由是失墜陰陽五行俱主歲運言之凡在氣交之病即不能無干涉角徵宮商羽五太為陽五少為陰十干甲丙戊庚壬為陽年乙丁己辛癸為陰年非泛言陰陽也甲己合而化土乙庚合而化金丙辛合而化水丁壬合而化木戊癸合而化火非泛言五行也不此之務則六元之病本凡自寒水以至風木者即無自而明古人言陽氣為陽而於陽邪亦曰陽言陰氣為陰而於陰邪亦曰陰讀書時安得不於上下文求之周慎齊曰陽氣足則陰氣皆化為血陽氣不及則陰氣即化為火味其言可以明火之所由來余謂陰氣足則陽氣皆化為液陰氣太過則陽氣即化為水亦可識水之所由來陰陽離決謂之脫而陰盛者陽亦脫非必陽虛而脫也陽盛者陰亦脫不是陰虛而脫也治陰治陽此際大有出入桂枝證之脈有陽浮而陰弱者陽謂寸脈陰謂尺脈也言病在上不在下也不可以陰弱指為陰虛凡宜升之陽與宜補之陽異凡宜補之陰與宜滋之陰異故岐伯曰謹熟陰陽無與衆謀可知當日衆口之陰陽已非岐伯所見之陰陽矣凡寒熱表裡虛實皆然內經曰言熱未已寒病復始句下有言寒未已熱病復起之意在不獨說一面也喜熱惡涼者不得援為口實仲景於熱之在表曰翕翕發熱於熱之在裡曰蒸蒸發熱翕翕蒸蒸為表熱裡熱之分即宜汗宜清之別白虎湯解陽明內蒸之熱不是解陽明外見之熱故表熱雖甚而未成裡熱者便不是石膏證太陽病誤下成熱實結胸太陰病誤下成寒實結胸蓋誤下則邪內陷陷則成實但云誤下足以致虛者正不盡然仲景法主於存津液夫人而知之矣然其所以存津液者汗吐下和寒溫之六法皆是也六法中尤以急下存陰為刻不容緩其用滋陰之劑以為可存津液者適與六法俱反故百病無一治陽明主津液所生病病至陽明未有不傷津液者汗多亡陽下多亡陰皆謂亡津液而欲保津液仍在汗下之得其當病之自汗出者是為有汗之病仍須解肌得汗方為去病之汗且必得其去病之汗其汗乃止汗為人身之寶夏日一閉汗即病故經曰暑當與汗皆出勿止凡中暑者無傳變不愈即死霍亂亦然病之用柴胡而汗出者上焦得通津液得下胃氣因和故汗自作耳非柴胡發其汗也升葛亦然即荊防亦然未經汗下而燥者為陽盛致燥之陽明以撤熱為治已經汗下而燥者為奪血致燥之陽明以滋陰為治凡陽明病中滋陰藥之先後宜否以此為準未汗而惡寒者邪盛而表實也已汗而惡寒者邪退而表虛也汗出之後大邪既散不當復有惡寒矣汗後惡寒謂非陽虛而何參附之用即在其時陽虛則自汗陰虛則盜汗然當陽明實熱時正有自汗盜汗者去其蒸熱則汗止正虛邪實邪與正爭則發戰汗出而解正不虛邪不甚邪不與正爭則不戰汗出而解邪正俱衰陰陽自和則不戰不汗出而解汗之有戰有不戰者以此服桂枝湯必當先煩乃汗出而解服柴胡湯必蒸蒸而振卻發熱汗出而解此煩此振亦戰汗也陽明病奄然發狂濈濈然汗出而解亦是戰汗戰而汗出病必解戰而不汗病即加數脈有二非熱盛即虛極遲脈亦有二寒者固遲而陽之郁者亦遲非真遲也氣之不利似乎遲耳舌為心之外候其色當赤而有時白如積粉者白為肺金之色反加心火之上是為侮其所勝當知有火為金鬱者概以苔白為寒一遇火鬱之病何以為辨虛寒之寒亦非概言冷也如曰家寒曰寒素又如膽寒如寒心者豈盡冷之謂乎病有因虛而寒者故亦因熱而實藥之能起死回生者惟有石膏大黃附子人參有此四藥之病一劑可以回春舍此之外則不能病有初中末三傳之分同一證也見諸末傳則危見諸初傳則微非可以初傳所見者便指為末傳之危證醫家言病每日邪在何經病家一聞邪字則便以為祟也乃舍醫而就覡有時而祟果憑之晦淫惑疾此之謂歟病之內陷謂邪陷於內藥不能從外達其病深矣非謂內陷為虛外感內傷莫不以內傷為不足矣然勞倦傷有不足者若飲食傷則有餘者多所以云內傷者明其不因於外感耳非以外感為實內傷為虛也世間郁病最多達發奪泄折皆治郁法也故凡郁無虛證張戴人曰郁之未成其初甚微可呼吸按導而去之若強補而留之留而不去遂成五積此謂病成即難去戴人又曰養生之與去病本自不同今人欲以補劑去病宜乎不效難經手三陽之脈受風寒伏留而不去名厥頭痛非厥陰頭痛之謂病不定在一陰也真頭痛手足青至節古人青清通用謂手足清冷也真心痛手足青至節亦謂手足冷頭汗出乃陽鬱於表非陽虛於上也飲酒而頭汗出者多由血鬱頭汗出而額上偏多者心血之郁也皆屬血熱青腿牙疳牙齦腫腐齒不痛自落兩腿枯瘦青紫皮脫片片如飛日服白馬乳一月效此與喉痹皆屬火燥茯苓一味為治痰主藥痰之本水也茯苓可以行水痰之動濕也茯苓又可行濕附子為北方元武坐鎮水邪力能行水內有久寒者必用附子此所謂寒蓋謂水也故小青龍治陽水真武治陰水目風眼寒見於內經有迎風而下淚者責其有火即心熱則汗腎熱則溲之理蓋風中於目皮毛斂閉郁其經陽遂生裡熱久之則陽並於上安得不熱蒸淚出乎怕日羞明拳毛倒睫亦皆火鬱獨用風藥不兼清火則風益不去世俗所謂傷風者不發熱但有咳嗽清涕鼻塞聲重而已非傷寒論之中風也不發熱故無傳變傷寒論之往來寒熱與瘧相似而不同瘧當病來之前汗出之後動作飲啖如平人有寒熱之往來者不能也周禮秋時有瘧寒疾賈疏惟火沴金此語即是治法太陰為三陰其作三陰瘧者太陰病也當宗補中益氣法圖治丹溪以發於寅申巳亥日者為厥陰瘧發於子午卯酉日者為少陰瘧發於辰戌醜未日者為太陰瘧恐不盡然有病瘧而一日重一日輕者余謂輕日是重病內伏也重日是輕病外達也必至兩日並重乃得逐日遞輕同一嘔也發熱仍惡寒而嘔者屬太陽寒熱往來而嘔者屬少陽不惡寒但惡熱而嘔者屬陽明當分三陽而治之其無寒不熱之嘔則專取諸中焦渴甚而嘔者必以飲水多之故嘔甚而渴者必以津液傷之故先渴後嘔先嘔後渴病異而治不同同一煩躁也太陽之煩躁用青龍陽明之煩躁用白虎少陰之煩躁用真武故所貴乎分經者知其異尤在知其同也傷寒論背微惡寒一用石膏一用附子以口燥渴口中和為辨故病相同者必求其同中之異內經言解㑊者五解音懈㑊音亦皆倦怠病也江應宿以此為即俗名發痧之證故杭堇浦宗伯力辨之余疑金匱所載百合病庶幾近似杭氏又言內經風論怢慓二字全元起本作失味皇甫謐甲乙經亦作解㑊余疑經言食㑊亦為能食反倦之義若史載之所言肺葉焦熱謂之食掛者以此得名則經無此語豈史所見者別有古本歟若史記正義所引支蘭藏亦無他據水濕之病多見於太陰脾水流濕也火燥之病多見於陽明胃火就燥也故曰萬病能將火濕分劈開軒岐無縫鎖麻之證臂不能舉亦有因於濕者與木不同血虛則木必多火氣虛則麻必多濕不獨為治風先治血一證脅痛胃脘痛吞酸吐酸及作疝瘕者皆肝病也亦有因於燥者人每用香燥藥初服小效久則致虛以其耗竭肝陰也魏玉橫作一貫煎治得其要方見冷廬雜識類乎中風者有痰中有食中痰聚於胃則食亦滯甚則喉閉亦因痰塞為多此皆宜於吐法食填太陰名曰食厥下部有脈上部無脈不吐即死腸腹絞痛者尤不可不下此趙養葵之言也趙固以六味丸通治百病者尚作此說益可見治之不獨尚補矣內經勞風一證張介賓謂但以外感之法治之自無不愈見於咳嗽條下以景嶽之喜補者而作是語則喻嘉言之以勞風為夾陰不必再辨泄瀉有開手即宜溫中者與痢不同膀胱不利為癃經曰有癃者一日數十溲此與滯下證數登圊而不能便其理一也故皆無止澀之理淋濁亦然傷寒論清穀之清與清便之清皆作圊字解說文廁清也大徐曰廁古謂之清言汙穢當清除也則清字仍如字讀有因小便不利而用升提者以為若酒注然上竅開則下竅自通耳今有以此法用之於大便閉結者抑何可笑傷寒論用白散法不利進熱粥一杯利不止進冷粥一杯此指巴豆溫下言也今則移此言於大黃方矣試思果以大黃寒下之誤而至利不止尚可食冷粥乎昔人所謂破氣藥者謂導其氣之滯也所謂破血藥者謂解其血之結也氣血一結滯百病叢生故必破之使復流通之常豈謂一用此藥即盡其人之氣血而破之乎苦寒伐胃之說為久服苦寒必傷胃陽者言也若胸膈熱阻恐傷胃陰則苦寒即為保胃要藥甘有淡義非徒以甜為甘也禮記甘受和若甜則不受和矣書稼穡作甘亦言淡故石膏之甘不同於麥地東坡云我有病狀必盡情告醫使其胸中瞭然則疑似不能以惑我求愈病耳豈以困醫為事哉嘗見一書云我最不喜用熱藥夫治熱自當用寒治寒自當用熱用熱用寒自有病在豈有視乎醫家之愛憎者乃至補瀉溫涼病家亦有愛憎皆所不可春溫夏熱豈獨藥之異於治寒哉每見人家於溫熱病亦用重裀覆帳病者則悶極不可耐此大忌也余每勘定是溫熱必先令撤其帷幔病以汗解藥到自然得之即冬月正傷寒亦然乃以春夏之病亦欲以溫覆取汗則大不可病即有宜用寒涼藥者仍禁恣食生冷而如梨汁藕汁西瓜汁又為溫熱病所或需其於甘蔗荸薺輩即有可商俗云老年人知節氣謂其逢節每發病也此實以每交大節皆為寒熱燥濕交替之時此時投藥即當因所見之何病順以去之若一進補劑則適留其所病病轉因此而甚故惟有逢節發病必非議補之時老年人於供膳宜食專味雜則不受其益經云聖人避風如避矢石少壯時不覺也年老而後信之若外無感受內無停滯年雖高病必少按摩一科不講久矣而病有宜之者下至刮痧亦簡便法病在皮裡膜外藥力所難及者宜之景嶽書有刮痧新按小而至於以草取嚏似不足道矣然此法出自內經薑棗具安內攘外之功故桂枝湯重之即單用二物亦為正治醫以其不取諸藥肆故另書以圖便而人遂僅目為加頭藥則非也傷寒論風池風府皆有刺法否則以三指密排在腦後入髮際橫擦之至兩耳旁令皮膚微熱亦足去風喉閉無門下藥以一手橫撮其頸皮一手灌藥即能滲入蓋頸皮從橫里緊喉皮即從豎里寬此法余有所授曾一再試之信例以腦後下針其亦古法之遺歟問疾禮也而最纍病人甚者不可令至病榻之前病加於小愈故病後之謹慎當十倍於病前胃納始有展意切忌多食經曰病熱初愈食肉則復仲景曰損谷則愈宋時有竇材者自稱第三扁鵲贊仲景方用之屢效又極詆仲景但能愈小病竇書不足述余謂此真能識仲景者可見人苟能用仲景法定可使病不大也余於讀書臨證時有所得輒記之纍千百條其已纂入文內者去之又汰其語意有重復者録存什一如上述先昔我宣公嘗集録古今方吾家世守厥緒於讀書有成後皆兼通醫學高曾以前事不可知及曾大母韓太君於余大父少遊贈公年九歲時傷寒斑不出太君親檢方書得藥與證合詢諸醫醫窮於術漫應之卒以此愈事見顧南雅通政所為墓志中少遊公以理學名世亦精於醫嘗客遊河洛所至以醫學見知於當道巨公及道光二年壬午家居值天行時疫曾制一方以活人其證吐瀉腹痛腳麻轉筋一瀉之後大肉暴脫斃者不可勝數維時我蘇大醫如徐炳南曹仁伯諸公僉謂脾主四肢司肌肉今病腳麻肉脫顯然脾病法當補土而參術並投迄無一效先祖曰此屬土敗補土是矣然土之敗也木賊之木之旺也風動之洪範云木曰曲直左氏傳云風淫末疾肢麻為末疾之徵轉筋即曲直之象本歲木運太過風氣流行而後脾土受邪故欲補土必先平肝欲平肝必先定風風定而後以脾藥繼之庶可及救若專補土無近功非救急法然定風之藥如鉤藤天麻輩亦未必能奏效乃取金匱方中蜘蛛散一法以蜘蛛肉桂二物銼為散蓋謂蜘蛛臨風結網長於定風炙焦則微變其寒性而為溫有開散之力佐以肉桂木得桂而枯使風先息而木自平然後以本年運氣應用之藥另制湯液此方一出投無不利徐曹二公奇之登門索方畀之而去由此風行全獲無算及我先人方山府君以經學詞章名於時於大父醫學尤得心傳大旨不狃於習俗之病名以為治而於陰陽寒熱表裡虛實真假辨而得之於藥則先後緩急以其時施之故同一刀圭也而治效獨神東臨某患時邪厥冷已半日許惟心口尚溫灌之以石膏一物厥回汗大出復生有友唐君春舲盛夏畏冷以麻黃三分附子三分甘草一分強之服唐曰七分藥未必能毒我也一服解一裘兩服而重裘皆弛矣沈鼎甫侍郎之外姑劉病傷寒熱象上浮醫進苦寒轉劇獨府君曰此面赤戴陽也投以真武湯熱退然後清之乃愈余師海門袁雪齊先生故府君之門弟子也其兒困於痘醫方雜進犀黃紫雪將殆矣府君施以肉桂一指撮得蘇師乃以桂生名其兒府君所治類如此此第就余所記憶者言之桐城張子畏觀察傳府君謂府君有經世才未為世用儒而醫亦以學問行之即為心術救世之一端洵不誣也余自中年遘難先代藏書盡散獨所藏醫家言有先人手澤者皆攜出何敢謂能讀父書而亦不敢薄斯道為技術誠以一匕之投動關生命非他語言文字僅為一己之得失者比也昔我遠祖士衡既述祖德又作述先一賦余故謹敘如上以寄鑿楹捧硯之感云爾自記治驗兩則余自幼體弱長老恆以未必永年為慮余詩有云爺惜形尪羸娘憐骨瘦削蓋紀實也而以不事滋補故得無恙即有感受停滯總不畏虛留病亦惟達表通里使病速去以保其虛而虛亦不為余害惟自咸豐辛壬間罹難居鄉不耐風寒薄中時有目疾始也紅腫羞明繼而迎風下淚每以金為火沴至於八月有凶此身有如臨卦經云風入系頭則為目風眼寒又云目得血而能視始以祛風繼以養血迄無成效而頻發不已馴至翳障起星看花霧裡見異書而眼不明心竊憂之最後得朴硝桑葉之法擇光明日如法熏洗果漸入雲水光中於是小變其法自歲首以至年尾每晨盥漱時獨用元明粉一物撮於左掌心用水調化而以右手指蘸其清者用擦左右眥不使間斷兩年後非特前證絶不復作並能於燈下觀書紅紙寫字如是者蓋有年矣其故蓋以風之為患必由於火無火必不召風元明粉味鹹微寒能降火且能滌穢眼之所以能清也此方紀載甚多而梁茞林歸田瑣記以朴硝誤作厚朴則一潤一燥大誤病人不可不正且元明粉為朴硝之已升清者用之尤為潔淨終年無間則光明日包在其中亦省切記此余以元明粉取效之一也又其一則余自庚辰就養入都大約以余體不耐北地之燥每旬日不更衣亦無所苦此不近於脾約證乎然以麻仁丸治之效而不速經云燥勝則地干火勝則地固今地道不通如此非獨燥勝直是火勝矣非獨干之謂直是固之謂矣所以潤藥雖行其堅如故且以大腸回薄間阻隔水道則並徑溲不行而腹部之脹滿不可耐甚至不能飲食此則脾家實腐穢當去而不去為害滋大爰仿硝蜜法蜜一兩硝半之而蜜之甘又不利於脾之實遂亦獨用元明粉一味不用大黃且不用檳枳亦得無堅不破無積不摧服此越兩時許宿垢盡化而下此一日中必有一餐飯不如常僅以糜粥養之至第二餐則飲食倍進精神頓爽此即速去病實不使體虛之要道也若遷延坐待真氣一衰則不可為矣由是以思經言水穀入口則胃實而腸虛食下則腸實而胃虛腸胃互為其虛實僅當留水穀三斗五升故平人日再後則不病蓋以魄門為五臟使傳導失職則使道閉塞而不通不通則腸實腸實則胃不得虛不虛則不能受食不益可見人身有以虛為貴者乎上年火燥司天病此者多不獨余也今年已轉濕寒此證遂少而以之治燥則其足以軟堅者正不必為司天囿也余於元明粉兩得其力是不可以不記癸未夏日再余於癸亥仲夏在滬上患溫熱諸惡具備不省人事者幾半月餘子潤庠求治已遍思惟大承氣一服或有生機然持而未敢決也賴吾友胡君渭濱贊成之始獲愈而方中有元明粉上年壬午九月十五日車行道上忽為邪風中傷右手食指越日痛作甚劇臂不得舉自用喻嘉言祛風至寶膏減小其制而方中亦有元明粉接服四劑始漸向愈然且一兩月不能握管若依陳修園一用黃耆五物以血脾虛勞之治治真中風則病當何如余於元明粉頗有緣也不足為外人道也自題張機補傳論後醫也者以仁存心者也焉有醫而可心乎利者余讀後漢書方術傳論漢世之所謂名士者其風流可知矣依倚道藝以就其聲價非所能通物方宏時務也跡其所謂聲價者非即仲景之言孜孜汲汲惟名利之是務歟其為名心也不即以利動歟然則人必不求利者始可以為醫乎夫人不求利胡為乎為醫故醫難得有不求利者必得不求利之人以為醫曠世不逢矣雖然醫於治生之計不能無醫於鹽利之心不可有許魯齊有言學者以治生為急此其間固自有區別也賈公彥謂醫為仁術余故為範書補仲景傳復集句為論表其仁而特重乎釋利兩言客謂所集漢書中語當注出處以便省覽因補綴於此凡言四句邳彤傳論漢自句韓鍾陳列傳論太官句桓榮傳論異端句鄭元傳論泥滯二句左張王列傳論取諸句樊宏傳論以別句盧植傳論高志二句張楷傳論言之四句陳元傳論豈幾二句馮異傳論夫利四句馬援傳論誠能句鮑永傳論使生二句杜喬傳論不亦句鄧禹傳論孔子四句楊震傳論左邱三句寒朗傳論此蓋二句郎豈傳論撰著句楊李列傳論辭甚二句崔駰傳論原其句馬援傳論蠲去句李法傳論亦足句張範列傳論傳稱二句王劉列傳論語云三句延篤傳論信哉句章帝八王傳論
